icado durante sua vigência mesmo depois de cessadas as circunstâncias que a determinaram ou de decorrido o período de sua duração. A armadilha ignora a ultratividade expressamente prevista no Código Penal.","referencia":"Decreto-Lei nº 2.848/1940 (Código Penal), art. 3º.","tags":["Código Penal","lei temporária","ultratividade"]},{"id":"LEG007","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Código Penal — Do crime","subtema":"Desistência voluntária","dificuldade":"facil","enunciado":"Um agente inicia a execução de um delito, mas, podendo prosseguir, voluntariamente interrompe os atos executórios antes de esgotar os meios de que dispunha. Nessa situação, em regra, responde apenas pelos atos já praticados, se estes constituírem infração penal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Na desistência voluntária, o agente voluntariamente deixa de prosseguir na execução e responde somente pelos atos já praticados. A armadilha é confundir o instituto com a tentativa, em que a consumação não ocorre por circunstâncias alheias à vontade do agente.","referencia":"Decreto-Lei nº 2.848/1940 (Código Penal), art. 15.","tags":["Código Penal","desistência voluntária","tentativa"]},{"id":"LEG008","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Código Penal — Do crime","subtema":"Nexo causal e causa superveniente relativamente independente","dificuldade":"intermediaria","enunciado":"Se uma causa relativamente independente sobrevém à conduta do agente e, por si só, produz o resultado, esse resultado continua juridicamente imputável ao agente inicial, embora os fatos anteriores deixem de lhe ser atribuídos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A superveniência de causa relativamente independente exclui a imputação do resultado quando essa causa, por si só, o produz; os fatos anteriores, entretanto, permanecem imputáveis a quem os praticou. A armadilha inverte exatamente as duas consequências previstas no Código Penal.","referencia":"Decreto-Lei nº 2.848/1940 (Código Penal), art. 13, § 1º.","tags":["Código Penal","nexo causal","causa superveniente"]},{"id":"LEG009","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Código Penal — Imputabilidade penal","subtema":"Menoridade penal","dificuldade":"facil","enunciado":"Os menores de dezoito anos são penalmente inimputáveis, ficando sujeitos às normas estabelecidas na legislação especial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O Código Penal adota critério etário objetivo: menores de dezoito anos são penalmente inimputáveis e ficam sujeitos à legislação especial. A armadilha seria condicionar essa inimputabilidade à demonstração concreta de incapacidade de entendimento.","referencia":"Decreto-Lei nº 2.848/1940 (Código Penal), art. 27.","tags":["Código Penal","imputabilidade","menoridade"]},{"id":"LEG010","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Código Penal — Imputabilidade penal","subtema":"Embriaguez e imputabilidade","dificuldade":"facil","enunciado":"A embriaguez voluntária completa, pelo álcool ou por substância de efeitos análogos, exclui a imputabilidade penal quando retirar inteiramente do agente a capacidade de entender o caráter ilícito do fato.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A embriaguez voluntária ou culposa não exclui a imputabilidade penal. A isenção prevista no Código Penal refere-se à embriaguez completa proveniente de caso fortuito ou força maior, quando o agente era inteiramente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento. A armadilha troca a causa da embriaguez.","referencia":"Decreto-Lei nº 2.848/1940 (Código Penal), art. 28, II e § 1º.","tags":["Código Penal","embriaguez","imputabilidade"]},{"id":"LEG011","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 7.716/1989 — Crimes resultantes de discriminação ou preconceito","subtema":"Efeitos da condenação","dificuldade":"intermediaria","enunciado":"A perda do cargo ou função pública prevista na Lei nº 7.716/1989 para o servidor público condenado não constitui efeito automático da condenação, devendo ser motivadamente declarada na sentença.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O art. 16 prevê, para o servidor público, a perda do cargo ou função pública como efeito da condenação; o art. 18 estabelece que os efeitos ali referidos não são automáticos e devem ser motivadamente declarados na sentença. A armadilha é presumir automaticidade apenas porque a consequência está prevista em lei.","referencia":"Lei nº 7.716/1989, arts. 16 e 18.","tags":["racismo","efeitos da condenação","cargo público"]},{"id":"LEG012","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 7.716/1989 — Crimes resultantes de discriminação ou preconceito","subtema":"Injúria racial e discriminação religiosa","dificuldade":"intermediaria","enunciado":"Uma ofensa dirigida à dignidade de alguém exclusivamente em razão de sua religião enquadra-se, por esse só fundamento, no tipo do art. 2º-A da Lei nº 7.716/1989.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O art. 2º-A tipifica a injúria praticada em razão de raça, cor, etnia ou procedência nacional; religião não integra o rol específico desse artigo. A Lei nº 7.716/1989 tutela também a discriminação ou o preconceito religioso em outros dispositivos, conforme a conduta. A armadilha é transportar para o art. 2º-A todas as categorias mencionadas no art. 1º.","referencia":"Lei nº 7.716/1989, arts. 1º, 2º-A e 20.","tags":["racismo","injúria racial","religião"]},{"id":"LEG013","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 8.072/1990 — Crimes Hediondos","subtema":"Homicídio qualificado e tentativa","dificuldade":"intermediaria","enunciado":"O homicídio qualificado previsto no art. 121, § 2º, do Código Penal integra o rol de crimes hediondos e conserva essa natureza tanto na forma consumada quanto na tentada.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Na redação vigente, o art. 1º da Lei nº 8.072/1990 inclui o homicídio qualificado do art. 121, § 2º, do Código Penal, e o caput alcança os crimes enumerados tanto consumados quanto tentados. A armadilha é restringir a hediondez à consumação.","referencia":"Lei nº 8.072/1990, art. 1º, caput e inciso I.","tags":["crimes hediondos","homicídio qualificado","tentativa"]},{"id":"LEG014","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 8.072/1990 — Crimes Hediondos","subtema":"Prazo da prisão temporária nos crimes hediondos","dificuldade":"dificil","enunciado":"Quando cabível prisão temporária por crime hediondo abrangido pela Lei nº 8.072/1990, aplica-se o prazo geral de cinco dias, prorrogável uma única vez por mais cinco dias em caso de extrema e comprovada necessidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Nos crimes abrangidos pela regra especial do art. 2º, § 4º, da Lei nº 8.072/1990, a prisão temporária tem prazo de trinta dias, prorrogável por igual período em caso de extrema e comprovada necessidade. A armadilha é aplicar o prazo geral de cinco dias da Lei nº 7.960/1989 sem observar a disciplina especial dos crimes hediondos e equiparados.","referencia":"Lei nº 8.072/1990, art. 2º, § 4º; Lei nº 7.960/1989, art. 2º, caput.","tags":["crimes hediondos","prisão temporária","prazo"]},{"id":"LEG015","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 8.930/1994 — Alteração da Lei de Crimes Hediondos","subtema":"Relação entre a Lei nº 8.930/1994 e a Lei nº 8.072/1990","dificuldade":"dificil","enunciado":"A Lei nº 8.930/1994 atuou como diploma modificador da Lei nº 8.072/1990: seu art. 1º deu nova redação ao art. 1º da Lei de Crimes Hediondos e incluiu, entre outros, o homicídio praticado em atividade típica de grupo de extermínio, ainda que cometido por um só agente, e o homicídio qualificado; para identificar o rol vigente atualmente, devem ser consideradas também as alterações legislativas posteriores incorporadas à Lei nº 8.072/1990.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A Lei nº 8.930/1994 modificou a Lei nº 8.072/1990 e não deve ser utilizada como se contivesse, isoladamente, o rol atual e imutável dos crimes hediondos. O rol da Lei nº 8.072/1990 recebeu diversas alterações posteriores. A armadilha é congelar a redação introduzida em 1994 como se ela correspondesse integralmente ao texto vigente.","referencia":"Lei nº 8.930/1994, art. 1º; Lei nº 8.072/1990, art. 1º, na redação vigente.","tags":["Lei 8.930/1994","crimes hediondos","alteração legislativa"]},{"id":"LEG016","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 12.850/2013 — Organizações criminosas","subtema":"Conceito legal de organização criminosa","dificuldade":"intermediaria","enunciado":"Para a Lei nº 12.850/2013, considera-se organização criminosa a associação estruturalmente ordenada de três ou mais pessoas, com divisão de tarefas, voltada à obtenção de vantagem mediante infrações penais cujas penas máximas sejam iguais ou superiores a quatro anos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O conceito legal exige quatro ou mais pessoas e infrações penais cujas penas máximas sejam superiores a quatro anos, ou infrações de caráter transnacional. A divisão de tarefas pode ser informal. A armadilha combina dois erros: reduzir o número mínimo de integrantes e substituir 'superiores a quatro anos' por 'iguais ou superiores a quatro anos'.","referencia":"Lei nº 12.850/2013, art. 1º, § 1º.","tags":["organização criminosa","conceito","quatro pessoas"]},{"id":"LEG017","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 12.850/2013 — Organizações criminosas","subtema":"Ação controlada","dificuldade":"dificil","enunciado":"Em investigação de organização criminosa, a equipe policial decide retardar a intervenção relativa a uma ação investigada, mantendo-a sob observação para que a medida legal ocorra no momento mais eficaz à formação de provas e obtenção de informações. A técnica caracteriza ação controlada, e o retardamento deve ser previamente comunicado ao juiz competente, que, se for o caso, estabelecerá limites e comunicará o Ministério Público.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A ação controlada consiste em retardar a intervenção policial ou administrativa relativa à ação praticada por organização criminosa ou a ela vinculada, mantendo-a sob observação e acompanhamento. O retardamento deve ser previamente comunicado ao juiz competente, que poderá estabelecer limites e comunicará o Ministério Público. A armadilha é confundir comunicação judicial prévia com uma exigência legal genérica de autorização judicial constitutiva da técnica.","referencia":"Lei nº 12.850/2013, art. 8º, caput e § 1º.","tags":["organização criminosa","ação controlada","comunicação judicial"]},{"id":"LEG018","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.455/1997 — Crimes de tortura","subtema":"Omissão diante da tortura","dificuldade":"facil","enunciado":"Aquele que se omite diante de uma conduta de tortura, tendo o dever de evitá-la ou apurá-la, está sujeito à mesma pena de reclusão prevista para as modalidades principais do crime de tortura.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A modalidade omissiva do art. 1º, § 2º, é punida com detenção de um a quatro anos, e não com a mesma pena de reclusão das figuras principais do art. 1º. A armadilha é equiparar automaticamente as penas das condutas comissivas e da omissão legalmente tipificada.","referencia":"Lei nº 9.455/1997, art. 1º, caput e § 2º.","tags":["tortura","omissão","pena"]},{"id":"LEG019","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.455/1997 — Crimes de tortura","subtema":"Efeitos da condenação do agente público","dificuldade":"intermediaria","enunciado":"A Lei de Tortura prevê que a condenação acarretará a perda do cargo, função ou emprego público e a interdição para seu exercício pelo dobro do prazo da pena aplicada.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O art. 1º, § 5º, prevê expressamente a perda do cargo, função ou emprego público e a interdição para seu exercício pelo dobro do prazo da pena aplicada. A armadilha é confundir esse regime legal com diplomas que exigem disciplina distinta para determinados efeitos da condenação.","referencia":"Lei nº 9.455/1997, art. 1º, § 5º.","tags":["tortura","agente público","efeitos da condenação"]},{"id":"LEG020","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.605/1998 — Crimes ambientais","subtema":"Responsabilidade penal da pessoa jurídica","dificuldade":"intermediaria","enunciado":"Reconhecida a responsabilidade penal de uma pessoa jurídica por crime ambiental, fica juridicamente excluída, pelo mesmo fato, a responsabilização penal das pessoas físicas que tenham atuado como autoras, coautoras ou partícipes.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A responsabilidade da pessoa jurídica não exclui a das pessoas físicas autoras, coautoras ou partícipes do mesmo fato. A armadilha é tratar as responsabilidades como alternativas ou mutuamente excludentes.","referencia":"Lei nº 9.605/1998, art. 3º e parágrafo único.","tags":["crimes ambientais","pessoa jurídica","responsabilidade penal"]},{"id":"LEG021","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.605/1998 — Crimes ambientais","subtema":"Responsabilidade por omissão de dirigentes e responsáveis","dificuldade":"intermediaria","enunciado":"O administrador de pessoa jurídica que saiba da conduta criminosa ambiental de terceiro e deixe de impedir sua prática, embora pudesse agir para evitá-la, pode incidir nas penas correspondentes, na medida de sua culpabilidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O art. 2º alcança, entre outros, diretor e administrador que, sabendo da conduta criminosa de outrem, deixa de impedi-la quando podia agir para evitá-la, sempre na medida de sua culpabilidade. A armadilha é imaginar que somente quem executa materialmente a conduta ambiental pode responder.","referencia":"Lei nº 9.605/1998, art. 2º.","tags":["crimes ambientais","omissão","administrador"]},{"id":"LEG022","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 10.826/2003 — Estatuto do Desarmamento","subtema":"Sinarm e armas das Forças Auxiliares","dificuldade":"facil","enunciado":"Para fins das competências do Sinarm enumeradas no art. 2º do Estatuto do Desarmamento, as armas de fogo das Forças Auxiliares que constem de seus registros próprios são expressamente alcançadas pelo referido artigo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O parágrafo único do art. 2º dispõe que as previsões desse artigo não alcançam as armas de fogo das Forças Armadas e Auxiliares, bem como as demais que constem de seus registros próprios. A armadilha é ignorar a exceção expressa ao âmbito das competências cadastrais ali enumeradas.","referencia":"Lei nº 10.826/2003, art. 2º, parágrafo único.","tags":["Estatuto do Desarmamento","Sinarm","Forças Auxiliares"]},{"id":"LEG023","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 10.826/2003 — Estatuto do Desarmamento","subtema":"Porte de arma por integrantes da Polícia Militar","dificuldade":"dificil","enunciado":"Os integrantes das polícias militares estão entre as categorias abrangidas pelo art. 6º, II, da Lei nº 10.826/2003 e, nos termos do regulamento, têm direito de portar arma de fogo de propriedade particular ou fornecida pela corporação mesmo fora de serviço, com validade em âmbito nacional.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Os policiais militares integram os órgãos referidos no art. 144, V, da Constituição e estão abrangidos pelo art. 6º, II, do Estatuto do Desarmamento. O § 1º assegura às pessoas do inciso II o porte de arma particular ou institucional mesmo fora de serviço, nos termos do regulamento, com validade nacional. A armadilha seria proibir genericamente o porte fora de serviço ou tratá-lo como independente das condições regulamentares.","referencia":"Lei nº 10.826/2003, art. 6º, II e § 1º; Constituição Federal, art. 144, V.","tags":["Estatuto do Desarmamento","polícia militar","porte de arma"]},{"id":"LEG024","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 11.343/2006 — Lei de Drogas","subtema":"Tráfico sem finalidade lucrativa","dificuldade":"intermediaria","enunciado":"A ausência de finalidade lucrativa impede, por si só, o enquadramento de uma conduta no art. 33, caput, da Lei de Drogas, pois o tipo exige vantagem econômica decorrente da comercialização da substância.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O art. 33, caput, inclui diversas condutas, entre elas entregar a consumo ou fornecer drogas, ainda que gratuitamente, sem autorização ou em desacordo com determinação legal ou regulamentar. A inexistência de lucro, isoladamente, não exclui o tipo. A armadilha é acrescentar elemento econômico que a lei não exige.","referencia":"Lei nº 11.343/2006, art. 33, caput; ver também art. 33, § 3º.","tags":["Lei de Drogas","tráfico","gratuidade"]},{"id":"LEG025","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 11.343/2006 — Lei de Drogas","subtema":"Associação para o tráfico","dificuldade":"intermediaria","enunciado":"O tipo do art. 35 da Lei nº 11.343/2006 descreve a associação de duas ou mais pessoas para o fim de praticar, reiteradamente ou não, crimes previstos no art. 33, caput e § 1º, e no art. 34 da mesma lei.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O caput do art. 35 exige associação de duas ou mais pessoas para o fim de praticar, reiteradamente ou não, qualquer dos crimes previstos no art. 33, caput e § 1º, e no art. 34. A armadilha é exigir três ou mais pessoas ou alterar o recorte dos delitos-fim descritos no dispositivo.","referencia":"Lei nº 11.343/2006, art. 35, caput.","tags":["Lei de Drogas","associação para o tráfico","duas pessoas"]},{"id":"LEG026","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 11.340/2006 — Lei Maria da Penha","subtema":"Relação íntima de afeto e coabitação","dificuldade":"intermediaria","enunciado":"A Lei Maria da Penha não pode incidir em violência praticada por ex-namorado que jamais tenha morado com a ofendida, porque a relação íntima de afeto prevista no art. 5º, III, exige coabitação anterior.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O art. 5º, III, alcança qualquer relação íntima de afeto na qual o agressor conviva ou tenha convivido com a ofendida, independentemente de coabitação. Devem estar presentes os demais pressupostos de incidência da Lei Maria da Penha. A armadilha é transformar convivência afetiva em exigência de residência comum.","referencia":"Lei nº 11.340/2006, art. 5º, III e parágrafo único; art. 40-A.","tags":["Lei Maria da Penha","relação íntima","coabitação"]},{"id":"LEG027","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 11.340/2006 — Lei Maria da Penha","subtema":"Inaplicabilidade da Lei nº 9.099/1995","dificuldade":"dificil","enunciado":"Em crime praticado com violência doméstica e familiar contra a mulher, o fato de a pena máxima abstrata não ultrapassar dois anos não autoriza, por esse motivo, a aplicação da Lei nº 9.099/1995, porque a Lei Maria da Penha afasta essa lei independentemente da pena prevista.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O art. 41 estabelece que, aos crimes praticados com violência doméstica e familiar contra a mulher, não se aplica a Lei nº 9.099/1995, independentemente da pena prevista. A armadilha é aplicar isoladamente o conceito geral de infração de menor potencial ofensivo e ignorar a regra especial da Lei Maria da Penha.","referencia":"Lei nº 11.340/2006, art. 41; Lei nº 9.099/1995, art. 61.","tags":["Lei Maria da Penha","Juizado Especial","artigo 41"]},{"id":"LEG028","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.503/1997 — Código de Trânsito Brasileiro","subtema":"Prova da alteração da capacidade psicomotora","dificuldade":"intermediaria","enunciado":"Para a caracterização do crime do art. 306 do CTB, a alteração da capacidade psicomotora somente pode ser demonstrada pela medição de concentração de álcool no sangue ou no ar alveolar, sendo juridicamente insuficientes vídeo, prova testemunhal ou exame clínico.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CTB admite, além das medições objetivas previstas no § 1º, a constatação por sinais e estabelece que a verificação pode ocorrer por teste de alcoolemia ou toxicológico, exame clínico, perícia, vídeo, prova testemunhal ou outros meios de prova em direito admitidos, observado o direito à contraprova. A armadilha é tratar a medição de álcool como meio exclusivo.","referencia":"Lei nº 9.503/1997 (CTB), art. 306, §§ 1º e 2º.","tags":["CTB","embriaguez ao volante","prova"]},{"id":"LEG029","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.503/1997 — Código de Trânsito Brasileiro","subtema":"Socorro à vítima e prisão em flagrante","dificuldade":"dificil","enunciado":"Em sinistro de trânsito com vítima, se o condutor prestar pronto e integral socorro à vítima, o CTB determina que não lhe seja imposta prisão em flagrante nem exigida fiança em razão do sinistro, sem que isso signifique exclusão automática de eventual responsabilidade penal pelo fato.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O art. 301 prevê expressamente a não imposição de prisão em flagrante e a não exigência de fiança ao condutor que presta pronto e integral socorro à vítima. A norma não exclui eventual responsabilidade criminal pelo delito de trânsito. A armadilha é confundir consequência processual imediata com causa de exclusão do crime ou da pena.","referencia":"Lei nº 9.503/1997 (CTB), art. 301.","tags":["CTB","socorro à vítima","prisão em flagrante"]},{"id":"LEG030","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 8.069/1990 — Estatuto da Criança e do Adolescente","subtema":"Conceito de criança e adolescente","dificuldade":"facil","enunciado":"Para o ECA, a pessoa que já completou doze anos de idade ainda é considerada criança até o dia em que completar treze anos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Criança é a pessoa até doze anos de idade incompletos; adolescente é aquela entre doze e dezoito anos de idade. Portanto, ao completar doze anos, a pessoa ingressa na faixa legal da adolescência. A armadilha está na leitura equivocada da expressão 'até doze anos de idade incompletos'.","referencia":"Lei nº 8.069/1990 (ECA), art. 2º.","tags":["ECA","criança","adolescente"]},{"id":"LEG031","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 8.069/1990 — Estatuto da Criança e do Adolescente","subtema":"Privação de liberdade e internação provisória","dificuldade":"dificil","enunciado":"Fora da hipótese de flagrante de ato infracional, o adolescente somente pode ser privado de liberdade por ordem escrita e fundamentada da autoridade judiciária competente; se for determinada internação antes da sentença, o prazo máximo é de quarenta e cinco dias, mediante decisão fundamentada em indícios suficientes de autoria e materialidade e na necessidade imperiosa da medida.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O item combina corretamente a garantia do art. 106 com o limite temporal e os requisitos da internação antes da sentença previstos no art. 108. A armadilha seria admitir privação de liberdade, fora do flagrante, sem ordem judicial escrita e fundamentada ou tratar os quarenta e cinco dias como prazo ordinariamente prorrogável.","referencia":"Lei nº 8.069/1990 (ECA), arts. 106 e 108, caput e parágrafo único.","tags":["ECA","internação provisória","liberdade"]},{"id":"LEG032","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 13.869/2019 — Abuso de Autoridade","subtema":"Elemento subjetivo específico e divergência interpretativa","dificuldade":"intermediaria","enunciado":"A mera divergência na interpretação da lei ou na avaliação de fatos e provas pode, por si só, configurar crime de abuso de autoridade quando a decisão cause prejuízo a alguém, ainda que ausente qualquer finalidade específica do agente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A lei exige finalidade específica de prejudicar outrem, beneficiar a si mesmo ou a terceiro, ou agir por mero capricho ou satisfação pessoal; além disso, afirma expressamente que divergência na interpretação da lei ou na avaliação de fatos e provas não configura abuso de autoridade. A armadilha elimina o elemento subjetivo específico e criminaliza mera divergência interpretativa.","referencia":"Lei nº 13.869/2019, art. 1º, §§ 1º e 2º.","tags":["abuso de autoridade","dolo específico","divergência interpretativa"]},{"id":"LEG033","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 13.869/2019 — Abuso de Autoridade","subtema":"Sujeito ativo","dificuldade":"intermediaria","enunciado":"A condição de sujeito ativo dos crimes de abuso de autoridade não se restringe ao servidor público efetivo: a lei alcança qualquer agente público, servidor ou não, e considera agente público inclusive quem exerça função pública transitoriamente ou sem remuneração, nas formas de investidura ou vínculo previstas no diploma.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A lei adota conceito amplo de agente público e inclui expressamente servidores públicos, militares e outras autoridades, além de quem exerça mandato, cargo, emprego ou função ainda que transitoriamente ou sem remuneração, pelas formas de investidura ou vínculo previstas no parágrafo único. A armadilha é restringir o sujeito ativo ao ocupante efetivo de cargo público.","referencia":"Lei nº 13.869/2019, art. 2º, caput, inciso I e parágrafo único.","tags":["abuso de autoridade","sujeito ativo","agente público"]},{"id":"LEG034","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 7.960/1989 — Prisão Temporária","subtema":"Competência para decretação","dificuldade":"intermediaria","enunciado":"Presentes os requisitos legais, a autoridade policial pode decretar diretamente a prisão temporária por cinco dias, submetendo a medida ao juiz apenas para ratificação posterior no prazo de vinte e quatro horas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A prisão temporária é decretada pelo juiz, diante de representação da autoridade policial ou requerimento do Ministério Público. Em caso de representação policial, o juiz ouvirá o Ministério Público antes de decidir, e o despacho judicial deve ser prolatado em vinte e quatro horas do recebimento da representação ou do requerimento. A armadilha é atribuir à autoridade policial poder de decretar prisão temporária.","referencia":"Lei nº 7.960/1989, art. 2º, caput e §§ 1º e 2º.","tags":["prisão temporária","competência","autoridade judicial"]},{"id":"LEG035","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 7.960/1989 — Prisão Temporária","subtema":"Término do prazo e soltura","dificuldade":"dificil","enunciado":"Decorrido o prazo indicado no mandado de prisão temporária, a autoridade responsável pela custódia deve colocar imediatamente o preso em liberdade, independentemente de nova ordem judicial, salvo se já tiver sido comunicada da prorrogação da prisão temporária ou da decretação de prisão preventiva; o dia do cumprimento do mandado integra o cômputo do prazo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Ao término do prazo contido no mandado, a autoridade responsável pela custódia deve pôr imediatamente o preso em liberdade, independentemente de nova ordem judicial, ressalvadas a prorrogação da prisão temporária já comunicada ou a decretação de prisão preventiva. O dia do cumprimento do mandado inclui-se no cômputo do prazo. A armadilha é exigir nova ordem de soltura ou excluir o primeiro dia da contagem.","referencia":"Lei nº 7.960/1989, art. 2º, §§ 4º-A, 7º e 8º.","tags":["prisão temporária","soltura","contagem de prazo"]},{"id":"LEG036","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.099/1995 — Juizados Especiais Criminais","subtema":"Infração de menor potencial ofensivo","dificuldade":"intermediaria","enunciado":"Para a Lei nº 9.099/1995, infração penal de menor potencial ofensivo é apenas o crime cuja pena máxima não exceda um ano, ficando excluídas as contravenções penais e os delitos sujeitos a procedimento especial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O conceito vigente abrange as contravenções penais e os crimes a que a lei comine pena máxima não superior a dois anos, cumulada ou não com multa. A armadilha reproduz critérios de redação legislativa superada e exclui categorias alcançadas pelo texto atual.","referencia":"Lei nº 9.099/1995, art. 61.","tags":["Juizados Especiais","menor potencial ofensivo","artigo 61"]},{"id":"LEG037","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 9.099/1995 — Juizados Especiais Criminais","subtema":"Termo circunstanciado e prisão em flagrante","dificuldade":"intermediaria","enunciado":"Nos casos submetidos à Lei nº 9.099/1995, após a lavratura do termo circunstanciado, se o autor do fato for imediatamente encaminhado ao juizado ou assumir compromisso de a ele comparecer, não se imporá prisão em flagrante nem se exigirá fiança.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Essa é a regra do parágrafo único do art. 69 para as infrações submetidas ao regime da Lei nº 9.099/1995. A armadilha é presumir que toda situação inicialmente constatada em flagrante exige necessariamente prisão e arbitramento de fiança, sem observar o procedimento legal do Juizado Especial Criminal.","referencia":"Lei nº 9.099/1995, art. 69, caput e parágrafo único.","tags":["Juizados Especiais","termo circunstanciado","flagrante"]},{"id":"LEG038","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei nº 10.259/2001 — Juizados Especiais Federais","subtema":"Juizado Especial Federal Criminal e redação vigente do art. 2º","dificuldade":"dificil","enunciado":"Na redação vigente da Lei nº 10.259/2001, o parágrafo único do art. 2º ainda define autonomamente infração de menor potencial ofensivo como o crime cuja pena máxima não seja superior a dois anos, ou multa.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Essa definição constava da redação anterior do parágrafo único do art. 2º. Desde a Lei nº 11.313/2006, o parágrafo único trata da reunião de processos por conexão ou continência e determina a observância dos institutos da transação penal e da composição dos danos civis. A Lei nº 10.259/2001 determina ainda a aplicação da Lei nº 9.099/1995 no que não conflitar com ela. A armadilha é utilizar redação histórica revogada como se fosse vigente.","referencia":"Lei nº 10.259/2001, arts. 1º e 2º, caput e parágrafo único, com redação da Lei nº 11.313/2006; Lei nº 9.099/1995, art. 61.","tags":["Juizado Especial Federal","redação vigente","menor potencial ofensivo"]},{"id":"LEG039","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei Federal nº 14.751/2023 — Lei Orgânica Nacional das Polícias Militares e dos Corpos de Bombeiros Militares","subtema":"Natureza institucional e integração ao Susp","dificuldade":"facil","enunciado":"A Lei nº 14.751/2023 qualifica as polícias militares e os corpos de bombeiros militares dos Estados, do Distrito Federal e dos Territórios como instituições militares e permanentes, indispensáveis à preservação da ordem pública e integrantes do Sistema Único de Segurança Pública.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A Lei Orgânica Nacional estabelece expressamente essas características: natureza militar, caráter permanente, indispensabilidade à preservação da ordem pública e integração ao Sistema Único de Segurança Pública. A armadilha é tratar a integração ao Susp como incompatível com a natureza militar das instituições.","referencia":"Lei nº 14.751/2023, art. 2º, caput e § 3º, I, II, III e V, 'a'.","tags":["Lei Orgânica Nacional","Polícia Militar","Susp"]},{"id":"LEG040","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei Federal nº 14.751/2023 — Lei Orgânica Nacional das Polícias Militares e dos Corpos de Bombeiros Militares","subtema":"Polícia judiciária militar","dificuldade":"dificil","enunciado":"Como as polícias militares integram o Susp e devem atuar de forma cooperada com outros órgãos de segurança pública, a Lei nº 14.751/2023 estabelece competência concorrente entre a Polícia Militar e os demais órgãos do art. 144 da Constituição para executar a polícia judiciária militar dos Estados, do Distrito Federal e dos Territórios.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A Lei nº 14.751/2023 atribui às polícias militares a execução, ressalvada a competência da União, da polícia de preservação da ordem pública, da polícia ostensiva e, privativamente, da polícia judiciária militar dos Estados, do Distrito Federal e dos Territórios. A atuação integrada e cooperada prevista na própria lei deve ocorrer nos limites das atribuições constitucionais e legais. A armadilha é confundir integração institucional com competência concorrente para polícia judiciária militar.","referencia":"Lei nº 14.751/2023, art. 5º, II e XXI.","tags":["Lei Orgânica Nacional","polícia judiciária militar","competência"]}],"administrativo":[{"id":"ADM001","area":"Noções de Direito Administrativo","tema":"Princípios do Direito Administrativo","subtema":"princípio da legalidade e atuação administrativa","dificuldade":"facil","enunciado":"Julgue o item a seguir. Um agente público, no exercício de função administrativa, pode praticar qualquer conduta que não esteja expressamente proibida em lei, pois o princípio da legalidade administrativa lhe assegura a mesma autonomia reconhecida aos particulares.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A legalidade administrativa não se confunde com a autonomia privada. O particular, em regra, pode fazer o que a lei não proíbe; a Administração e seus agentes devem atuar conforme o ordenamento e dentro das competências juridicamente atribuídas. A inexistência de proibição, por si só, não autoriza a atuação administrativa.","referencia":"Constituição Federal de 1988, art. 37, caput; princípio da legalidade administrativa.","tags":["principios","legalidade","administracao-publica"]},{"id":"ADM002","area":"Noções de Direito Administrativo","tema":"Princípios do Direito Administrativo","subtema":"impessoalidade e publicidade institucional","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Em campanha oficial destinada a orientar a população sobre serviço público, é vedada a utilização de nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos, restrição relacionada, entre outros fundamentos, ao princípio da impessoalidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deve ter caráter educativo, informativo ou de orientação social, não podendo conter elementos que caracterizem promoção pessoal de autoridades ou servidores. A regra concretiza especialmente a impessoalidade administrativa.","referencia":"Constituição Federal de 1988, art. 37, caput e § 1º.","tags":["principios","impessoalidade","publicidade"]},{"id":"ADM003","area":"Noções de Direito Administrativo","tema":"Princípios do Direito Administrativo","subtema":"moralidade administrativa e juridicidade","dificuldade":"dificil","enunciado":"Julgue o item a seguir. A moralidade administrativa constitui parâmetro meramente ético, sem conteúdo jurídico próprio; por isso, um ato praticado com deslealdade institucional não pode ser invalidado com fundamento na moralidade se tiver observado formalmente a competência e a forma previstas em lei.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A moralidade é princípio jurídico expresso da Administração Pública e integra o controle de validade da atuação administrativa. A observância formal de competência e forma não impede a invalidação de conduta incompatível com padrões jurídicos de probidade, lealdade e boa-fé administrativa.","referencia":"Constituição Federal de 1988, art. 37, caput; doutrina de Direito Administrativo sobre moralidade administrativa.","tags":["principios","moralidade","validade"]},{"id":"ADM004","area":"Noções de Direito Administrativo","tema":"Princípios do Direito Administrativo","subtema":"eficiência e compatibilidade com a legalidade","dificuldade":"facil","enunciado":"Julgue o item a seguir. O princípio da eficiência exige que a Administração busque resultados adequados e boa utilização dos recursos públicos, mas não autoriza o agente público a afastar exigência legal sob o argumento de que determinado procedimento seria mais rápido.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A eficiência deve ser perseguida em harmonia com os demais princípios administrativos, inclusive a legalidade. Não existe autorização geral para descumprir a lei em nome de maior rapidez ou conveniência.","referencia":"Constituição Federal de 1988, art. 37, caput.","tags":["principios","eficiencia","legalidade"]},{"id":"ADM005","area":"Noções de Direito Administrativo","tema":"Regime jurídico-administrativo","subtema":"supremacia do interesse público e prerrogativas administrativas","dificuldade":"facil","enunciado":"Julgue o item a seguir. As prerrogativas conferidas à Administração pelo regime jurídico-administrativo destinam-se à realização do interesse público e não autorizam atuação arbitrária ou desvinculada da lei.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. As prerrogativas administrativas existem para permitir a satisfação das finalidades públicas e são juridicamente limitadas. Supremacia do interesse público não significa poder ilimitado nem afasta legalidade, proporcionalidade, finalidade e controle.","referencia":"Doutrina de Direito Administrativo sobre regime jurídico-administrativo, supremacia do interesse público e legalidade.","tags":["regime-juridico","supremacia","prerrogativas"]},{"id":"ADM006","area":"Noções de Direito Administrativo","tema":"Regime jurídico-administrativo","subtema":"indisponibilidade do interesse público","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Em razão do princípio da indisponibilidade do interesse público, a autoridade administrativa é considerada proprietária dos interesses e bens públicos sob sua gestão e pode renunciar livremente a direitos da Administração sempre que entender a renúncia conveniente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A autoridade não é proprietária do interesse público. Atua como gestora de interesses que pertencem à coletividade e somente pode dispor de direitos, bens ou competências nos limites e hipóteses admitidos pelo ordenamento. A conveniência pessoal da autoridade não basta para legitimar uma renúncia.","referencia":"Doutrina de Direito Administrativo sobre indisponibilidade do interesse público.","tags":["regime-juridico","indisponibilidade","interesse-publico"]},{"id":"ADM007","area":"Noções de Direito Administrativo","tema":"Regime jurídico-administrativo","subtema":"prerrogativas e sujeições da Administração","dificuldade":"dificil","enunciado":"Julgue o item a seguir. O regime jurídico-administrativo combina prerrogativas destinadas à tutela do interesse público com sujeições impostas à Administração, razão pela qual a existência de poderes especiais, como certas formas de atuação unilateral, convive com limitações como legalidade, finalidade e controle.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O regime administrativo não é composto apenas por prerrogativas. Ele também submete a Administração a restrições e deveres específicos. Essa combinação explica a posição diferenciada da Administração sem transformá-la em poder juridicamente ilimitado.","referencia":"Doutrina de Direito Administrativo sobre regime jurídico-administrativo, prerrogativas e sujeições.","tags":["regime-juridico","prerrogativas","sujeicoes"]},{"id":"ADM008","area":"Noções de Direito Administrativo","tema":"Poderes da administração pública","subtema":"poder hierárquico e ausência de hierarquia entre pessoas jurídicas","dificuldade":"facil","enunciado":"Julgue o item a seguir. O secretário de Estado exerce poder hierárquico sobre uma autarquia estadual apenas porque essa entidade integra a administração indireta vinculada à sua área, podendo dar ordens aos dirigentes da autarquia como se eles fossem subordinados internos da secretaria.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Não há relação hierárquica entre a Administração direta e uma autarquia, pois são pessoas jurídicas distintas. Pode existir vinculação, supervisão ou tutela administrativa nos limites legais, mas isso não equivale à subordinação hierárquica existente dentro da mesma estrutura administrativa.","referencia":"Doutrina de Direito Administrativo sobre poder hierárquico, descentralização e tutela administrativa.","tags":["poder-hierarquico","autarquia","tutela"]},{"id":"ADM009","area":"Noções de Direito Administrativo","tema":"Poderes da administração pública","subtema":"poder disciplinar e vínculo especial com a Administração","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. O poder disciplinar pode alcançar não apenas servidores públicos, mas também particulares sujeitos a vínculo jurídico especial com a Administração, como o contratado que descumpra dever contratual e esteja submetido às sanções previstas em lei e no ajuste.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Na classificação doutrinária tradicional, o poder disciplinar alcança pessoas submetidas a relações especiais de sujeição perante a Administração. Além dos servidores, pode alcançar particulares ligados à Administração por vínculo específico, respeitados a base legal, o devido processo e as regras próprias da relação.","referencia":"Doutrina de Direito Administrativo sobre poder disciplinar; Lei nº 14.133/2021, regime sancionatório aplicável aos contratados.","tags":["poder-disciplinar","sancao","vinculo-especial"]},{"id":"ADM010","area":"Noções de Direito Administrativo","tema":"Poderes da administração pública","subtema":"poder de polícia administrativa","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Ao condicionar determinada atividade privada ao atendimento de requisitos de segurança previstos em lei, a Administração pode exercer poder de polícia, restringindo ou condicionando direitos e atividades individuais em benefício do interesse coletivo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O poder de polícia permite condicionar ou restringir o exercício de direitos, liberdades e atividades privadas para compatibilizá-los com interesses coletivos juridicamente protegidos. A atuação deve observar competência, finalidade, legalidade e proporcionalidade.","referencia":"Código Tributário Nacional, art. 78; doutrina de Direito Administrativo sobre poder de polícia.","tags":["poder-de-policia","restricao","interesse-coletivo"]},{"id":"ADM011","area":"Noções de Direito Administrativo","tema":"Poderes da administração pública","subtema":"abuso de poder, excesso de poder e desvio de finalidade","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Se uma autoridade competente para aplicar determinada medida utiliza essa competência com o objetivo real de perseguir pessoalmente um administrado, ocorre excesso de poder, ao passo que haverá desvio de finalidade quando a autoridade atuar sem possuir competência para praticar o ato.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado porque os conceitos foram invertidos. O excesso de poder ocorre quando o agente ultrapassa os limites de sua competência. O desvio de finalidade, ou desvio de poder, ocorre quando o agente é competente, mas pratica o ato visando finalidade diversa daquela prevista pelo ordenamento, como perseguição pessoal.","referencia":"Doutrina de Direito Administrativo sobre abuso de poder, excesso de poder e desvio de finalidade.","tags":["abuso-de-poder","excesso-de-poder","desvio-de-finalidade"]},{"id":"ADM012","area":"Noções de Direito Administrativo","tema":"Serviço público","subtema":"serviço adequado e princípio da continuidade","dificuldade":"facil","enunciado":"Julgue o item a seguir. Segundo a legislação de concessões e permissões, a prestação de serviço adequado envolve, entre outras condições, regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e modicidade das tarifas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A Lei nº 8.987/1995 enumera essas condições ao definir serviço adequado, parâmetro que deve orientar a prestação dos serviços concedidos ou permitidos.","referencia":"Lei nº 8.987/1995, art. 6º, § 1º.","tags":["servico-publico","continuidade","servico-adequado"]},{"id":"ADM013","area":"Noções de Direito Administrativo","tema":"Serviço público","subtema":"concessão de serviço público e formalização contratual","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A concessão de serviço público pode ser outorgada verbalmente e a título precário, independentemente de contrato, desde que o particular demonstre capacidade para prestar o serviço e aceite a fiscalização estatal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A concessão de serviço público é formalizada mediante contrato e se submete ao regime constitucional e legal próprio, inclusive à prévia licitação. A descrição de outorga verbal e precária não corresponde ao regime jurídico da concessão.","referencia":"Constituição Federal de 1988, art. 175; Lei nº 8.987/1995, arts. 2º, II, e 4º.","tags":["servico-publico","concessao","contrato"]},{"id":"ADM014","area":"Noções de Direito Administrativo","tema":"Serviço público","subtema":"permissão de serviço público","dificuldade":"dificil","enunciado":"Julgue o item a seguir. A permissão de serviço público, nos termos da Lei nº 8.987/1995, é formalizada mediante contrato de adesão e conserva caráter precário e revogabilidade unilateral pelo poder concedente, observadas as regras legais aplicáveis e a prévia licitação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A legislação define a permissão como delegação a título precário, precedida de licitação, e determina sua formalização por contrato de adesão, inclusive quanto à precariedade e à revogabilidade unilateral pelo poder concedente.","referencia":"Constituição Federal de 1988, art. 175; Lei nº 8.987/1995, arts. 2º, IV, e 40.","tags":["servico-publico","permissao","delegacao"]},{"id":"ADM015","area":"Noções de Direito Administrativo","tema":"Atos administrativos","subtema":"elementos do ato administrativo: competência e finalidade","dificuldade":"facil","enunciado":"Julgue o item a seguir. A competência e a finalidade são elementos do ato administrativo e, por serem sempre livremente escolhidos pelo agente público, podem ser modificados conforme sua conveniência pessoal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Competência e finalidade são elementos juridicamente definidos. O agente deve atuar dentro da competência que lhe foi atribuída e perseguir a finalidade pública prevista no ordenamento. Não há liberdade para redefini-los segundo conveniência pessoal.","referencia":"Doutrina de Direito Administrativo sobre os elementos do ato administrativo: competência, finalidade, forma, motivo e objeto.","tags":["atos-administrativos","competencia","finalidade"]},{"id":"ADM016","area":"Noções de Direito Administrativo","tema":"Atos administrativos","subtema":"presunção de legitimidade dos atos administrativos","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A presunção de legitimidade do ato administrativo permite que ele seja considerado conforme o direito até que essa presunção seja afastada pelos meios juridicamente cabíveis, mas não o torna imune a impugnação administrativa ou judicial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A presunção de legitimidade é relativa, e não absoluta. O ato é presumido conforme o direito até que essa presunção seja afastada, podendo ser questionado e invalidado quando demonstrada ilegalidade.","referencia":"Doutrina de Direito Administrativo sobre atributos dos atos administrativos.","tags":["atos-administrativos","presuncao-de-legitimidade","controle"]},{"id":"ADM017","area":"Noções de Direito Administrativo","tema":"Atos administrativos","subtema":"autoexecutoriedade dos atos administrativos","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A autoexecutoriedade é atributo presente em todos os atos administrativos e autoriza a Administração, em qualquer hipótese, a executar materialmente suas decisões sem necessidade de previsão legal ou situação de urgência.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A autoexecutoriedade não está presente em todos os atos administrativos. Em termos gerais, a execução direta pela Administração é admitida quando houver previsão legal ou quando situação urgente, reconhecida pelo ordenamento, justificar a atuação imediata. Determinadas medidas dependem de intervenção judicial.","referencia":"Doutrina de Direito Administrativo sobre atributos dos atos administrativos, especialmente autoexecutoriedade.","tags":["atos-administrativos","autoexecutoriedade","atributos"]},{"id":"ADM018","area":"Noções de Direito Administrativo","tema":"Atos administrativos","subtema":"anulação e revogação dos atos administrativos","dificuldade":"dificil","enunciado":"Julgue o item a seguir. A Administração pode anular seus próprios atos quando ilegais e revogar atos válidos por razões de conveniência e oportunidade, respeitados os limites jurídicos; ao Poder Judiciário, no exercício da função jurisdicional, cabe controlar a legalidade do ato administrativo, não substituindo a Administração para revogá-lo por mero juízo de mérito.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A anulação decorre de ilegalidade, enquanto a revogação pressupõe ato válido que deixou de ser conveniente ou oportuno e somente incide quando juridicamente cabível. O Judiciário pode invalidar ato ilegal, mas não realiza revogação administrativa fundada apenas em mérito.","referencia":"Súmula 473 do STF; doutrina de Direito Administrativo sobre autotutela, anulação e revogação.","tags":["atos-administrativos","anulacao","revogacao"]},{"id":"ADM019","area":"Noções de Direito Administrativo","tema":"Contratos administrativos","subtema":"cláusulas econômico-financeiras e alteração unilateral","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Nos contratos regidos pela Lei nº 14.133/2021, a Administração pode alterar unilateralmente as cláusulas econômico-financeiras e monetárias sempre que considerar a mudança conveniente ao interesse público, independentemente da concordância do contratado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A Lei nº 14.133/2021 prevê prerrogativas de alteração unilateral em hipóteses legais, mas estabelece que as cláusulas econômico-financeiras e monetárias não podem ser alteradas sem prévia concordância do contratado. Se alteração unilateral admitida em lei aumentar ou diminuir seus encargos, deve ser restabelecido o equilíbrio econômico-financeiro inicial.","referencia":"Lei nº 14.133/2021, art. 104, I e §§ 1º e 2º, e art. 130.","tags":["contratos-administrativos","alteracao-unilateral","equilibrio-economico"]},{"id":"ADM020","area":"Noções de Direito Administrativo","tema":"Contratos administrativos","subtema":"prerrogativas de fiscalização e sanção contratual","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. O regime dos contratos administrativos previsto na Lei nº 14.133/2021 confere à Administração, entre outras prerrogativas, fiscalizar a execução do contrato e aplicar sanções motivadas pela inexecução total ou parcial do ajuste, observadas as garantias processuais cabíveis.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A fiscalização da execução e a aplicação de sanções motivadas pela inexecução total ou parcial são prerrogativas expressamente reconhecidas pela Lei nº 14.133/2021. O exercício do poder sancionatório deve respeitar as garantias processuais aplicáveis.","referencia":"Lei nº 14.133/2021, art. 104, III e IV, e arts. 155 a 163.","tags":["contratos-administrativos","fiscalizacao","sancoes"]},{"id":"ADM021","area":"Noções de Direito Administrativo","tema":"Contratos administrativos","subtema":"limites quantitativos das alterações unilaterais","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Em qualquer contrato sujeito à Lei nº 14.133/2021, a Administração pode impor ao contratado acréscimos ou supressões de até 50% do valor inicial atualizado, pois esse percentual constitui o limite geral das alterações unilaterais quantitativas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O limite geral para acréscimos ou supressões nas alterações unilaterais quantitativas é de até 25% do valor inicial atualizado do contrato. O limite de 50% aplica-se especificamente aos acréscimos no caso de reforma de edifício ou de equipamento, e não constitui limite geral para qualquer contrato.","referencia":"Lei nº 14.133/2021, arts. 124, I, \"b\", e 125.","tags":["contratos-administrativos","alteracao-quantitativa","limites"]},{"id":"ADM022","area":"Noções de Direito Administrativo","tema":"Licitação","subtema":"modalidades de licitação na Lei nº 14.133/2021","dificuldade":"facil","enunciado":"Julgue o item a seguir. A Lei nº 14.133/2021 prevê como modalidades de licitação o pregão, a concorrência, o concurso, o leilão e o diálogo competitivo e veda a criação de outras modalidades ou a combinação entre as modalidades nela previstas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Essas são as cinco modalidades previstas na Lei nº 14.133/2021, que expressamente proíbe tanto a criação de novas modalidades quanto a combinação das modalidades legais.","referencia":"Lei nº 14.133/2021, art. 28.","tags":["licitacao","modalidades","lei-14133"]},{"id":"ADM023","area":"Noções de Direito Administrativo","tema":"Licitação","subtema":"cabimento do pregão","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Pela Lei nº 14.133/2021, o pregão deve ser utilizado para qualquer obra de engenharia e para serviços técnicos especializados de natureza predominantemente intelectual, desde que a Administração adote como critério de julgamento o menor preço.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O pregão é adotado quando o objeto possui padrões de desempenho e qualidade que possam ser objetivamente definidos por especificações usuais de mercado. Ele não se aplica às obras nem aos serviços técnicos especializados de natureza predominantemente intelectual; quanto aos serviços de engenharia, a lei admite pregão para os serviços comuns de engenharia.","referencia":"Lei nº 14.133/2021, arts. 6º, XIII, XXI, \"a\", e XLI, e 29, caput e parágrafo único.","tags":["licitacao","pregao","cabimento"]},{"id":"ADM024","area":"Noções de Direito Administrativo","tema":"Licitação","subtema":"inexigibilidade e inviabilidade de competição","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A inexigibilidade de licitação caracteriza-se pela inviabilidade de competição e pode ocorrer, entre outras hipóteses legais, quando determinado objeto somente puder ser fornecido por produtor, empresa ou representante comercial exclusivo, desde que a exclusividade seja adequadamente comprovada.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A inviabilidade de competição é o fundamento da inexigibilidade. Na hipótese de fornecedor exclusivo, a Administração deve demonstrar essa condição por atestado de exclusividade, contrato de exclusividade, declaração do fabricante ou outro documento idôneo, sendo vedada preferência por marca específica.","referencia":"Lei nº 14.133/2021, art. 74, caput, I e § 1º.","tags":["licitacao","inexigibilidade","fornecedor-exclusivo"]},{"id":"ADM025","area":"Noções de Direito Administrativo","tema":"Licitação","subtema":"distinção entre dispensa e inexigibilidade","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Dispensa e inexigibilidade de licitação possuem o mesmo fundamento jurídico: em ambas, a contratação direta somente é admitida quando a competição é materialmente impossível.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Na inexigibilidade, a competição é inviável. Nas hipóteses de dispensa previstas em lei, a competição pode ser juridicamente e materialmente possível, mas o legislador autoriza a contratação direta diante de circunstâncias tipificadas. Portanto, os institutos não possuem o mesmo fundamento.","referencia":"Lei nº 14.133/2021, arts. 72, 74 e 75.","tags":["licitacao","dispensa","inexigibilidade"]},{"id":"ADM026","area":"Noções de Direito Administrativo","tema":"Bens públicos","subtema":"imprescritibilidade e usucapião de bens públicos","dificuldade":"facil","enunciado":"Julgue o item a seguir. Um imóvel pertencente a uma pessoa jurídica de direito público pode ser adquirido por usucapião se o particular demonstrar posse contínua, pacífica e com ânimo de dono pelo prazo previsto na legislação civil.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Os bens públicos não estão sujeitos a usucapião. O decurso do tempo e a posse exercida pelo particular não transformam bem público em propriedade privada por essa modalidade aquisitiva.","referencia":"Constituição Federal de 1988, arts. 183, § 3º, e 191, parágrafo único; Código Civil, art. 102.","tags":["bens-publicos","usucapiao","imprescritibilidade"]},{"id":"ADM027","area":"Noções de Direito Administrativo","tema":"Bens públicos","subtema":"uso gratuito ou retribuído de bens públicos","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. O uso comum dos bens públicos pode ser gratuito ou retribuído, conforme for estabelecido legalmente pela entidade a cuja administração pertencerem.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O Código Civil admite expressamente que o uso comum dos bens públicos seja gratuito ou retribuído, de acordo com o que for legalmente estabelecido pela entidade responsável por sua administração.","referencia":"Código Civil, art. 103.","tags":["bens-publicos","uso-comum","remuneracao"]},{"id":"ADM028","area":"Noções de Direito Administrativo","tema":"Bens públicos","subtema":"alienabilidade de bens públicos e afetação","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Os bens públicos de uso comum do povo e os de uso especial são inalienáveis enquanto conservarem essa qualificação, ao passo que os bens públicos dominicais podem ser alienados, desde que observadas as exigências legais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O Código Civil distingue os bens públicos conforme sua destinação. Bens de uso comum e de uso especial permanecem inalienáveis enquanto conservarem essa qualificação; bens dominicais podem ser alienados, observadas as exigências legais.","referencia":"Código Civil, arts. 99, 100 e 101.","tags":["bens-publicos","alienacao","afetacao"]},{"id":"ADM029","area":"Noções de Direito Administrativo","tema":"Administração direta","subtema":"órgãos públicos e personalidade jurídica","dificuldade":"facil","enunciado":"Julgue o item a seguir. Uma secretaria estadual, por integrar a administração direta, possui personalidade jurídica própria e distinta da personalidade do Estado, razão pela qual é titular autônoma dos direitos e obrigações decorrentes de todos os atos praticados por seus agentes.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A secretaria é órgão público e não possui personalidade jurídica própria distinta do ente político que integra. Em regra, a atuação de seus agentes é imputada à pessoa jurídica estatal correspondente.","referencia":"Doutrina de Direito Administrativo sobre órgãos públicos, teoria do órgão e administração direta.","tags":["administracao-direta","orgaos-publicos","personalidade-juridica"]},{"id":"ADM030","area":"Noções de Direito Administrativo","tema":"Administração direta","subtema":"desconcentração administrativa","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Quando um Estado distribui competências entre secretarias, departamentos e coordenadorias pertencentes à sua própria pessoa jurídica, ocorre desconcentração administrativa, sem criação de nova personalidade jurídica.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A desconcentração distribui internamente competências entre órgãos da mesma pessoa jurídica. Ela não cria nova entidade nem nova personalidade jurídica, diferentemente da descentralização por meio de pessoa jurídica distinta.","referencia":"Doutrina de Direito Administrativo sobre desconcentração e organização administrativa.","tags":["administracao-direta","desconcentracao","orgaos"]},{"id":"ADM031","area":"Noções de Direito Administrativo","tema":"Administração direta","subtema":"distinção entre desconcentração e descentralização","dificuldade":"dificil","enunciado":"Julgue o item a seguir. A criação de uma autarquia para executar determinada atividade administrativa constitui desconcentração, porque representa mera repartição de competências dentro da mesma pessoa jurídica que anteriormente desempenhava a atividade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A criação de autarquia constitui descentralização administrativa, pois surge pessoa jurídica distinta do ente político. Desconcentração ocorre dentro da mesma pessoa jurídica, mediante distribuição interna de competências entre órgãos.","referencia":"Constituição Federal de 1988, art. 37, XIX; Decreto-Lei nº 200/1967, arts. 4º e 5º; doutrina de organização administrativa.","tags":["administracao-direta","descentralizacao","desconcentracao"]},{"id":"ADM032","area":"Noções de Direito Administrativo","tema":"Administração indireta","subtema":"autarquia e criação por lei","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A autarquia é pessoa jurídica de direito público integrante da administração indireta e sua criação depende de lei específica, não se limitando a lei a autorizar uma posterior constituição da entidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A Constituição distingue a autarquia das empresas estatais: somente por lei específica pode ser criada autarquia, ao passo que a instituição de empresa pública e sociedade de economia mista é autorizada por lei específica.","referencia":"Constituição Federal de 1988, art. 37, XIX; Decreto-Lei nº 200/1967, art. 5º, I.","tags":["administracao-indireta","autarquia","criacao-por-lei"]},{"id":"ADM033","area":"Noções de Direito Administrativo","tema":"Administração indireta","subtema":"empresa pública e sociedade de economia mista","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Tanto a empresa pública quanto a sociedade de economia mista devem obrigatoriamente adotar a forma de sociedade anônima e possuir capital formado por recursos públicos e privados.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A sociedade de economia mista deve adotar a forma de sociedade anônima e admite participação privada, preservado o controle estatal. A empresa pública não precisa assumir a forma de sociedade anônima; além disso, seu capital social é integralmente detido por entes públicos, admitida a participação das pessoas jurídicas estatais previstas em lei, sem participação de capital privado.","referencia":"Lei nº 13.303/2016, arts. 3º, parágrafo único, 4º e 5º; Decreto-Lei nº 200/1967, art. 5º, II e III.","tags":["administracao-indireta","empresa-publica","sociedade-de-economia-mista"]},{"id":"ADM034","area":"Noções de Direito Administrativo","tema":"Administração indireta","subtema":"autorização legal para instituição de empresas estatais","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Diferentemente da autarquia, que é criada diretamente por lei específica, a empresa pública e a sociedade de economia mista têm sua instituição autorizada por lei específica e dependem dos atos constitutivos pertinentes para a aquisição de personalidade jurídica.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A Constituição determina que a autarquia seja criada por lei específica, enquanto a instituição de empresa pública e de sociedade de economia mista é autorizada por lei específica. Para as empresas estatais, a personalidade jurídica surge com a efetiva constituição segundo as regras aplicáveis à respectiva forma societária.","referencia":"Constituição Federal de 1988, art. 37, XIX; Lei nº 13.303/2016, arts. 2º, § 1º, 3º e 4º.","tags":["administracao-indireta","empresas-estatais","autorizacao-legal"]},{"id":"ADM035","area":"Noções de Direito Administrativo","tema":"Controle da administração pública","subtema":"controle externo e papel do Tribunal de Contas","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No plano federal, o controle externo da Administração é exercido exclusivamente pelo Tribunal de Contas da União, que substitui o Congresso Nacional no exercício da fiscalização contábil, financeira, orçamentária, operacional e patrimonial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A Constituição estabelece que o controle externo, no âmbito federal, é exercido pelo Congresso Nacional com o auxílio do Tribunal de Contas da União. O TCU possui competências constitucionais próprias, mas não substitui o Congresso como titular do controle externo previsto nos arts. 70 e 71.","referencia":"Constituição Federal de 1988, arts. 70 e 71.","tags":["controle","controle-externo","tribunal-de-contas"]},{"id":"ADM036","area":"Noções de Direito Administrativo","tema":"Controle da administração pública","subtema":"sistema de controle interno","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A Constituição determina que os Poderes Legislativo, Executivo e Judiciário mantenham, de forma integrada, sistema de controle interno com finalidades que incluem avaliar o cumprimento de metas e apoiar o controle externo no exercício de sua missão institucional.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 74 da Constituição prevê sistema integrado de controle interno nos três Poderes e inclui, entre suas finalidades, a avaliação do cumprimento de metas e o apoio ao controle externo.","referencia":"Constituição Federal de 1988, art. 74, caput e incisos I e IV.","tags":["controle","controle-interno","constituicao"]},{"id":"ADM037","area":"Noções de Direito Administrativo","tema":"Controle da administração pública","subtema":"controle judicial e mérito administrativo","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Ao apreciar ação contra ato administrativo válido, o Poder Judiciário pode revogá-lo exclusivamente por considerar que outra decisão seria mais conveniente para o interesse público, ainda que não identifique ilegalidade ou violação jurídica.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O controle judicial alcança a juridicidade da atuação administrativa, mas o Judiciário não substitui a Administração em juízo puramente discricionário de conveniência e oportunidade para revogar ato válido. Havendo ilegalidade ou outro vício jurídico, poderá ocorrer controle jurisdicional, o que é diferente de revogação fundada exclusivamente no mérito administrativo.","referencia":"Constituição Federal de 1988, art. 5º, XXXV; Súmula 473 do STF; doutrina sobre controle judicial e mérito administrativo.","tags":["controle","controle-judicial","merito-administrativo"]},{"id":"ADM038","area":"Noções de Direito Administrativo","tema":"Responsabilidade do Estado","subtema":"responsabilidade civil objetiva do Estado","dificuldade":"facil","enunciado":"Julgue o item a seguir. Se agente público, nessa qualidade, causar dano a terceiro no exercício de atividade estatal, a pessoa jurídica de direito público responsável pela atuação estatal poderá responder objetivamente perante a vítima, nos termos do art. 37, § 6º, da Constituição.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A Constituição adota responsabilidade objetiva das pessoas jurídicas de direito público e das pessoas jurídicas de direito privado prestadoras de serviços públicos pelos danos que seus agentes, nessa qualidade, causem a terceiros. Para essa responsabilidade, a vítima não precisa provar culpa do agente, mas deve demonstrar os demais pressupostos pertinentes, como dano e nexo causal.","referencia":"Constituição Federal de 1988, art. 37, § 6º.","tags":["responsabilidade-do-estado","responsabilidade-objetiva","dano"]},{"id":"ADM039","area":"Noções de Direito Administrativo","tema":"Responsabilidade do Estado","subtema":"ação regressiva contra o agente público","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Depois de indenizar a vítima por dano causado por agente público, o Estado possui direito de regresso contra esse agente independentemente da demonstração de dolo ou culpa, porque a responsabilidade objetiva perante o terceiro também torna objetiva a responsabilidade pessoal do agente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A responsabilidade do Estado perante a vítima é objetiva nos termos constitucionais, mas o direito de regresso contra o agente exige dolo ou culpa. A responsabilidade pessoal regressiva do agente é, portanto, subjetiva.","referencia":"Constituição Federal de 1988, art. 37, § 6º.","tags":["responsabilidade-do-estado","acao-regressiva","dolo-ou-culpa"]},{"id":"ADM040","area":"Noções de Direito Administrativo","tema":"Responsabilidade do Estado","subtema":"nexo causal na responsabilidade objetiva","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Por ser objetiva a responsabilidade estatal prevista no art. 37, § 6º, da Constituição, basta que o particular demonstre a existência de um dano, sendo dispensável estabelecer nexo causal entre a atuação do agente público nessa qualidade e o prejuízo alegado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Responsabilidade objetiva significa dispensa da prova de culpa, não dispensa da demonstração dos demais pressupostos. Em regra, é necessário comprovar o dano e o nexo causal entre a atuação estatal juridicamente relevante e o prejuízo.","referencia":"Constituição Federal de 1988, art. 37, § 6º; doutrina de responsabilidade civil do Estado.","tags":["responsabilidade-do-estado","nexo-causal","responsabilidade-objetiva"]}],"constitucional":[{"id":"CON001","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Igualdade entre homens e mulheres","dificuldade":"facil","enunciado":"A Constituição Federal estabelece que homens e mulheres são iguais em direitos e obrigações, nos termos da própria Constituição.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O princípio da igualdade encontra previsão expressa no art. 5º, I, segundo o qual homens e mulheres são iguais em direitos e obrigações, nos termos da Constituição.","referencia":"Constituição Federal de 1988, art. 5º, I.","tags":["direitos fundamentais","igualdade","artigo 5"]},{"id":"CON002","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Princípio da legalidade","dificuldade":"facil","enunciado":"Segundo o princípio constitucional da legalidade, qualquer obrigação pode ser imposta ao particular por simples ato administrativo, ainda que não exista fundamento em lei.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Constituição determina que ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei. Um ato administrativo não pode, por si só e sem fundamento jurídico adequado, criar obrigação incompatível com essa garantia.","referencia":"Constituição Federal de 1988, art. 5º, II.","tags":["legalidade","direitos fundamentais","reserva legal"]},{"id":"CON003","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Liberdade de manifestação do pensamento","dificuldade":"facil","enunciado":"A manifestação do pensamento é livre, mas a Constituição veda o anonimato.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A liberdade de manifestação do pensamento é garantia constitucional expressa, porém não possui caráter anônimo, pois o próprio texto constitucional veda o anonimato.","referencia":"Constituição Federal de 1988, art. 5º, IV.","tags":["liberdade","manifestação do pensamento","anonimato"]},{"id":"CON004","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Direito de reunião","dificuldade":"facil","enunciado":"A realização de reunião pacífica e sem armas em local aberto ao público depende de autorização prévia da autoridade competente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A reunião pacífica e sem armas em local aberto ao público independe de autorização. Exige-se prévio aviso à autoridade competente e que a reunião não frustre outra anteriormente convocada para o mesmo local.","referencia":"Constituição Federal de 1988, art. 5º, XVI.","tags":["direito de reunião","liberdade","prévio aviso"]},{"id":"CON005","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Liberdade de associação","dificuldade":"intermediaria","enunciado":"A criação de associações independe de autorização estatal, sendo vedada, em regra, a interferência do Estado em seu funcionamento.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A Constituição assegura que a criação de associações e, na forma da lei, de cooperativas independe de autorização e veda a interferência estatal em seu funcionamento.","referencia":"Constituição Federal de 1988, art. 5º, XVIII.","tags":["associação","liberdade associativa","direitos fundamentais"]},{"id":"CON006","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Direito de propriedade e função social","dificuldade":"intermediaria","enunciado":"O direito de propriedade é assegurado constitucionalmente de forma absoluta, razão pela qual seu exercício não está condicionado ao atendimento de função social.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Constituição garante o direito de propriedade, mas estabelece expressamente que a propriedade atenderá à sua função social. Portanto, não se trata de direito constitucionalmente concebido como absoluto.","referencia":"Constituição Federal de 1988, art. 5º, XXII e XXIII.","tags":["propriedade","função social","direitos fundamentais"]},{"id":"CON007","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Devido processo legal","dificuldade":"intermediaria","enunciado":"Ninguém será privado da liberdade ou de seus bens sem o devido processo legal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A garantia do devido processo legal está expressamente prevista no texto constitucional e protege tanto a liberdade quanto os bens das pessoas.","referencia":"Constituição Federal de 1988, art. 5º, LIV.","tags":["devido processo legal","liberdade","garantias fundamentais"]},{"id":"CON008","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Contraditório e ampla defesa","dificuldade":"intermediaria","enunciado":"A Constituição assegura o contraditório e a ampla defesa apenas aos litigantes em processos judiciais, não alcançando processos administrativos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O contraditório e a ampla defesa são assegurados aos litigantes tanto em processo judicial quanto administrativo e aos acusados em geral, com os meios e recursos a eles inerentes.","referencia":"Constituição Federal de 1988, art. 5º, LV.","tags":["contraditório","ampla defesa","processo administrativo"]},{"id":"CON009","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Inviolabilidade do domicílio","dificuldade":"intermediaria","enunciado":"Sem o consentimento do morador, o ingresso em uma residência para cumprimento de determinação judicial é constitucionalmente admitido durante o dia.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A casa é asilo inviolável do indivíduo, mas a Constituição admite ingresso sem consentimento em caso de flagrante delito ou desastre, para prestar socorro ou, durante o dia, por determinação judicial.","referencia":"Constituição Federal de 1988, art. 5º, XI.","tags":["domicílio","busca domiciliar","atividade policial"]},{"id":"CON010","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Prisão em flagrante","dificuldade":"intermediaria","enunciado":"Um policial somente poderá efetuar a prisão de
