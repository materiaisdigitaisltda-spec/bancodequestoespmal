<!doctype html>
<!-- TREINA PM AL | arquivo único: HTML + CSS + JS + identidade visual + 440 questões incorporadas -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0C2038" />
  <meta name="description" content="Plataforma de treinamento com 440 questões inéditas e comentadas para Soldado da Polícia Militar de Alagoas, no padrão CEBRASPE CERTO/ERRADO." />
  <title>TREINA PM AL — 440 Questões | Soldado</title>
    <style>
:root {
  --green: #0C2038;
  --green-deep: #061221;
  --green-soft: color-mix(in srgb, #184A85 10%, #FFFFFF);
  --yellow: #C6A15B;
  --teal: #184A85;
  --sky: #E8C77F;
  --text: #0C2038;
  --text-strong: #061221;
  --muted: color-mix(in srgb, #0C2038 62%, #FFFFFF);
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --surface-2: color-mix(in srgb, #F2F5F9 72%, #FFFFFF);
  --border: color-mix(in srgb, #0C2038 14%, #FFFFFF);
  --success: #184A85;
  --success-bg: color-mix(in srgb, #184A85 10%, #FFFFFF);
  --danger: #A61E22;
  --danger-bg: color-mix(in srgb, #A61E22 9%, #FFFFFF);
  --warning: #C6A15B;
  --warning-bg: color-mix(in srgb, #E8C77F 28%, #FFFFFF);
  --info-bg: color-mix(in srgb, #184A85 7%, #FFFFFF);
  --shadow: 0 10px 30px rgba(6, 18, 33, .08);
  --shadow-lg: 0 18px 50px rgba(6, 18, 33, .13);
  --radius: 18px;
  --radius-sm: 12px;
  --sidebar: 250px;
  --content-max: 1220px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --green: color-mix(in srgb, #184A85 72%, #FFFFFF);
    --green-deep: #FFFFFF;
    --green-soft: color-mix(in srgb, #184A85 22%, #061221);
    --yellow: #C6A15B;
    --teal: #E8C77F;
    --sky: #C6A15B;
    --text: #F2F5F9;
    --text-strong: #FFFFFF;
    --muted: color-mix(in srgb, #F2F5F9 68%, #061221);
    --bg: #061221;
    --surface: #0C2038;
    --surface-2: color-mix(in srgb, #0C2038 80%, #061221);
    --border: color-mix(in srgb, #FFFFFF 15%, #0C2038);
    --success: color-mix(in srgb, #184A85 72%, #FFFFFF);
    --success-bg: color-mix(in srgb, #184A85 30%, #061221);
    --danger: color-mix(in srgb, #A61E22 70%, #FFFFFF);
    --danger-bg: color-mix(in srgb, #A61E22 28%, #061221);
    --warning: #E8C77F;
    --warning-bg: color-mix(in srgb, #C6A15B 22%, #061221);
    --info-bg: color-mix(in srgb, #184A85 22%, #061221);
    --shadow: 0 10px 30px rgba(0, 0, 0, .22);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .34);
  }
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--teal) 70%, transparent); outline-offset: 2px; }

.app-shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  border: 0;
  background: transparent;
  display: flex;
  gap: 10px;
  align-items: center;
  text-align: left;
  padding: 4px 6px 18px;
  cursor: pointer;
}
.brand img { width: 54px; height: 54px; object-fit: contain; border-radius: 14px; }
.brand-copy { min-width: 0; display: flex; flex-direction: column; }
.brand-copy strong { color: var(--text-strong); font-size: .92rem; letter-spacing: -.01em; }
.brand-copy small { color: var(--muted); }
.side-nav { display: grid; gap: 5px; }
.nav-item {
  border: 0;
  background: transparent;
  padding: 11px 12px;
  border-radius: 12px;
  text-align: left;
  display: flex;
  gap: 10px;
  align-items: center;
  cursor: pointer;
  color: var(--text);
  transition: .16s ease;
}
.nav-item span { width: 20px; text-align: center; font-weight: 700; }
.nav-item:hover { background: var(--surface-2); color: var(--green); }
.nav-item.is-active { background: var(--green-soft); color: var(--green); font-weight: 700; }
.sidebar-footer { margin-top: auto; padding: 12px 6px 4px; }
.bank-status { font-size: .78rem; color: var(--muted); line-height: 1.35; }

.main-column { grid-column: 2; min-width: 0; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  min-height: 82px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
  padding: 14px clamp(18px, 3vw, 38px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.eyebrow { margin: 0 0 2px; font-size: .72rem; color: var(--green); text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
.topbar h1 { margin: 0; color: var(--text-strong); font-size: clamp(1.25rem, 2vw, 1.65rem); letter-spacing: -.03em; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.today-goal { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.icon-btn { display: none; border: 1px solid var(--border); background: var(--surface); border-radius: 11px; width: 42px; height: 42px; cursor: pointer; }

.content { width: min(100%, var(--content-max)); margin: 0 auto; padding: 28px clamp(18px, 3vw, 38px) 80px; }
.section { margin-bottom: 28px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.section-head h2, .section h2 { margin: 0; color: var(--text-strong); font-size: 1.15rem; letter-spacing: -.02em; }
.section-head p, .section-subtitle { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }

.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, color-mix(in srgb, var(--green) 12%, var(--surface)), var(--surface));
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: clamp(22px, 4vw, 38px);
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: 1.35fr .65fr;
  align-items: center;
  gap: 26px;
}
.hero::after {
  content: "";
  position: absolute;
  width: 270px; height: 270px;
  border-radius: 50%;
  right: -95px; top: -125px;
  background: color-mix(in srgb, var(--sky) 22%, transparent);
}
.hero-copy { position: relative; z-index: 1; }
.hero-kicker { display: inline-flex; align-items: center; gap: 7px; background: var(--green-soft); color: var(--green); padding: 6px 10px; border-radius: 999px; font-size: .78rem; font-weight: 800; }
.hero h2 { margin: 12px 0 8px; font-size: clamp(1.6rem, 3vw, 2.35rem); color: var(--text-strong); line-height: 1.12; letter-spacing: -.04em; }
.hero p { margin: 0; max-width: 680px; color: var(--muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.hero-art { position: relative; z-index: 1; display: flex; justify-content: center; }
.hero-art img { width: min(100%, 210px); filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .10)); }

.btn {
  border: 1px solid transparent;
  border-radius: 12px;
  min-height: 44px;
  padding: 10px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 750;
  transition: transform .13s ease, box-shadow .13s ease, background .13s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--green); color: #fff; box-shadow: 0 7px 18px color-mix(in srgb, var(--green) 20%, transparent); }
.btn-primary:hover { background: color-mix(in srgb, var(--green) 88%, #000); }
.btn-secondary { background: var(--surface); color: var(--green); border-color: var(--border); }
.btn-secondary:hover { border-color: color-mix(in srgb, var(--green) 45%, var(--border)); }
.btn-soft { background: var(--green-soft); color: var(--green); }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: transparent; border-color: var(--border); }
.btn-sm { min-height: 36px; padding: 7px 11px; border-radius: 10px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.stat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.stat-card, .card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stat-card { padding: 18px; min-width: 0; }
.stat-label { color: var(--muted); font-size: .78rem; }
.stat-value { margin-top: 5px; color: var(--text-strong); font-weight: 850; font-size: clamp(1.35rem, 2.4vw, 1.75rem); letter-spacing: -.03em; }
.stat-note { margin-top: 2px; font-size: .76rem; color: var(--muted); }

.progress-wrap { margin-top: 16px; }
.progress-track { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--border) 75%, transparent); overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--teal)); border-radius: 999px; transition: width .35s ease; }
.progress-labels { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: .78rem; margin-top: 7px; }

.subject-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.subject-card { padding: 18px; display: flex; flex-direction: column; min-height: 178px; }
.subject-badge { width: auto; min-width: 42px; padding: 0 8px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-weight: 900; }
.subject-card h3 { margin: 13px 0 5px; color: var(--text-strong); font-size: .98rem; line-height: 1.3; }
.subject-card p { margin: 0 0 14px; color: var(--muted); font-size: .82rem; }
.subject-card .btn { margin-top: auto; width: 100%; }

.two-col { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.card { padding: 20px; }
.card h3 { margin: 0 0 8px; color: var(--text-strong); font-size: 1rem; }
.card p { color: var(--muted); }
.card-flat { box-shadow: none; }

.action-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.action-card {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  padding: 16px;
  text-align: left;
  cursor: pointer;
  transition: .16s ease;
}
.action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--green) 35%, var(--border)); }
.action-card strong { display: block; color: var(--text-strong); margin-bottom: 4px; }
.action-card span { color: var(--muted); font-size: .82rem; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-field { display: grid; gap: 6px; }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-size: .8rem; font-weight: 750; color: var(--text-strong); }
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-strong);
  border-radius: 11px;
  min-height: 44px;
  padding: 9px 11px;
}
.input::placeholder { color: var(--muted); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--teal); outline: 3px solid color-mix(in srgb, var(--teal) 15%, transparent); }
.field-hint { font-size: .75rem; color: var(--muted); }
.inline-check { display: flex; gap: 9px; align-items: center; min-height: 44px; }
.inline-check input { width: 18px; height: 18px; accent-color: var(--green); }

.filter-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; margin-top: 16px; }
.filter-summary strong { color: var(--green); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 9px; font-size: .74rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }
.chip.easy { background: var(--success-bg); color: var(--success); border-color: transparent; }
.chip.medium { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.chip.hard { background: var(--danger-bg); color: var(--danger); border-color: transparent; }

.list { display: grid; gap: 10px; }
.list-item { border: 1px solid var(--border); border-radius: 13px; background: var(--surface); padding: 13px 14px; display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.list-item-main { min-width: 0; }
.list-item-title { color: var(--text-strong); font-weight: 750; overflow-wrap: anywhere; }
.list-item-sub { color: var(--muted); font-size: .8rem; margin-top: 3px; }
.list-item-actions { flex: none; display: flex; gap: 8px; }

.empty-state { text-align: center; padding: 36px 20px; border: 1px dashed var(--border); border-radius: 16px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.empty-state .empty-icon { font-size: 2rem; }
.empty-state h3 { margin: 8px 0 4px; color: var(--text-strong); }
.empty-state p { margin: 0 auto 15px; max-width: 520px; color: var(--muted); }

.alert { border-radius: 13px; padding: 12px 14px; border: 1px solid var(--border); font-size: .86rem; }
.alert-info { background: var(--info-bg); }
.alert-warning { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.alert-danger { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
.alert-success { background: var(--success-bg); color: var(--success); border-color: transparent; }

/* Question experience */
.session-shell { max-width: 920px; margin: 0 auto; }
.session-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
.session-progress { flex: 1; }
.session-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .82rem; white-space: nowrap; }
.question-card { padding: clamp(18px, 3.5vw, 30px); }
.question-head { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.question-index { color: var(--green); font-weight: 850; font-size: .84rem; }
.favorite-btn { border: 1px solid var(--border); background: var(--surface-2); width: 42px; height: 42px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; }
.favorite-btn.is-favorite { color: #C6A15B; background: var(--warning-bg); border-color: transparent; }
.question-text { white-space: pre-wrap; color: var(--text-strong); font-size: clamp(1rem, 1.7vw, 1.12rem); line-height: 1.68; margin: 18px 0 22px; }
.alternatives { display: grid; gap: 10px; }
.alternative { position: relative; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 13px 13px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); transition: .14s ease; }
.alternative.can-select { cursor: pointer; }
.alternative.can-select:hover { border-color: color-mix(in srgb, var(--green) 40%, var(--border)); background: color-mix(in srgb, var(--green-soft) 45%, var(--surface)); }
.alt-letter { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); color: var(--text-strong); font-weight: 850; background: var(--surface-2); }
.alt-text { color: var(--text-strong); line-height: 1.5; white-space: pre-wrap; }
.alt-cut { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 7px 8px; border-radius: 8px; font-size: .76rem; }
.alt-cut:hover { background: var(--surface-2); color: var(--danger); }
.alternative.selected { border-color: var(--green); box-shadow: 0 0 0 2px color-mix(in srgb, var(--green) 13%, transparent); }
.alternative.selected .alt-letter { background: var(--green); color: white; border-color: var(--green); }
.alternative.cut .alt-text { text-decoration: line-through; opacity: .45; }
.alternative.cut { opacity: .68; }
.alternative.correct { background: var(--success-bg); border-color: color-mix(in srgb, var(--success) 45%, transparent); }
.alternative.correct .alt-letter { background: var(--success); color: #fff; border-color: var(--success); }
.alternative.incorrect { background: var(--danger-bg); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.alternative.incorrect .alt-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
.question-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.feedback-panel { margin-top: 18px; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); }
.feedback-head { padding: 12px 15px; font-weight: 850; }
.feedback-head.correct { background: var(--success-bg); color: var(--success); }
.feedback-head.incorrect { background: var(--danger-bg); color: var(--danger); }
.feedback-body { padding: 16px; background: var(--surface-2); }
.feedback-body h4 { margin: 0 0 5px; color: var(--text-strong); }
.feedback-body p { white-space: pre-wrap; margin: 0 0 14px; white-space: pre-wrap; color: var(--text); }
.reference { padding-top: 11px; border-top: 1px solid var(--border); color: var(--muted); font-size: .84rem; white-space: pre-wrap; }

/* Exam */
.exam-layout { display: grid; grid-template-columns: minmax(0,1fr) 230px; gap: 16px; align-items: start; }
.exam-sidebar { position: sticky; top: 100px; }
.exam-timer { font-size: 1.25rem; font-weight: 900; color: var(--text-strong); text-align: center; margin-bottom: 12px; }
.exam-timer.low { color: var(--danger); }
.exam-nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.exam-nav-btn { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); cursor: pointer; font-size: .8rem; }
.exam-nav-btn.answered { background: var(--green-soft); color: var(--green); border-color: transparent; font-weight: 800; }
.exam-nav-btn.current { background: var(--green); color: #fff; border-color: var(--green); }
.exam-side-actions { display: grid; gap: 8px; margin-top: 13px; }

.result-hero { padding: 26px; text-align: center; }
.result-score { font-size: clamp(2.4rem, 8vw, 4.6rem); line-height: 1; color: var(--green); font-weight: 950; letter-spacing: -.06em; }
.result-title { color: var(--text-strong); font-size: 1.15rem; font-weight: 800; margin-top: 8px; }
.result-sub { color: var(--muted); margin-top: 4px; }
.result-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-top: 18px; }
.result-grid > div { background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 13px; }
.result-grid strong { display: block; color: var(--text-strong); font-size: 1.15rem; }
.result-grid span { font-size: .75rem; color: var(--muted); }

.performance-row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(160px, 2fr) 70px; gap: 12px; align-items: center; padding: 9px 0; }
.performance-row + .performance-row { border-top: 1px solid var(--border); }
.performance-name { color: var(--text-strong); font-size: .84rem; }
.performance-value { text-align: right; font-size: .82rem; font-weight: 800; color: var(--text-strong); }
.mini-track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
.mini-fill { height: 100%; border-radius: 999px; background: var(--green); }
.mini-fill.review { background: var(--yellow); }

.search-results { max-height: 310px; overflow: auto; display: grid; gap: 7px; margin-top: 10px; }
.search-result { border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 10px 11px; }
.search-result strong { color: var(--text-strong); font-size: .8rem; }
.search-result p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 680px; background: var(--surface); }
th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: .82rem; vertical-align: top; }
th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); }
td { color: var(--text); }
tr:last-child td { border-bottom: 0; }

.toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: grid; gap: 8px; max-width: min(380px, calc(100vw - 36px)); }
.toast { background: var(--text-strong); color: var(--surface); padding: 11px 14px; border-radius: 12px; box-shadow: var(--shadow-lg); font-size: .84rem; animation: toastIn .2s ease; }
.toast.success { background: var(--success); color: white; }
.toast.error { background: var(--danger); color: white; }
@keyframes toastIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

.modal-root:empty { display: none; }
.modal-root { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 18px; background: rgba(8, 18, 12, .52); backdrop-filter: blur(4px); }
.modal { width: min(100%, 520px); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg); padding: 22px; }
.modal h3 { margin: 0 0 8px; color: var(--text-strong); }
.modal p { margin: 0; color: var(--muted); white-space: pre-wrap; }
.modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; flex-wrap: wrap; }

.mobile-nav { display: none; }
.noscript { padding: 18px; background: var(--danger-bg); color: var(--danger); }

.skeleton { border-radius: 10px; min-height: 20px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

@media (max-width: 1100px) {
  .stat-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .subject-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .exam-layout { grid-template-columns: minmax(0,1fr) 200px; }
}

@media (max-width: 900px) {
  :root { --sidebar: 220px; }
  .hero { grid-template-columns: 1fr; }
  .hero-art { display: none; }
  .two-col { grid-template-columns: 1fr; }
  .three-col, .action-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .exam-layout { grid-template-columns: 1fr; }
  .exam-sidebar { position: static; order: -1; }
  .exam-nav-grid { grid-template-columns: repeat(10, 1fr); }
}

@media (max-width: 760px) {
  body { padding-bottom: 68px; }
  .app-shell { display: block; }
  .main-column { width: 100%; }
  .sidebar {
    transform: translateX(-105%);
    transition: transform .2s ease;
    box-shadow: var(--shadow-lg);
  }
  body.menu-open .sidebar { transform: translateX(0); }
  .icon-btn { display: inline-grid; place-items: center; }
  .mobile-nav {
    position: fixed;
    left: 10px; right: 10px; bottom: 9px;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 5px;
  }
  .mobile-nav button { border: 0; background: transparent; color: var(--muted); padding: 6px 3px; border-radius: 10px; display: grid; gap: 1px; place-items: center; cursor: pointer; font-size: 1rem; }
  .mobile-nav button span { font-size: .62rem; }
  .mobile-nav button.is-active { background: var(--green-soft); color: var(--green); }
  .topbar { min-height: 70px; padding: 10px 16px; }
  .today-goal { display: none; }
  .content { padding: 18px 14px 40px; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat-card:last-child { grid-column: 1 / -1; }
  .form-grid { grid-template-columns: 1fr; }
  .form-field.full { grid-column: auto; }
  .question-card { border-radius: 16px; }
  .alternative { grid-template-columns: 31px 1fr; }
  .alt-cut { grid-column: 2; justify-self: start; padding-left: 0; }
  .question-actions { position: sticky; bottom: 74px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); padding: 8px 0; z-index: 5; }
  .question-actions .btn { flex: 1; }
  .performance-row { grid-template-columns: 1fr 60px; }
  .performance-row .mini-track { grid-column: 1 / -1; grid-row: 2; }
  .result-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

@media (max-width: 520px) {
  .hero { padding: 20px; border-radius: 18px; }
  .hero-actions .btn { width: 100%; }
  .subject-grid, .three-col, .action-grid { grid-template-columns: 1fr; }
  .stat-grid { gap: 9px; }
  .stat-card { padding: 14px; }
  .filter-summary { align-items: flex-start; flex-direction: column; }
  .session-top { align-items: flex-start; flex-direction: column; }
  .session-meta { width: 100%; justify-content: space-between; }
  .exam-nav-grid { grid-template-columns: repeat(6, 1fr); }
  .modal-actions .btn { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

</style>

  <script>

/* ===== database.js ===== */
const DB_NAME = 'treina-pm-al-db';
const DB_VERSION = 1;

const STORES = {
  attempts: { keyPath: 'attemptId' },
  questionStats: { keyPath: 'questionId' },
  favorites: { keyPath: 'questionId' },
  trainingHistory: { keyPath: 'id' },
  examHistory: { keyPath: 'id' },
  activeSessions: { keyPath: 'type' },
  settings: { keyPath: 'key' }
};

let dbPromise;

function initDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      for (const [name, opts] of Object.entries(STORES)) {
        if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, opts);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => console.warn('IndexedDB bloqueado por outra aba.');
  });
  return dbPromise;
}

async function withStore(storeName, mode, action) {
  const db = await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    let request;
    let result;
    let settled = false;
    const fail = error => {
      if (settled) return;
      settled = true;
      reject(error || tx.error || new Error('Falha ao acessar o armazenamento local.'));
    };
    try {
      request = action(store);
      if (request && typeof request.onsuccess !== 'undefined') {
        request.onsuccess = () => { result = request.result; };
        request.onerror = () => fail(request.error);
      } else {
        result = request;
      }
    } catch (error) {
      fail(error);
      try { tx.abort(); } catch {}
      return;
    }
    tx.oncomplete = () => {
      if (settled) return;
      settled = true;
      resolve(result);
    };
    tx.onerror = () => fail(tx.error);
    tx.onabort = () => fail(tx.error);
  });
}

const dbGet = (store, key) => withStore(store, 'readonly', s => s.get(key));
const dbGetAll = store => withStore(store, 'readonly', s => s.getAll());
const dbPut = (store, value) => withStore(store, 'readwrite', s => s.put(value));
const dbDelete = (store, key) => withStore(store, 'readwrite', s => s.delete(key));
const dbClear = store => withStore(store, 'readwrite', s => s.clear());

function databaseUid(prefix) {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

async function recordAttempt({ questionId, selected, correctAnswer, mode = 'training', sessionId = null, timestamp = new Date().toISOString(), attemptId = null }) {
  if (typeof questionId !== 'string' || !questionId.trim()) throw new Error('Questão inválida para registro da tentativa.');
  if (!['A','B'].includes(selected) || !['A','B'].includes(correctAnswer)) throw new Error('Alternativa inválida para registro da tentativa.');
  if (!['training','exam'].includes(mode)) throw new Error('Modo de tentativa inválido.');
  if (Number.isNaN(Date.parse(timestamp))) throw new Error('Data da tentativa inválida.');
  const stableAttemptId = attemptId || databaseUid('attempt');
  const db = await initDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['attempts', 'questionStats'], 'readwrite');
    const attempts = tx.objectStore('attempts');
    const statsStore = tx.objectStore('questionStats');
    let result = null;

    const existingReq = attempts.get(stableAttemptId);
    existingReq.onsuccess = () => {
      if (existingReq.result) {
        const existing = existingReq.result;
        const sameAttempt = existing.questionId === questionId && existing.selected === selected && existing.correctAnswer === correctAnswer && existing.mode === mode && (existing.sessionId ?? null) === (sessionId ?? null);
        if (!sameAttempt) {
          reject(new Error('Conflito detectado no identificador da tentativa. Recarregue a página antes de continuar.'));
          try { tx.abort(); } catch {}
          return;
        }
        result = existing;
        return;
      }

      const correct = selected === correctAnswer;
      const attempt = {
        attemptId: stableAttemptId,
        questionId,
        selected,
        correctAnswer,
        correct,
        mode,
        sessionId,
        timestamp
      };
      result = attempt;
      attempts.put(attempt);

      const getStats = statsStore.get(questionId);
      getStats.onsuccess = () => {
        const prev = getStats.result || {
          questionId,
          attempts: 0,
          correct: 0,
          wrong: 0,
          lastAttempt: null,
          lastSelected: null,
          lastCorrect: null,
          correctedAfterError: false,
          correctAfterError: 0
        };
        const hadWrong = Number(prev.wrong || 0) > 0;
        const next = {
          ...prev,
          attempts: Number(prev.attempts || 0) + 1,
          correct: Number(prev.correct || 0) + (correct ? 1 : 0),
          wrong: Number(prev.wrong || 0) + (correct ? 0 : 1),
          lastAttempt: timestamp,
          lastSelected: selected,
          lastCorrect: correct,
          correctedAfterError: Boolean(prev.correctedAfterError || (hadWrong && correct)),
          correctAfterError: Number(prev.correctAfterError || 0) + (hadWrong && correct ? 1 : 0)
        };
        statsStore.put(next);
      };
    };
    existingReq.onerror = () => reject(existingReq.error);
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function getQuestionStatsMap() {
  const rows = await dbGetAll('questionStats');
  return Object.fromEntries(rows.map(row => [row.questionId, row]));
}

async function getAttempts() {

}

async function toggleFavorite(questionId) {
  const current = await dbGet('favorites', questionId);
  if (current) {
    await dbDelete('favorites', questionId);
    return false;
  }
  await dbPut('favorites', { questionId, savedAt: new Date().toISOString() });
  return true;
}

async function isFavorite(questionId) {
  return Boolean(await dbGet('favorites', questionId));
}

async function getFavoritesSet() {
  const rows = await dbGetAll('favorites');
  return new Set(rows.map(row => row.questionId));
}

async function saveTrainingHistory(record) {
  const value = { id: record.id || databaseUid('training'), ...record };
  await dbPut('trainingHistory', value);
  return value;
}

async function getTrainingHistory() {
  const rows = await dbGetAll('trainingHistory');
  return rows.sort((a, b) => String(b.endedAt || b.startedAt).localeCompare(String(a.endedAt || a.startedAt)));
}

async function saveExamHistory(record) {

  await dbPut('examHistory', value);
  return value;
}

async function getExamHistory() {

async function saveActiveSession(type, data) {
  const cleanData = data && typeof data === 'object' ? { ...data } : data;
  if (cleanData && typeof cleanData === 'object') {
    delete cleanData._confirming;
    delete cleanData._finishing;
    delete cleanData._navigating;
    delete cleanData._answering;
  }
  await dbPut('activeSessions', { type, data: cleanData, savedAt: new Date().toISOString() });
}

async function getActiveSession(type) {
  const row = await dbGet('activeSessions', type);
  const data = row?.data || null;
  if (data && typeof data === 'object') {
    delete data._confirming;
    delete data._finishing;
    delete data._navigating;
    delete data._answering;
  }
  return data;
}

async function clearActiveSession(type) {
  await dbDelete('activeSessions', type);
}

async function setSetting(key, value) {
  await dbPut('settings', { key, value });
}

async function getSetting(key, fallback = null) {
  const row = await dbGet('settings', key);
  return row ? row.value : fallback;
}

async function exportDatabase() {
  const payload = { version: 1, exportedAt: new Date().toISOString(), stores: {} };
  for (const store of Object.keys(STORES)) payload.stores[store] = await dbGetAll(store);
  return payload;
}

async function importDatabase(payload) {
  if (!payload || payload.version !== 1 || !payload.stores || typeof payload.stores !== 'object') {
    throw new Error('Backup incompatível ou corrompido.');
  }
  const db = await initDB();
  const storeNames = Object.keys(STORES);
  await new Promise((resolve, reject) => {
    const tx = db.transaction(storeNames, 'readwrite');
    for (const storeName of storeNames) {
      const store = tx.objectStore(storeName);
      store.clear();
      const rows = Array.isArray(payload.stores[storeName]) ? payload.stores[storeName] : [];
      for (const row of rows) store.put(row);
    }
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

async function resetDatabase() {
  const db = await initDB();
  const storeNames = Object.keys(STORES);
  await new Promise((resolve, reject) => {
    const tx = db.transaction(storeNames, 'readwrite');
    for (const storeName of storeNames) tx.objectStore(storeName).clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

escala de apoio foi acionada.\" O conector \"Portanto\" estabelece relação de conclusão entre o acionamento da escala de apoio e as informações apresentadas anteriormente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. \"Portanto\" é conector conclusivo e apresenta o acionamento da escala de apoio como consequência lógica ou conclusão decorrente das circunstâncias descritas antes.","referencia":"Coesão sequencial e relações lógico-semânticas entre segmentos textuais; Koch, A coesão textual.","tags":["coesao","conector","conclusao"]},{"id":"POR007","area":"Língua Portuguesa","tema":"Referenciação, substituição, repetição e conectores na sequenciação textual","subtema":"valor semântico de conector concessivo","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No período \"Embora a chuva tenha aumentado, a operação foi mantida\", a substituição de \"Embora\" por \"Porque\" preservaria a relação de sentido original entre as orações, sem necessidade de qualquer outra alteração.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é a afirmação de preservação do sentido. \"Embora\" introduz concessão, ao passo que \"porque\" introduz causa ou explicação. A formulação correta é: a troca altera a relação semântica entre as orações.","referencia":"Conectores e relações semânticas entre orações; Bechara, Moderna Gramática Portuguesa.","tags":["conectores","concessao","causa"]},{"id":"POR008","area":"Língua Portuguesa","tema":"Referenciação, substituição, repetição e conectores na sequenciação textual","subtema":"encapsulamento anafórico por expressão nominal","dificuldade":"dificil","enunciado":"Considerando a referenciação no texto a seguir, julgue o item. Texto: \"O comando decidiu redistribuir parte do efetivo para os horários de maior demanda e criar uma equipe de apoio móvel. Essa decisão será reavaliada após trinta dias.\" A expressão \"Essa decisão\" at conveniência. A formulação correta é: a oração \"que releiam atentamente as instruções\" é subordinada substantiva subjetiva.","referencia":"Orações subordinadas substantivas e funções sintáticas; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["sintaxe","oracao-subjetiva","periodo-composto"]},{"id":"POR013","area":"Língua Portuguesa","tema":"Classes de palavras","subtema":"valor adverbial de palavra invariável no contexto","dificuldade":"facil","enunciado":"Julgue o item a seguir. Na frase \"Os candidatos estudaram muito durante a semana\", a palavra \"muito\" é um adjetivo que caracteriza o substantivo \"candidatos\".","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é a classificação de \"muito\" como adjetivo. Nesse contexto, \"muito\" modifica o verbo \"estudaram\", indicando intensidade, e funciona como advérbio. A formulação correta é: \"muito\" é advérbio de intensidade.","referencia":"Classes de palavras e valor morfossintático no contexto; Bechara, Moderna Gramática Portuguesa.","tags":["classes-de-palavras","adverbio","morfologia"]},{"id":"POR014","area":"Língua Portuguesa","tema":"Classes de palavras","subtema":"conjunção subordinativa e adjetivo em função predicativa","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No período \"Embora cansado, o soldado permaneceu atento durante todo o turno\", \"Embora\" é conjunção de valor concessivo, e \"atento\" é adjetivo empregado como predicativo do sujeito.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. \"Embora\" introduz uma circunstância concessiva, enquanto \"atento\" atribui uma característica ao sujeito \"o soldado\" por intermédio do verbo de ligação \"permaneceu\", exercendo função predicativa.","referencia":"Classes de palavras e funções sintáticas; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["classes-de-palavras","conjuncao","adjetivo"]},{"id":"POR015","area":"Língua Portuguesa","tema":"Coordenação entre orações e termos da oração","subtema":"oração coordenada sindética adversativa","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No período \"O candidato revisou toda a teoria, mas não resolveu questões na última semana\", a conjunção \"mas\" estabelece entre as duas orações uma relação predominantemente aditiva.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é \"relação predominantemente aditiva\". A conjunção \"mas\" introduz oposição ou contraste e caracteriza oração coordenada sindética adversativa. A formulação correta é: a relação é adversativa.","referencia":"Coordenação sindética e valores semânticos das conjunções; Bechara, Moderna Gramática Portuguesa.","tags":["coordenacao","adversativa","conjuncao"]},{"id":"POR016","area":"Língua Portuguesa","tema":"Coordenação entre orações e termos da oração","subtema":"coordenação correlativa aditiva negativa","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No período \"O agente nem abandonou o posto nem deixou de comunicar a ocorrência\", a correlação \"nem... nem\" coordena duas estruturas de valor aditivo negativo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A construção correlativa \"nem... nem\" soma duas negações e estabelece coordenação aditiva entre as ações negadas.","referencia":"Coordenação de orações e correlações conjuntivas; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["coordenacao","correlacao","adicao"]},{"id":"POR017","area":"Língua Portuguesa","tema":"Subordinação entre orações e termos da oração","subtema":"oração subordinada adjetiva restritiva e efeito de sentido","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No período \"Os candidatos que chegaram cedo entraram no auditório\", a oração \"que chegaram cedo\" é explicativa e permite concluir que todos os candidatos chegaram cedo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é a classificação como oração explicativa. Sem vírgulas, \"que chegaram cedo\" é oração subordinada adjetiva restritiva e delimita o grupo de candidatos a que se faz referência. A formulação correta é: apenas os candidatos que chegaram cedo são apresentados como tendo entrado no auditório.","referencia":"Orações subordinadas adjetivas restritivas e explicativas; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["subordinacao","oracao-adjetiva","restritiva"]},{"id":"POR018","area":"Língua Portuguesa","tema":"Subordinação entre orações e termos da oração","subtema":"oração subordinada adverbial concessiva","dificuldade":"dificil","enunciado":"Acerca das relações de subordinação no período, julgue o item. Em \"Embora o prazo tivesse terminado, a comissão recebeu o documento por determinação judicial\", a oração iniciada por \"Embora\" expressa circunstância concessiva em relação à oração principal, e o emprego do subjuntivo é compatível com esse valor semântico.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A oração \"Embora o prazo tivesse terminado\" introduz um fato que poderia criar expectativa contrária ao recebimento do documento, mas não impede a ocorrência da ação principal. O modo subjuntivo é usual em orações concessivas introduzidas por \"embora\".","referencia":"Orações subordinadas adverbiais concessivas e emprego do subjuntivo; Bechara, Moderna Gramática Portuguesa.","tags":["subordinacao","concessiva","subjuntivo"]},{"id":"POR019","area":"Língua Portuguesa","tema":"Sinais de pontuação","subtema":"uso da vírgula para isolar vocativo","dificuldade":"facil","enunciado":"Julgue o item a seguir. Na frase \"Candidatos, confiram o número da sala antes do fechamento dos portões\", a vírgula isola corretamente o vocativo \"Candidatos\".","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. \"Candidatos\" é o termo usado para chamar ou interpelar os destinatários da mensagem e, por isso, deve ser isolado por vírgula.","referencia":"Pontuação e isolamento do vocativo; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["pontuacao","virgula","vocativo"]},{"id":"POR020","area":"Língua Portuguesa","tema":"Sinais de pontuação","subtema":"vírgulas em oração adjetiva explicativa e alteração de sentido","dificuldade":"dificil","enunciado":"Julgue o item a seguir. No período \"Os policiais, que concluíram o curso, receberam a certificação\", a retirada das duas vírgulas manteria inalterado o sentido, pois a oração relativa continuaria apenas acrescentando uma informação sobre todos os policiais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é a afirmação de que o sentido permaneceria inalterado. Com vírgulas, \"que concluíram o curso\" é oração adjetiva explicativa e acrescenta uma informação sobre o conjunto de policiais referido. Sem vírgulas, a oração torna-se restritiva e delimita quais policiais receberam a certificação. A formulação correta é: a retirada das vírgulas altera o alcance semântico da oração relativa.","referencia":"Pontuação de orações adjetivas explicativas e restritivas; Bechara, Moderna Gramática Portuguesa.","tags":["pontuacao","oracao-adjetiva","sentido"]},{"id":"POR021","area":"Língua Portuguesa","tema":"Concordância verbal","subtema":"verbo fazer impessoal na indicação de tempo decorrido","dificuldade":"facil","enunciado":"Julgue o item a seguir. A frase \"Fazem dois anos que o batalhão passou por reforma\" está de acordo com a norma-padrão, porque o verbo \"fazer\" deve concordar com a expressão plural \"dois anos\".","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é \"Fazem dois anos\". Quando indica tempo decorrido, o verbo \"fazer\" é impessoal e permanece na terceira pessoa do singular. A formulação correta é: \"Faz dois anos que o batalhão passou por reforma\".","referencia":"Concordância verbal com verbos impessoais; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["concordancia-verbal","verbo-fazer","impessoalidade"]},{"id":"POR022","area":"Língua Portuguesa","tema":"Concordância verbal","subtema":"concordância com a expressão mais de um","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Na frase \"Mais de um candidato apresentou recurso contra o resultado preliminar\", o emprego da forma verbal no singular está de acordo com a norma-padrão, considerada a estrutura do sujeito.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Com a expressão \"mais de um\", a concordância verbal é normalmente feita no singular, salvo contextos específicos, como ideia de reciprocidade ou repetição, que não estão presentes na frase.","referencia":"Concordância verbal com expressões quantitativas; Bechara, Moderna Gramática Portuguesa.","tags":["concordancia-verbal","mais-de-um","sujeito"]},{"id":"POR023","area":"Língua Portuguesa","tema":"Concordância nominal","subtema":"concordância do adjetivo anexo","dificuldade":"facil","enunciado":"Julgue o item a seguir. A frase \"Seguem anexo as certidões exigidas para a matrícula\" está de acordo com a norma-padrão quanto à concordância nominal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é \"anexo\". Empregado como adjetivo, \"anexo\" deve concordar com o substantivo a que se refere. A formulação correta é: \"Seguem anexas as certidões exigidas para a matrícula\".","referencia":"Concordância nominal de adjetivos; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["concordancia-nominal","adjetivo","anexo"]},{"id":"POR024","area":"Língua Portuguesa","tema":"Concordância nominal","subtema":"invariabilidade de meio com valor adverbial","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Na frase \"As policiais permaneceram meio apreensivas antes do início da operação\", a forma \"meio\" está corretamente empregada no singular e no masculino, pois atua como advérbio de intensidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Quando equivale a \"um pouco\" e modifica um adjetivo, \"meio\" é advérbio e, por isso, permanece invariável: \"meio apreensivas\".","referencia":"Concordância nominal e emprego de palavras variáveis e invariáveis; Bechara, Moderna Gramática Portuguesa.","tags":["concordancia-nominal","meio","adverbio"]},{"id":"POR025","area":"Língua Portuguesa","tema":"Regência verbal","subtema":"regência do verbo assistir no sentido de presenciar","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Na frase \"Os recrutas assistiram ao treinamento de primeiros socorros\", o emprego da preposição \"a\" está de acordo com a regência do verbo \"assistir\" no sentido de ver ou presenciar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Na norma-padrão tradicional, \"assistir\", com o sentido de ver ou presenciar, rege complemento introduzido pela preposição \"a\": assistir a algo.","referencia":"Regência verbal do verbo assistir; Bechara, Moderna Gramática Portuguesa.","tags":["regencia-verbal","assistir","preposicao"]},{"id":"POR026","area":"Língua Portuguesa","tema":"Regência verbal","subtema":"regência do verbo preferir e paralelismo entre complementos","dificuldade":"dificil","enunciado":"Julgue o item a seguir. A construção \"A equipe prefere mais o patrulhamento preventivo do que ações apenas reativas\" está de acordo com a norma-padrão, pois o verbo \"preferir\" admite a estrutura comparativa \"mais... do que\" para intensificar a escolha.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é \"prefere mais ... do que\". Na norma-padrão tradicional, o verbo \"preferir\" já contém ideia comparativa e rege a estrutura \"preferir X a Y\", sem o reforço \"mais\". A formulação correta é: \"A equipe prefere o patrulhamento preventivo a ações apenas reativas\".","referencia":"Regência verbal do verbo preferir; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["regencia-verbal","preferir","norma-padrao"]},{"id":"POR027","area":"Língua Portuguesa","tema":"Regência nominal","subtema":"regência do adjetivo apto","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Na frase \"O candidato foi considerado apto em exercer a função\", a preposição \"em\" atende à regência nominal recomendada pela norma-padrão para o adjetivo \"apto\".","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é \"apto em exercer\". Na norma-padrão, o adjetivo \"apto\" rege normalmente as preposições \"a\" ou \"para\". As formulações adequadas são \"apto a exercer a função\" ou \"apto para exercer a função\".","referencia":"Regência nominal de adjetivos; dicionários de regência e Bechara, Moderna Gramática Portuguesa.","tags":["regencia-nominal","apto","preposicao"]},{"id":"POR028","area":"Língua Portuguesa","tema":"Regência nominal","subtema":"regência do adjetivo obediente e contração preposicional","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Na frase \"A conduta esperada deve ser obediente às normas institucionais\", o segmento \"às normas institucionais\" completa corretamente o sentido do adjetivo \"obediente\", que rege a preposição \"a\".","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O adjetivo \"obediente\" rege complemento introduzido pela preposição \"a\". Como \"normas\" vem determinado pelo artigo feminino plural \"as\", ocorre a contração \"a + as = às\".","referencia":"Regência nominal do adjetivo obediente; Bechara, Moderna Gramática Portuguesa.","tags":["regencia-nominal","obediente","preposicao"]},{"id":"POR029","area":"Língua Portuguesa","tema":"Crase","subtema":"ausência de crase antes de artigo indefinido","dificuldade":"facil","enunciado":"Julgue o item a seguir. Na frase \"O servidor entregou o documento à uma candidata\", o emprego do acento indicativo de crase é obrigatório porque o verbo \"entregar\" admite complemento introduzido pela preposição \"a\".","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é \"à uma candidata\" e a afirmação de obrigatoriedade da crase. Embora possa haver preposição \"a\" exigida pela regência, diante do artigo indefinido \"uma\" não ocorre a fusão com o artigo definido feminino \"a\". A formulação correta é: \"O servidor entregou o documento a uma candidata\".","referencia":"Emprego do acento indicativo de crase; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["crase","artigo-indefinido","regencia"]},{"id":"POR030","area":"Língua Portuguesa","tema":"Crase","subtema":"crase antes de pronome demonstrativo aquele","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Na frase \"O comandante dirigiu-se àquela unidade antes do início da operação\", o acento indicativo de crase em \"àquela\" decorre da fusão da preposição \"a\", exigida por \"dirigir-se\", com o elemento inicial do pronome demonstrativo \"aquela\".","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O verbo pronominal \"dirigir-se\" rege a preposição \"a\" para indicar destino; diante de \"aquela\", ocorre a fusão da preposição com o \"a\" inicial do pronome demonstrativo, resultando em \"àquela\".","referencia":"Crase diante dos demonstrativos aquele, aquela e aquilo; Bechara, Moderna Gramática Portuguesa.","tags":["crase","pronome-demonstrativo","regencia"]},{"id":"POR031","area":"Língua Portuguesa","tema":"Colocação dos pronomes átonos","subtema":"ênclise no início de oração na norma-padrão formal","dificuldade":"facil","enunciado":"Julgue o item a seguir. Em um texto formal, a frase \"Me informaram o horário da apresentação\" está de acordo com a colocação pronominal prescrita pela norma-padrão para o início absoluto de oração.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho inadequado, na norma-padrão formal, é o início da oração com o pronome átono \"Me\". Sem palavra atrativa antes do verbo, recomenda-se a ênclise: \"Informaram-me o horário da apresentação\".","referencia":"Colocação pronominal na norma-padrão; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["colocacao-pronominal","enclise","pronome-atono"]},{"id":"POR032","area":"Língua Portuguesa","tema":"Colocação dos pronomes átonos","subtema":"próclise obrigatória após palavra negativa","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Em um documento redigido segundo a norma-padrão, a frase \"Jamais disseram-me que o prazo seria prorrogado\" apresenta colocação pronominal adequada, pois o advérbio \"jamais\" não interfere na posição do pronome átono.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é \"Jamais disseram-me\". O advérbio de valor negativo \"jamais\", sem pausa que o separe do verbo, atua como fator de próclise. A formulação correta é: \"Jamais me disseram que o prazo seria prorrogado\".","referencia":"Fatores de próclise e colocação dos pronomes átonos; Bechara, Moderna Gramática Portuguesa.","tags":["colocacao-pronominal","proclise","negacao"]},{"id":"POR033","area":"Língua Portuguesa","tema":"Reescrita de frases e parágrafos","subtema":"transformação da voz ativa em voz passiva analítica","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A reescrita de \"A comissão divulgou o resultado preliminar na sexta-feira\" como \"O resultado preliminar foi divulgado pela comissão na sexta-feira\" preserva as relações essenciais de sentido e mantém a correção gramatical.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A reescrita transforma a voz ativa em voz passiva analítica, mantendo o paciente \"o resultado preliminar\", o agente \"a comissão\" e a circunstância temporal \"na sexta-feira\".","referencia":"Vozes verbais e reescrita sintática; Cunha e Cintra, Nova Gramática do Português Contemporâneo.","tags":["reescrita","voz-passiva","sentido"]},{"id":"POR034","area":"Língua Portuguesa","tema":"Reescrita de frases e parágrafos","subtema":"preservação de relação semântica na reescrita","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A frase \"Embora estivesse cansado, o candidato continuou estudando\" pode ser reescrita como \"Porque estava cansado, o candidato continuou estudando\" sem alteração relevante de sentido.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é a afirmação de preservação do sentido. \"Embora\" expressa concessão, enquanto \"porque\" introduz causa. A formulação correta é: uma reescrita equivalente deve manter o valor concessivo, como em \"Apesar de estar cansado, o candidato continuou estudando\".","referencia":"Reescrita e preservação de relações lógico-semânticas; Bechara, Moderna Gramática Portuguesa.","tags":["reescrita","concessao","causa"]},{"id":"POR035","area":"Língua Portuguesa","tema":"Significação das palavras","subtema":"sentido contextual de verbo","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No trecho \"A nova escala foi adotada para mitigar os efeitos da falta temporária de efetivo\", o verbo \"mitigar\" foi empregado com sentido de atenuar ou reduzir.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. No contexto, \"mitigar\" significa tornar menos intenso, aliviar ou reduzir os efeitos de determinada situação.","referencia":"Semântica lexical e sentido contextual; dicionários gerais da língua portuguesa, como Houaiss e Michaelis.","tags":["semantica","significacao","vocabulario"]},{"id":"POR036","area":"Língua Portuguesa","tema":"Substituição de palavras e trechos de texto","subtema":"parônimos e preservação de sentido","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. No trecho \"A equipe foi alertada sobre o risco iminente de alagamento\", a substituição de \"iminente\" por \"eminente\" manteria a correção semântica, pois as duas palavras são sinônimas nesse contexto.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é a afirmação de sinonímia. \"Iminente\" significa prestes a ocorrer; \"eminente\" significa elevado, destacado ou ilustre. A formulação correta é: a substituição alteraria o sentido e tornaria inadequada a expressão \"risco eminente\" nesse contexto.","referencia":"Semântica lexical, parônimos e substituição vocabular; dicionários gerais da língua portuguesa.","tags":["substituicao","paronimos","sentido"]},{"id":"POR037","area":"Língua Portuguesa","tema":"Reorganização da estrutura de orações e períodos","subtema":"deslocamento de adjunto adverbial e manutenção do sentido","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. A reorganização de \"Após a cerimônia, a equipe retornou ao quartel\" para \"A equipe retornou ao quartel após a cerimônia\" preserva as relações sintáticas essenciais e o sentido temporal básico do período.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O adjunto adverbial temporal \"após a cerimônia\" pode ser deslocado para o final da oração sem alteração do vínculo semântico fundamental entre o retorno e a circunstância de tempo.","referencia":"Ordem dos termos da oração e deslocamento de adjuntos adverbiais; Bechara, Moderna Gramática Portuguesa.","tags":["reorganizacao","adjunto-adverbial","ordem"]},{"id":"POR038","area":"Língua Portuguesa","tema":"Reorganização da estrutura de orações e períodos","subtema":"escopo de advérbio focalizador e alteração de sentido","dificuldade":"dificil","enunciado":"Julgue o item a seguir. A reorganização de \"Apenas o comandante autorizou a entrada dos visitantes ontem\" para \"Ontem, o comandante autorizou apenas a entrada dos visitantes\" preserva integralmente o sentido, pois o deslocamento de \"apenas\" não modifica o elemento sobre o qual incide a restrição.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O trecho incorreto é a afirmação de que o deslocamento de \"apenas\" não altera seu escopo. Na primeira versão, \"apenas\" restringe o sujeito, indicando que somente o comandante autorizou. Na segunda, restringe a expressão \"a entrada dos visitantes\", contrastando-a com outras possíveis autorizações. A formulação correta é: a reorganização altera o sentido ao modificar o foco da restrição.","referencia":"Ordem dos constituintes, foco e escopo de advérbios; gramática descritiva e estudos de semântica da língua portuguesa.","tags":["reorganizacao","escopo","foco"]},{"id":"POR039","area":"Língua Portuguesa","tema":"Reescrita de textos de diferentes gêneros e níveis de formalidade","subtema":"adequação de mensagem informal para comunicado formal","dificuldade":"intermediaria","enunciado":"Julgue o item a seguir. Considere a mensagem informal: \"Pessoal, não esqueçam: amanhã o portão fecha às 7h em ponto, então cheguem antes.\" Em um comunicado formal dirigido aos candidatos, a reescrita \"Solicita-se aos candidatos que compareçam antes das 7h, horário previsto para o fechamento dos portões\" preserva a informação central e eleva adequadamente o nível de formalidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A reescrita elimina marcas coloquiais como \"Pessoal\" e \"não esqueçam\", emprega construção impessoal adequada ao registro formal e mantém a informação essencial sobre a necessidade de chegada anterior ao fechamento dos portões às 7h.","referencia":"Adequação linguística, registro formal e retextualização entre gêneros; Manual de Redação da Presidência da República e estudos de gêneros textuais.","tags":["reescrita","formalidade","genero-textual"]},{"id":"POR040","area":"Língua Portuguesa","tema":"Reescrita de textos de diferentes gêneros e níveis de formalidade","subtema":"retextualização de solicitação coloquial para registro administrativo","dificuldade":"dificil","enunciado":"Julgue o item a seguir. Considere a mensagem enviada em grupo de trabalho: \"Se der, manda os nomes de quem vai participar até sexta, porque a gente precisa fechar a lista.\" Para um expediente administrativo formal, a reescrita \"Solicita-se o envio, até sexta-feira, dos nomes dos participantes, a fim de que seja concluída a lista\" mantém a finalidade comunicativa básica e substitui marcas de oralidade por estruturas compatíveis com registro formal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A reescrita conserva a solicitação, o prazo e a finalidade de fechamento da lista, ao mesmo tempo que elimina expressões coloquiais como \"se der\", \"manda\" e \"a gente\", adequando o texto ao registro administrativo formal.","referencia":"Retextualização, adequação ao gênero e níveis de formalidade; Manual de Redação da Presidência da República e estudos de gêneros textuais.","tags":["reescrita","registro-formal","retextualizacao"]}],"matematica":[{"id":"MAT001","area":"Matemática","tema":"Álgebra linear","subtema":"Equação do primeiro grau","dificuldade":"facil","enunciado":"Em um controle de materiais, a quantidade x de caixas satisfaz a equação 3x + 7 = 25. Nessa situação, x é igual a 6. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Resolvendo a equação: 3x + 7 = 25 ⇒ 3x = 18 ⇒ x = 6. O valor obtido coincide com a afirmação do item. Logo, o item está CERTO.","referencia":"MAPA 023 — Álgebra linear","tags":["equação do 1º grau","álgebra","resolução de equações"]},{"id":"MAT002","area":"Matemática","tema":"Álgebra linear","subtema":"Sistema linear de duas equações","dificuldade":"dificil","enunciado":"Duas equipes, com efetivos x e y, satisfazem simultaneamente 2x + y = 17 e x - y = 1. Nessa situação, o produto xy é igual a 28. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Da equação x - y = 1, temos y = x - 1. Substituindo em 2x + y = 17: 2x + x - 1 = 17 ⇒ 3x = 18 ⇒ x = 6 e y = 5. Assim, xy = 6 × 5 = 30. Como 30 é diferente de 28, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 023 — Álgebra linear","tags":["sistema linear","duas incógnitas","substituição"]},{"id":"MAT003","area":"Matemática","tema":"Conjunto numérico: operações com números inteiros","subtema":"Adição e subtração de inteiros","dificuldade":"facil","enunciado":"O saldo de determinado almoxarifado era de -8 unidades em um registro de ajuste. Em seguida, foram acrescentadas 15 unidades e retiradas 10 unidades. Nessa situação, o saldo final registrado será igual a -1 unidade. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Efetuando as operações: -8 + 15 - 10 = 7 - 10 = -3. O saldo final é -3, e não -1. Portanto, o resultado não coincide com a afirmação. Logo, o item está ERRADO.","referencia":"MAPA 024 — Conjunto numérico: operações com números inteiros","tags":["números inteiros","adição","subtração"]},{"id":"MAT004","area":"Matemática","tema":"Conjunto numérico: operações com números inteiros","subtema":"Operações combinadas com inteiros","dificuldade":"intermediaria","enunciado":"Considere a expressão (-18) ÷ 3 + 4 × (-2), usada em um cálculo de variação acumulada. O valor dessa expressão é igual a -14. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Respeitando a ordem das operações: (-18) ÷ 3 = -6 e 4 × (-2) = -8. Depois, -6 + (-8) = -14. O resultado é exatamente o valor informado. Logo, o item está CERTO.","referencia":"MAPA 024 — Conjunto numérico: operações com números inteiros","tags":["números inteiros","operações combinadas","ordem das operações"]},{"id":"MAT005","area":"Matemática","tema":"Conjunto numérico: operações com números fracionários","subtema":"Adição e subtração de frações","dificuldade":"facil","enunciado":"Em uma atividade, foram executados inicialmente 3/4 de uma etapa e, depois, mais 2/3 de outra medida equivalente. Se 5/12 do total contabilizado forem desconsiderados, o resultado numérico será igual a 1. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Calculando: 3/4 + 2/3 = 9/12 + 8/12 = 17/12. Em seguida, 17/12 - 5/12 = 12/12 = 1. O resultado coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 025 — Conjunto numérico: operações com números fracionários","tags":["frações","adição de frações","subtração de frações"]},{"id":"MAT006","area":"Matemática","tema":"Conjunto numérico: operações com números fracionários","subtema":"Fração de uma quantidade fracionária","dificuldade":"intermediaria","enunciado":"O tanque de uma viatura estava com 5/6 de sua capacidade preenchida. Durante uma operação, foi consumido 2/5 da quantidade de combustível que havia no tanque. Nessa situação, restará no tanque 7/15 da capacidade total. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Foi consumido 2/5 do que havia, então permaneceu 3/5 da quantidade inicial. A fração restante da capacidade é (5/6) × (3/5) = 15/30 = 1/2. Como 1/2 é diferente de 7/15, a afirmação está incorreta. Logo, o item está ERRADO.","referencia":"MAPA 025 — Conjunto numérico: operações com números fracionários","tags":["frações","multiplicação de frações","fração de quantidade"]},{"id":"MAT007","area":"Matemática","tema":"Conjunto numérico: operações com números decimais","subtema":"Adição e subtração de decimais","dificuldade":"facil","enunciado":"Uma medição inicial foi de 18,75 unidades. Após uma redução de 6,40 unidades e um acréscimo de 2,35 unidades, o valor final será 14,80 unidades. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Calculando: 18,75 - 6,40 = 12,35. Depois, 12,35 + 2,35 = 14,70. O resultado final é 14,70, e não 14,80. Logo, o item está ERRADO.","referencia":"MAPA 026 — Conjunto numérico: operações com números decimais","tags":["números decimais","adição","subtração"]},{"id":"MAT008","area":"Matemática","tema":"Conjunto numérico: operações com números decimais","subtema":"Multiplicação e soma com valores decimais","dificuldade":"intermediaria","enunciado":"Foram adquiridos 3 itens a R$ 12,60 cada e 2 itens a R$ 4,75 cada. Se o pagamento foi feito com R$ 50,00, o troco devido será de R$ 2,70. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O custo dos três primeiros itens é 3 × 12,60 = 37,80. O dos outros dois é 2 × 4,75 = 9,50. Total: 37,80 + 9,50 = 47,30. Troco: 50,00 - 47,30 = 2,70. Logo, o item está CERTO.","referencia":"MAPA 026 — Conjunto numérico: operações com números decimais","tags":["números decimais","multiplicação","situação-problema"]},{"id":"MAT009","area":"Matemática","tema":"Proporções e divisão proporcional","subtema":"Divisão em razão direta","dificuldade":"facil","enunciado":"Sessenta e quatro coletes serão distribuídos entre duas equipes na razão 3:5. Nessa situação, a equipe que receber mais coletes ficará com 16 unidades a mais que a outra. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A soma das partes da razão é 3 + 5 = 8. Cada parte vale 64 ÷ 8 = 8. As equipes recebem 3 × 8 = 24 e 5 × 8 = 40 coletes. A diferença é 40 - 24 = 16. Logo, o item está CERTO.","referencia":"MAPA 027 — Proporções e divisão proporcional","tags":["proporção","razão","divisão proporcional"]},{"id":"MAT010","area":"Matemática","tema":"Proporções e divisão proporcional","subtema":"Divisão proporcional em três partes","dificuldade":"intermediaria","enunciado":"Uma gratificação de R$ 1.260 será dividida entre três servidores em partes diretamente proporcionais a 2, 3 e 4. Nessa situação, o servidor correspondente à maior parte receberá R$ 540. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A soma dos pesos é 2 + 3 + 4 = 9. Cada unidade proporcional vale 1.260 ÷ 9 = 140. A maior parte é 4 × 140 = 560. Como R$ 560 é diferente de R$ 540, a afirmação está incorreta. Logo, o item está ERRADO.","referencia":"MAPA 027 — Proporções e divisão proporcional","tags":["divisão proporcional","razão direta","partilha"]},{"id":"MAT011","area":"Matemática","tema":"Proporções e divisão proporcional","subtema":"Divisão inversamente proporcional","dificuldade":"dificil","enunciado":"Uma quantia de R$ 720 será repartida entre três pessoas em partes inversamente proporcionais a 2, 3 e 6. Nessa situação, a maior parcela será exatamente três vezes a menor parcela. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"As razões inversas são 1/2, 1/3 e 1/6. Multiplicando todas por 6, obtemos a razão equivalente 3:2:1. A soma é 6, então cada parte vale 720 ÷ 6 = 120. As parcelas são 360, 240 e 120. Como 360 = 3 × 120, a afirmação é verdadeira. Logo, o item está CERTO.","referencia":"MAPA 027 — Proporções e divisão proporcional","tags":["divisão inversamente proporcional","proporção","partilha"]},{"id":"MAT012","area":"Matemática","tema":"Regra de três simples","subtema":"Grandezas diretamente proporcionais","dificuldade":"facil","enunciado":"Cinco agentes, trabalhando no mesmo ritmo, conferem 150 fichas em 3 horas. Mantido o mesmo tempo de trabalho e o mesmo rendimento individual, 8 agentes conferirão 250 fichas. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Com o tempo fixo, a quantidade de fichas é diretamente proporcional ao número de agentes. Assim, 150 × (8/5) = 240 fichas. Como o resultado é 240, e não 250, a afirmação está incorreta. Logo, o item está ERRADO.","referencia":"MAPA 028 — Regra de três simples","tags":["regra de três simples","proporção direta","produtividade"]},{"id":"MAT013","area":"Matemática","tema":"Regra de três simples","subtema":"Consumo diretamente proporcional","dificuldade":"intermediaria","enunciado":"Para sinalizar 80 metros de uma área, são utilizados 12 litros de tinta. Mantida a mesma taxa de consumo, 18 litros serão suficientes para sinalizar 125 metros. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A relação é diretamente proporcional: 12 L correspondem a 80 m. Para 18 L, x = 80 × 18 ÷ 12 = 120 m. Como 18 litros correspondem a 120 metros, e não 125, o item está incorreto. Logo, o item está ERRADO.","referencia":"MAPA 028 — Regra de três simples","tags":["regra de três simples","proporção direta","consumo"]},{"id":"MAT014","area":"Matemática","tema":"Regra de três simples","subtema":"Grandezas inversamente proporcionais","dificuldade":"intermediaria","enunciado":"Um estoque de combustível é suficiente para abastecer 6 viaturas por 15 dias, considerando consumo diário idêntico por viatura. Se o mesmo estoque passar a atender 10 viaturas, ele será suficiente por 9 dias. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Número de viaturas e duração do estoque são inversamente proporcionais. Logo, 6 × 15 = 10 × x. Assim, x = 90 ÷ 10 = 9 dias. O resultado coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 028 — Regra de três simples","tags":["regra de três simples","proporção inversa","consumo"]},{"id":"MAT015","area":"Matemática","tema":"Regra de três composta","subtema":"Produtividade com número de pessoas e tempo","dificuldade":"intermediaria","enunciado":"Quatro servidores processam 240 formulários em 6 horas, todos com a mesma produtividade. Mantido o mesmo ritmo, 6 servidores processarão 320 formulários em 5 horas. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A produção é diretamente proporcional ao número de servidores e ao tempo. Assim, x = 240 × (6/4) × (5/6) = 240 × 5/4 = 300 formulários. Como o resultado é 300, e não 320, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 029 — Regra de três composta","tags":["regra de três composta","produtividade","grandezas diretas"]},{"id":"MAT016","area":"Matemática","tema":"Regra de três composta","subtema":"Produção com trabalhadores, dias e jornada","dificuldade":"dificil","enunciado":"Oito trabalhadores, atuando 5 dias por 6 horas diárias, montam 120 kits. Nas mesmas condições de produtividade, 10 trabalhadores, atuando 4 dias por 9 horas diárias, montarão 180 kits. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A produção é diretamente proporcional ao número de trabalhadores, aos dias e às horas diárias. Portanto, x = 120 × (10/8) × (4/5) × (9/6). O fator total é 1,25 × 0,8 × 1,5 = 1,5. Assim, x = 120 × 1,5 = 180 kits. O resultado coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 029 — Regra de três composta","tags":["regra de três composta","produção","produtividade"]},{"id":"MAT017","area":"Matemática","tema":"Porcentagem","subtema":"Cálculo percentual direto","dificuldade":"facil","enunciado":"Em um lote de 240 equipamentos, 15% foram separados para manutenção preventiva. Nessa situação, 36 equipamentos foram separados. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Calculando 15% de 240: 0,15 × 240 = 36. O número obtido é exatamente o informado no item. Logo, o item está CERTO.","referencia":"MAPA 030 — Porcentagem","tags":["porcentagem","cálculo percentual","percentual"]},{"id":"MAT018","area":"Matemática","tema":"Porcentagem","subtema":"Aumentos e reduções sucessivas","dificuldade":"intermediaria","enunciado":"Uma verba de R$ 500 sofre aumento de 20% e, em seguida, redução de 20% sobre o novo valor. Nessa situação, a verba retorna exatamente a R$ 500. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Após o aumento: 500 × 1,20 = 600. Depois da redução: 600 × 0,80 = 480. O valor final é R$ 480, e não R$ 500, pois os percentuais incidem sobre bases diferentes. Logo, o item está ERRADO.","referencia":"MAPA 030 — Porcentagem","tags":["porcentagem","variações sucessivas","aumento e desconto"]},{"id":"MAT019","area":"Matemática","tema":"Porcentagem","subtema":"Determinação do total a partir de uma porcentagem","dificuldade":"intermediaria","enunciado":"Em uma turma, 35% dos alunos correspondem a 84 pessoas. Nessa situação, o número de alunos que não pertence a esse grupo de 35% é igual a 164. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Se 35% correspondem a 84, então o total é 84 ÷ 0,35 = 240. Os que não pertencem ao grupo representam 65%: 240 - 84 = 156. Como 156 é diferente de 164, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 030 — Porcentagem","tags":["porcentagem","valor total","percentual complementar"]},{"id":"MAT020","area":"Matemática","tema":"Juros simples","subtema":"Cálculo de juros e montante","dificuldade":"facil","enunciado":"Um capital de R$ 2.000 é aplicado a juros simples de 2% ao mês durante 5 meses. Nessa situação, o montante ao final do período será de R$ 2.200. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Em juros simples, J = C × i × t. Assim, J = 2.000 × 0,02 × 5 = 200. O montante é M = 2.000 + 200 = 2.200. O valor coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 031 — Juros simples","tags":["juros simples","montante","capital"]},{"id":"MAT021","area":"Matemática","tema":"Juros simples","subtema":"Determinação da taxa de juros","dificuldade":"intermediaria","enunciado":"Um capital de R$ 2.400, aplicado por 6 meses a juros simples, produz montante de R$ 2.760. Nessa situação, a taxa de juros da aplicação é de 3% ao mês. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O juro é J = 2.760 - 2.400 = 360. Pela fórmula J = C × i × t, temos 360 = 2.400 × i × 6. Logo, i = 360 ÷ 14.400 = 0,025 = 2,5% ao mês. Como a taxa não é 3%, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 031 — Juros simples","tags":["juros simples","taxa de juros","equação financeira"]},{"id":"MAT022","area":"Matemática","tema":"Juros compostos","subtema":"Montante com capitalização composta","dificuldade":"intermediaria","enunciado":"Um capital de R$ 1.000 é aplicado a juros compostos de 10% ao período por 2 períodos. Nessa situação, o montante final será de R$ 1.210. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Em juros compostos, M = C(1 + i)^t. Assim, M = 1.000 × (1,10)^2 = 1.000 × 1,21 = 1.210. O montante coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 032 — Juros compostos","tags":["juros compostos","montante","capitalização composta"]},{"id":"MAT023","area":"Matemática","tema":"Juros compostos","subtema":"Cálculo do juro composto acumulado","dificuldade":"intermediaria","enunciado":"Um capital de R$ 2.500 é aplicado a juros compostos de 4% ao mês durante 3 meses. Nessa situação, o total de juros acumulados ao final do período será de R$ 312,16. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O montante é M = 2.500 × (1,04)^3. Como (1,04)^3 = 1,124864, temos M = 2.812,16. O juro é J = 2.812,16 - 2.500 = 312,16. O valor coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 032 — Juros compostos","tags":["juros compostos","juros acumulados","montante"]},{"id":"MAT024","area":"Matemática","tema":"Juros compostos","subtema":"Comparação entre juros simples e com
