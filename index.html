arito":"B","comentario":"O item descreve característica incompatível com a noção tradicional de crime impropriamente militar. Nessa classificação, trata-se de delito previsto no CPM que possui correspondência no direito penal comum e adquire natureza militar quando presentes as circunstâncias legalmente exigidas.","referencia":"CPM, art. 9º; classificação doutrinária tradicional dos crimes militares.","tags":["crime impropriamente militar","crime comum","classificação doutrinária"]},{"id":"DPM037","area":"Noções de Direito Penal Militar","tema":"Crimes impropriamente militares","subtema":"Infração comum em contexto militar","dificuldade":"dificil","enunciado":"Um delito previsto no CPM que também possua correspondente na legislação penal comum pode ser classificado, segundo a doutrina tradicional, como crime impropriamente militar quando, no caso concreto, estiver presente a situação de militarização exigida pelo art. 9º do CPM.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A classificação tradicional dos crimes impropriamente militares abrange delitos que possuem correspondência na legislação penal comum, mas assumem natureza militar quando praticados nas hipóteses definidas pela legislação castrense, especialmente pelo art. 9º do CPM.","referencia":"CPM, art. 9º; classificação doutrinária tradicional dos crimes militares.","tags":["crime impropriamente militar","circunstâncias do fato","artigo 9"]},{"id":"DPM038","area":"Noções de Direito Penal Militar","tema":"Crimes militares por extensão","subtema":"Requisitos de militarização","dificuldade":"intermediaria","enunciado":"Após a Lei nº 13.491/2017, qualquer crime previsto fora do CPM transforma-se automaticamente em crime militar sempre que seu autor for militar, sendo desnecessário verificar as circunstâncias previstas no art. 9º.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Lei nº 13.491/2017 ampliou o art. 9º, II, para abranger também crimes previstos na legislação penal, mas não eliminou os requisitos de militarização. É indispensável que o fato se enquadre em uma das circunstâncias previstas no próprio art. 9º.","referencia":"CPM, art. 9º, II; Lei nº 13.491/2017.","tags":["crime militar por extensão","Lei 13491","artigo 9"]},{"id":"DPM039","area":"Noções de Direito Penal Militar","tema":"Crimes militares por extensão","subtema":"Ampliação promovida pela Lei nº 13.491/2017","dificuldade":"intermediaria","enunciado":"A expressão crimes previstos na legislação penal, introduzida no inciso II do art. 9º pela Lei nº 13.491/2017, permite que delito tipificado fora do CPM seja considerado crime militar, desde que praticado em uma das situações previstas pelo dispositivo legal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A alteração promovida pela Lei nº 13.491/2017 ampliou o inciso II do art. 9º para alcançar também crimes previstos na legislação penal, desde que presentes as circunstâncias de militarização previstas no dispositivo. Essa categoria é usualmente denominada crime militar por extensão.","referencia":"CPM, art. 9º, II; Lei nº 13.491/2017.","tags":["crime militar por extensão","legislação penal","Lei 13491"]},{"id":"DPM040","area":"Noções de Direito Penal Militar","tema":"Crimes militares por extensão","subtema":"Tipificação e pena do delito previsto fora do CPM","dificuldade":"dificil","enunciado":"Quando um delito previsto exclusivamente na legislação penal comum ou especial é classificado como crime militar por extensão, a pena prevista nessa legislação deixa de ser aplicável e deve ser substituída pela pena do crime do CPM que mais se assemelhe à conduta.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A classificação do delito como crime militar por extensão não autoriza a criação ou substituição de pena por analogia. O delito continua tipificado na legislação penal correspondente, inclusive quanto à sanção nela prevista, enquanto sua natureza militar decorre do enquadramento nas hipóteses do art. 9º do CPM.","referencia":"CPM, arts. 1º e 9º, II; Lei nº 13.491/2017.","tags":["crime militar por extensão","princípio da legalidade","pena"]}],"processual_penal_militar":[{"id":"DPPM001","area":"Noções de Direito Processual Penal Militar","tema":"Processo Penal Militar e sua aplicação","subtema":"Aplicação do CPPM à Justiça Militar Estadual","dificuldade":"facil","enunciado":"Nos processos da Justiça Militar Estadual envolvendo oficiais e praças das Polícias Militares e dos Corpos de Bombeiros Militares, aplicam-se, no que couber, as normas do CPPM, ressalvadas as matérias relativas à organização da Justiça, aos recursos e à execução da sentença.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM determina sua aplicação aos processos da Justiça Militar Estadual, no que forem aplicáveis, ressalvando expressamente a organização da Justiça, os recursos e a execução da sentença.","referencia":"CPPM, art. 6º.","tags":["aplicação do CPPM","Justiça Militar Estadual","art. 6º"]},{"id":"DPPM002","area":"Noções de Direito Processual Penal Militar","tema":"Processo Penal Militar e sua aplicação","subtema":"Suprimento de omissões","dificuldade":"intermediaria","enunciado":"Diante de omissão do CPPM, a legislação processual penal comum deve ser aplicada obrigatoriamente e de forma irrestrita, ainda que a solução contrarie a índole do processo penal militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A legislação processual penal comum pode suprir omissões do CPPM somente quando for aplicável ao caso concreto e sem prejuízo da índole do processo penal militar. O CPPM também admite jurisprudência, usos e costumes militares, princípios gerais do Direito e analogia.","referencia":"CPPM, art. 3º.","tags":["omissão","processo penal comum","subsidiariedade"]},{"id":"DPPM003","area":"Noções de Direito Processual Penal Militar","tema":"Processo Penal Militar e sua aplicação","subtema":"Aplicação intertemporal","dificuldade":"dificil","enunciado":"As normas processuais penais militares que entram em vigor durante a tramitação de um processo somente se aplicam aos feitos iniciados depois da mudança legislativa, permanecendo os processos pendentes integralmente regidos pela lei anterior.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM adota a aplicação imediata da lei processual penal militar aos processos em curso, preservando a validade dos atos praticados sob a vigência da lei anterior, ressalvada a hipótese expressamente prevista no art. 711.","referencia":"CPPM, art. 5º.","tags":["lei processual no tempo","atos processuais","aplicação imediata"]},{"id":"DPPM004","area":"Noções de Direito Processual Penal Militar","tema":"Polícia judiciária militar","subtema":"Competência para apuração","dificuldade":"facil","enunciado":"Compete à polícia judiciária militar apurar os crimes militares e sua autoria, bem como os delitos que, por lei especial, estejam sujeitos à jurisdição militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A apuração dos crimes militares e de sua autoria integra expressamente as atribuições da polícia judiciária militar, assim como a apuração dos crimes que, por lei especial, estejam sujeitos à jurisdição militar.","referencia":"CPPM, art. 8º, alínea a.","tags":["polícia judiciária militar","competência","apuração"]},{"id":"DPPM005","area":"Noções de Direito Processual Penal Militar","tema":"Polícia judiciária militar","subtema":"Delegação para instauração de IPM","dificuldade":"intermediaria","enunciado":"A delegação para instauração de IPM pode recair em qualquer oficial da ativa, independentemente do posto do indiciado, desde que a autoridade delegante fundamente a escolha.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Em regra, a delegação para instauração de IPM deve recair em oficial de posto superior ao do indiciado. Se isso não for possível, admite-se oficial do mesmo posto, desde que mais antigo, observadas as regras do CPPM.","referencia":"CPPM, art. 7º, §§ 2º e 3º.","tags":["delegação","hierarquia","IPM"]},{"id":"DPPM006","area":"Noções de Direito Processual Penal Militar","tema":"Polícia judiciária militar","subtema":"Cooperação com órgãos civis","dificuldade":"dificil","enunciado":"A polícia judiciária militar não pode requisitar pesquisas ou exames à polícia civil ou a repartições técnicas civis, pois toda diligência de IPM deve ser executada exclusivamente por órgãos militares.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM autoriza expressamente a polícia judiciária militar a requisitar da polícia civil e de repartições técnicas civis pesquisas e exames necessários ao complemento e subsídio do IPM.","referencia":"CPPM, art. 8º, alínea g.","tags":["cooperação institucional","polícia civil","perícia"]},{"id":"DPPM007","area":"Noções de Direito Processual Penal Militar","tema":"Inquérito policial militar","subtema":"Finalidade do IPM","dificuldade":"facil","enunciado":"O IPM é a apuração sumária de fato que configure, em tese, crime militar e de sua autoria, possuindo caráter de instrução provisória voltada à obtenção de elementos para a propositura da ação penal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Essa é a finalidade legal do IPM: apurar sumariamente o fato e a autoria e fornecer elementos necessários à propositura da ação penal.","referencia":"CPPM, art. 9º.","tags":["IPM","finalidade","instrução provisória"]},{"id":"DPPM008","area":"Noções de Direito Processual Penal Militar","tema":"Inquérito policial militar","subtema":"Formas de instauração","dificuldade":"intermediaria","enunciado":"O IPM somente pode ser iniciado de ofício pela autoridade militar competente, sendo juridicamente inadmissível sua instauração por requisição do Ministério Público ou a requerimento do ofendido.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM prevê diversas formas de início do IPM, entre elas a instauração de ofício, por determinação ou delegação de autoridade superior, por requisição do Ministério Público e a requerimento da parte ofendida ou de seu representante legal, além de outras hipóteses legais.","referencia":"CPPM, art. 10.","tags":["instauração","requisição do Ministério Público","ofendido"]},{"id":"DPPM009","area":"Noções de Direito Processual Penal Militar","tema":"Inquérito policial militar","subtema":"Auto de prisão em flagrante como inquérito","dificuldade":"dificil","enunciado":"Se o auto de prisão em flagrante for, por si só, suficiente para esclarecer o fato e a autoria, ele poderá constituir o próprio inquérito, sem prejuízo das diligências que o CPPM expressamente preserva, como o exame de corpo de delito quando o crime deixar vestígios.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM admite que o auto de flagrante constitua o inquérito quando suficiente à elucidação do fato e da autoria, sem dispensar diligências legalmente indispensáveis, como o exame de corpo de delito quando houver vestígios, a identificação da coisa e sua avaliação quando pertinentes.","referencia":"CPPM, art. 27.","tags":["flagrante","dispensa de diligências","corpo de delito"]},{"id":"DPPM010","area":"Noções de Direito Processual Penal Militar","tema":"Ação penal militar e seu exercício","subtema":"Natureza e titularidade","dificuldade":"facil","enunciado":"Segundo o CPPM, a ação penal militar é pública e é promovida mediante denúncia do Ministério Público competente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM estabelece a natureza pública da ação penal militar e prevê sua promoção por denúncia do Ministério Público.","referencia":"CPPM, art. 29.","tags":["ação penal pública","Ministério Público","denúncia"]},{"id":"DPPM011","area":"Noções de Direito Processual Penal Militar","tema":"Ação penal militar e seu exercício","subtema":"Pressupostos para a denúncia","dificuldade":"intermediaria","enunciado":"A denúncia militar somente pode ser apresentada quando houver prova definitiva da autoria e confissão do investigado, não bastando indícios de autoria.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM exige prova de fato que, em tese, constitua crime e indícios de autoria. Não exige confissão nem prova definitiva da autoria para o oferecimento da denúncia.","referencia":"CPPM, art. 30.","tags":["denúncia","indícios de autoria","ação penal militar"]},{"id":"DPPM012","area":"Noções de Direito Processual Penal Militar","tema":"Ação penal militar e seu exercício","subtema":"Indisponibilidade da ação penal","dificuldade":"dificil","enunciado":"Apresentada a denúncia, o Ministério Público pode desistir livremente da ação penal militar antes da sentença, desde que conclua que as provas se tornaram insuficientes.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM veda expressamente a desistência da ação penal militar depois de apresentada a denúncia.","referencia":"CPPM, art. 32.","tags":["indisponibilidade","desistência","ação penal militar"]},{"id":"DPPM013","area":"Noções de Direito Processual Penal Militar","tema":"Prisão em flagrante","subtema":"Legitimidade para efetuar a prisão","dificuldade":"facil","enunciado":"Qualquer pessoa poderá, e os militares deverão, prender quem for insubmisso ou desertor ou quem seja encontrado em flagrante delito.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM estabelece faculdade para qualquer pessoa e dever para os militares nas hipóteses indicadas.","referencia":"CPPM, art. 243.","tags":["prisão em flagrante","desertor","insubmisso"]},{"id":"DPPM014","area":"Noções de Direito Processual Penal Militar","tema":"Prisão em flagrante","subtema":"Ausência de testemunhas do fato","dificuldade":"intermediaria","enunciado":"A falta de testemunhas do fato impede a lavratura do auto de prisão em flagrante militar, devendo o preso ser imediatamente liberado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A falta de testemunhas do fato não impede a lavratura do auto. Nessa hipótese, o auto será assinado por pelo menos duas pessoas que tenham testemunhado a apresentação do preso.","referencia":"CPPM, art. 245, § 2º.","tags":["auto de flagrante","testemunhas","lavratura"]},{"id":"DPPM015","area":"Noções de Direito Processual Penal Militar","tema":"Prisão em flagrante","subtema":"Crime permanente","dificuldade":"dificil","enunciado":"Nas infrações permanentes, o agente é considerado em flagrante delito enquanto não cessar a permanência.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM prolonga a situação de flagrância nos crimes permanentes durante todo o período em que subsistir a permanência.","referencia":"CPPM, art. 244, parágrafo único.","tags":["crime permanente","flagrante","permanência"]},{"id":"DPPM016","area":"Noções de Direito Processual Penal Militar","tema":"Prisão preventiva","subtema":"Requisitos e fundamentos","dificuldade":"facil","enunciado":"A prisão preventiva no CPPM pressupõe prova do fato delituoso e indícios suficientes de autoria, além de fundamento enquadrável em uma das hipóteses legais do art. 255.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O art. 254 traz os pressupostos probatórios, e o art. 255 exige que a medida se funde em pelo menos uma das hipóteses cautelares ali previstas.","referencia":"CPPM, arts. 254 e 255.","tags":["prisão preventiva","requisitos","fundamentos"]},{"id":"DPPM017","area":"Noções de Direito Processual Penal Militar","tema":"Prisão preventiva","subtema":"Hierarquia e disciplina como fundamento","dificuldade":"intermediaria","enunciado":"A ameaça às normas ou aos princípios de hierarquia e disciplina militares jamais pode fundamentar prisão preventiva, pois o CPPM limita a medida exclusivamente à garantia da ordem pública e à conveniência da instrução criminal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM prevê expressamente, entre os fundamentos da prisão preventiva, a exigência de manutenção das normas ou princípios de hierarquia e disciplina militares quando ameaçados ou atingidos pela liberdade do indiciado ou acusado.","referencia":"CPPM, art. 255, alínea e.","tags":["hierarquia","disciplina","prisão preventiva"]},{"id":"DPPM018","area":"Noções de Direito Processual Penal Militar","tema":"Prisão preventiva","subtema":"Revogação e nova decretação","dificuldade":"dificil","enunciado":"No curso do processo, a prisão preventiva pode ser revogada se desaparecerem os motivos que a sustentavam e pode ser novamente decretada se sobrevierem razões que a justifiquem.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A prisão preventiva é medida cautelar sujeita à alteração das circunstâncias: o CPPM autoriza sua revogação e posterior nova decretação quando houver mudança dos pressupostos fáticos.","referencia":"CPPM, art. 259.","tags":["revogação","nova decretação","cautelar"]},{"id":"DPPM019","area":"Noções de Direito Processual Penal Militar","tema":"Menagem","subtema":"Requisitos para concessão","dificuldade":"facil","enunciado":"A menagem poderá ser concedida pelo juiz nos crimes cujo máximo da pena privativa de liberdade não exceda a quatro anos, devendo ser consideradas a natureza do crime e os antecedentes do acusado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM fixa o limite máximo de pena e determina a consideração da natureza do crime e dos antecedentes do acusado.","referencia":"CPPM, art. 263.","tags":["menagem","pena máxima","antecedentes"]},{"id":"DPPM020","area":"Noções de Direito Processual Penal Militar","tema":"Menagem","subtema":"Reincidência","dificuldade":"intermediaria","enunciado":"A reincidência não interfere na concessão de menagem, podendo o reincidente receber o benefício sempre que a pena máxima do crime não ultrapassar quatro anos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM é expresso ao vedar a concessão de menagem ao reincidente. Portanto, o simples atendimento ao limite da pena não basta.","referencia":"CPPM, art. 269.","tags":["menagem","reincidência","vedação"]},{"id":"DPPM021","area":"Noções de Direito Processual Penal Militar","tema":"Liberdade provisória","subtema":"Infração sem pena privativa de liberdade","dificuldade":"facil","enunciado":"O indiciado ou acusado livrar-se-á solto quando se tratar de infração à qual não seja cominada pena privativa de liberdade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Essa hipótese está expressamente prevista no CPPM como caso em que o indiciado ou acusado deve responder solto.","referencia":"CPPM, art. 270, caput.","tags":["liberdade provisória","pena privativa de liberdade","responder solto"]},{"id":"DPPM022","area":"Noções de Direito Processual Penal Militar","tema":"Liberdade provisória","subtema":"Suspensão da liberdade provisória","dificuldade":"intermediaria","enunciado":"Uma vez concedida a liberdade provisória, ela não poderá ser suspensa em razão de circunstância superveniente ligada aos fundamentos da prisão preventiva.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A superveniência de qualquer dos motivos previstos no art. 255 do CPPM pode determinar a suspensão da liberdade provisória, por despacho da autoridade que a concedeu, de ofício ou a requerimento do Ministério Público.","referencia":"CPPM, art. 271.","tags":["liberdade provisória","suspensão","art. 255"]},{"id":"DPPM023","area":"Noções de Direito Processual Penal Militar","tema":"Liberdade provisória","subtema":"Hipóteses facultativas e exceções","dificuldade":"intermediaria","enunciado":"O CPPM admite, em determinadas hipóteses, que o indiciado ou acusado se livre solto em infração culposa ou em infração punida com detenção não superior a dois anos, ressalvadas as exceções expressamente previstas no próprio Código.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O parágrafo único do art. 270 prevê essas hipóteses, de caráter facultativo, mas também estabelece exceções específicas que impedem tratar a liberdade como automática em todo crime culposo ou em toda infração com detenção de até dois anos.","referencia":"CPPM, art. 270, parágrafo único, alíneas a e b.","tags":["crime culposo","detenção","exceções"]},{"id":"DPPM024","area":"Noções de Direito Processual Penal Militar","tema":"Aplicação provisória de medidas de segurança","subtema":"Momento de aplicação","dificuldade":"intermediaria","enunciado":"A aplicação provisória de medida de segurança somente pode ocorrer após o recebimento da denúncia, sendo vedada durante o inquérito policial militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O CPPM admite a aplicação provisória de medidas de segurança já no curso do inquérito, mediante representação do encarregado, e também no curso do processo, observados os requisitos legais.","referencia":"CPPM, art. 272, caput.","tags":["medida de segurança","IPM","aplicação provisória"]},{"id":"DPPM025","area":"Noções de Direito Processual Penal Militar","tema":"Aplicação provisória de medidas de segurança","subtema":"Interdição provisória de estabelecimento","dificuldade":"dificil","enunciado":"No caso previsto no art. 118 do Código Penal Militar, o juiz pode decretar, de forma fundamentada, a interdição provisória de estabelecimento industrial ou comercial, sociedade ou associação por período não superior a cinco dias, para viabilizar busca, apreensão ou outra diligência permitida pelo CPPM destinada à elucidação do fato.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM permite, no caso do art. 118 do Código Penal Militar, a interdição provisória pelo prazo máximo de cinco dias para a realização de diligência legalmente permitida, exigindo fundamentação da decisão.","referencia":"CPPM, art. 272, §§ 1º e 2º; CPM, art. 118.","tags":["interdição","fundamentação","medida de segurança"]},{"id":"DPPM026","area":"Noções de Direito Processual Penal Militar","tema":"Processos especiais: visão geral","subtema":"Abrangência dos processos especiais","dificuldade":"facil","enunciado":"No CPPM, o título destinado aos processos especiais contém exclusivamente os procedimentos de deserção e de insubmissão, inexistindo outros processos especiais disciplinados nesse mesmo título.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O Título II do Livro II do CPPM não se limita à deserção e à insubmissão; ele também disciplina outros procedimentos especiais, como habeas corpus, restauração de autos e processo de competência originária do Superior Tribunal Militar.","referencia":"CPPM, Livro II, Título II.","tags":["processos especiais","abrangência","CPPM"]},{"id":"DPPM027","area":"Noções de Direito Processual Penal Militar","tema":"Processos especiais: visão geral","subtema":"Ritos próprios","dificuldade":"intermediaria","enunciado":"Deserção e insubmissão possuem disciplina procedimental própria no CPPM, com atos específicos de formação da instrução provisória e de encaminhamento à Justiça Militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM estabelece ritos específicos para deserção e insubmissão, inclusive com termos próprios que funcionam como instrução provisória e fornecem elementos para a persecução penal.","referencia":"CPPM, arts. 451 a 465.","tags":["rito especial","deserção","insubmissão"]},{"id":"DPPM028","area":"Noções de Direito Processual Penal Militar","tema":"Processos especiais: visão geral","subtema":"Instrução provisória e denúncia","dificuldade":"dificil","enunciado":"Nos processos especiais de deserção e de insubmissão, o termo lavrado pela autoridade militar equivale a sentença de pronúncia e torna desnecessária a atuação do Ministério Público por meio de denúncia.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Os termos de deserção e de insubmissão têm caráter de instrução provisória e servem para fornecer elementos à propositura da ação penal. Eles não equivalem a sentença e não eliminam a atuação do Ministério Público nem a necessidade de denúncia quando cabível.","referencia":"CPPM, art. 452; art. 463, § 1º; arts. 454, § 3º, e 464, § 2º.","tags":["instrução provisória","denúncia","processo especial"]},{"id":"DPPM029","area":"Noções de Direito Processual Penal Militar","tema":"Processo especial de deserção de praça e praça especial","subtema":"Exclusão e agregação","dificuldade":"intermediaria","enunciado":"Consumada a deserção de praça especial ou de praça sem estabilidade, ela será imediatamente excluída do serviço ativo; se a praça for estável, será agregada.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM distingue as consequências administrativas imediatas conforme a situação da praça: exclusão para praça especial ou sem estabilidade e agregação para praça estável.","referencia":"CPPM, art. 456, § 4º.","tags":["deserção","praça sem estabilidade","agregação"]},{"id":"DPPM030","area":"Noções de Direito Processual Penal Militar","tema":"Processo especial de deserção de praça e praça especial","subtema":"Efeitos do termo de deserção","dificuldade":"intermediaria","enunciado":"O termo de deserção constitui mera comunicação administrativa e não produz qualquer efeito processual nem sujeita o desertor à prisão.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O termo de deserção tem caráter de instrução provisória, destina-se a fornecer elementos necessários à propositura da ação penal e sujeita, desde logo, o desertor à prisão.","referencia":"CPPM, art. 452.","tags":["termo de deserção","instrução provisória","prisão"]},{"id":"DPPM031","area":"Noções de Direito Processual Penal Militar","tema":"Processo especial de deserção de praça e praça especial","subtema":"Liberdade por excesso de prazo","dificuldade":"intermediaria","enunciado":"O desertor que não for julgado dentro de sessenta dias contados de sua apresentação voluntária ou captura será posto em liberdade, salvo se tiver dado causa ao retardamento do processo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O CPPM fixa esse marco de sessenta dias, contado da apresentação voluntária ou captura, ressalvando a hipótese de o próprio desertor ter dado causa ao retardamento do processo.","referencia":"CPPM, art. 453.","tags":["deserção","prazo","liberdade"]},{"id":"DPPM032","area":"Noções de Direito Processual Penal Militar","tema":"Processo especial de insubmissão","subtema":"Efeitos do termo de insubmissão","dificuldade":"intermediaria","enunciado":"O termo de insubmissão possui caráter meramente informativo e não autoriza a captura do insubmisso para efeito de incorporação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O termo de insubmissão, acompanhado dos documentos pertinentes, tem caráter de instrução provisória e é o instrumento legal autorizador da captura do insubmisso para efeito de incorporação.","referencia":"CPPM, art. 463, § 1º.","tags":["insubmissão","captura","incorporação"]},{"id":"DPPM033","area":"Noções de Direito Processual Penal Militar","tema":"Processo especial de insubmissão","subtema":"Menagem e inspeção de saúde","dificuldade":"intermediaria","enunciado":"O insubmisso que se apresentar ou for capturado terá direito ao quartel por menagem e será submetido a inspeção de saúde; se for considerado incapaz, ficará isento do processo e da inclusão.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Essa disciplina consta expressamente do CPPM para o procedimento de insubmissão.","referencia":"CPPM, art. 464, caput.","tags":["insubmissão","menagem","inspeção de saúde"]},{"id":"DPPM034","area":"Noções de Direito Processual Penal Militar","tema":"Processo especial de insubmissão","subtema":"Autuação e atuação do Ministério Público","dificuldade":"dificil","enunciado":"Recebido o termo de insubmissão, o juiz deve proferir imediatamente decisão de mérito, sem autuação do feito, sem vista ao Ministério Público e independentemente da captura ou apresentação voluntária do insubmisso.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Recebidos o termo e os documentos, o feito é autuado e há vista ao Ministério Público para requerer o que for de direito; o procedimento também considera a captura ou apresentação voluntária do insubmisso e, posteriormente, sua inclusão quando cabível.","referencia":"CPPM, art. 463, § 3º, e art. 464.","tags":["autuação","Ministério Público","insubmisso"]},{"id":"DPPM035","area":"Noções de Direito Processual Penal Militar","tema":"Conselho Permanente de Justiça","subtema":"Conselhos de Justiça na Justiça Militar Estadual de Alagoas","dificuldade":"facil","enunciado":"Na Justiça Militar Estadual de Alagoas, os Conselhos de Justiça Militar são órgãos judiciários de primeira instância, têm jurisdição em todo o território estadual e são presididos pelo Juiz de Direito-Auditor Militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O Código de Organização Judiciária de Alagoas qualifica os Conselhos de Justiça Militar como órgãos de primeira instância da Justiça Militar Estadual, com jurisdição em todo o Estado, e prevê sua presidência pelo Juiz de Direito-Auditor Militar. A Constituição Federal também estabelece que os Conselhos de Justiça da Justiça Militar Estadual são presididos pelo juiz de direito.","referencia":"CF/1988, art. 125, § 5º; Lei Estadual de Alagoas nº 6.564/2005, art. 91, caput e § 3º.","tags":["Alagoas","Conselho de Justiça","Auditoria Militar"]},{"id":"DPPM036","area":"Noções de Direito Processual Penal Militar","tema":"Conselho Permanente de Justiça","subtema":"Crime militar cometido contra civil","dificuldade":"intermediaria","enunciado":"Na Justiça Militar Estadual, se uma praça for acusada de crime militar cometido contra civil, o julgamento caberá necessariamente ao Conselho Permanente de Justiça, porque a condição de praça afasta a competência singular do juiz de direito.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A Constituição Federal atribui ao juiz de direito do juízo militar a competência singular para processar e julgar os crimes militares cometidos contra civis. Portanto, a condição de praça do acusado, por si só, não desloca o julgamento para o Conselho Permanente nessa hipótese.","referencia":"CF/1988, art. 125, § 5º.","tags":["Conselho Permanente","crime contra civil","competência singular"]},{"id":"DPPM037","area":"Noções de Direito Processual Penal Militar","tema":"Conselho Permanente de Justiça","subtema":"Duração de funcionamento","dificuldade":"intermediaria","enunciado":"Segundo as regras de organização judiciária militar aplicáveis à composição dos Conselhos, o Conselho Permanente de Justiça funciona durante três meses consecutivos, coincidentes com os trimestres do ano civil, admitida a prorrogação de sua jurisdição nos casos previstos em lei.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A Lei de Organização da Justiça Militar da União estabelece duração trimestral para o Conselho Permanente e admite prorrogação nos casos legais. Em Alagoas, o Código de Organização Judiciária remete a composição, organização e competência dos Conselhos às normas processuais e de organização judiciária militar pertinentes.","referencia":"Lei nº 8.457/1992, art. 24; Lei Estadual de Alagoas nº 6.564/2005, art. 91, § 2º.","tags":["Conselho Permanente","trimestre","duração"]},{"id":"DPPM038","area":"Noções de Direito Processual Penal Militar","tema":"Conselho Especial de Justiça","subtema":"Constituição por processo","dificuldade":"intermediaria","enunciado":"O Conselho Especial de Justiça é constituído para funcionar durante todo um trimestre civil e recebe, sucessivamente, todos os processos de oficiais distribuídos nesse período.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O Conselho Especial de Justiça é constituído para cada processo e se dissolve após a conclusão de seus trabalhos, ressalvadas as hipóteses legais de nova reunião. A duração trimestral é característica do Conselho Permanente, não do Conselho Especial.","referencia":"Lei nº 8.457/1992, art. 23, § 1º, e art. 24; Lei Estadual de Alagoas nº 6.564/2005, art. 91, § 2º.","tags":["Conselho Especial","constituição","processo"]},{"id":"DPPM039","area":"Noções de Direito Processual Penal Militar","tema":"Conselho Especial de Justiça","subtema":"Posto dos juízes militares","dificuldade":"intermediaria","enunciado":"No Conselho Especial de Justiça, os juízes militares devem ser de posto superior ao do acusado ou, se do mesmo posto, de maior antiguidade; havendo pluralidade de acusados, toma-se como referência o acusado de maior posto.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A Lei de Organização da Justiça Militar estabelece esses critérios de hierarquia e antiguidade para a composição do Conselho Especial, tomando como referência, em caso de vários acusados, o de maior posto.","referencia":"Lei nº 8.457/1992, art. 23, caput e § 2º; Lei Estadual de Alagoas nº 6.564/2005, art. 91, § 2º.","tags":["Conselho Especial","hierarquia","antiguidade"]},{"id":"DPPM040","area":"Noções de Direito Processual Penal Militar","tema":"Conselho Especial de Justiça","subtema":"Acusação conjunta de oficial e praça","dificuldade":"dificil","enunciado":"Em processo sujeito ao julgamento por Conselho de Justiça, se a acusação abranger simultaneamente um oficial e uma praça, cada acusado deverá ser processado por conselho diverso: o oficial perante o Conselho Especial e a praça perante o Conselho Permanente, ainda que respondam pelo mesmo fato.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Segundo a Lei de Organização da Justiça Militar, se a acusação abranger oficial e praça, todos responderão perante o mesmo Conselho Especial, ainda que o oficial venha posteriormente a ser excluído do processo. A ressalva inicial do enunciado evita confundir essa regra com as hipóteses em que a Constituição atribui julgamento singular ao juiz de direito na Justiça Militar Estadual.","referencia":"Lei nº 8.457/1992, art. 23, § 3º; CF/1988, art. 125, § 5º; Lei Estadual de Alagoas nº 6.564/2005, art. 91, § 2º.","tags":["Conselho Especial","oficial e praça","competência"]}],"direitos_humanos":[{"id":"DHU001","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Fundamento na dignidade e condição humana","dificuldade":"facil","enunciado":"Os direitos humanos são reconhecidos à pessoa em razão de sua condição humana, não dependendo, como regra, da nacionalidade do indivíduo para que sejam afirmados no plano internacional.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A concepção contemporânea dos direitos humanos parte da dignidade inerente à pessoa humana. A própria Convenção Americana reconhece, em seu preâmbulo, que os direitos essenciais do ser humano não derivam do fato de ser ele nacional de determinado Estado e, no art. 1º, determina a proteção de toda pessoa sujeita à jurisdição do Estado-Parte.","referencia":"Convenção Americana sobre Direitos Humanos, preâmbulo e art. 1º, itens 1 e 2; Decreto nº 678/1992.","tags":["conceito","dignidade humana","universalidade"]},{"id":"DHU002","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Direitos humanos e direitos fundamentais","dificuldade":"facil","enunciado":"As expressões direitos humanos e direitos fundamentais são rigorosamente sinônimas, pois ambas designam exclusivamente os direitos previstos na Constituição de determinado Estado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. Embora as expressões sejam relacionadas, direitos humanos costuma designar direitos reconhecidos também no plano internacional, enquanto direitos fundamentais se refere, em sentido técnico usual, aos direitos positivados na ordem constitucional interna. A Constituição brasileira, inclusive, admite direitos decorrentes de tratados internacionais.","referencia":"Constituição Federal de 1988, art. 5º, §§ 2º e 3º; Convenção Americana sobre Direitos Humanos, preâmbulo.","tags":["direitos humanos","direitos fundamentais","distinção"]},{"id":"DHU003","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Universalidade","dificuldade":"intermediaria","enunciado":"A universalidade dos direitos humanos está relacionada à titularidade desses direitos por todos os seres humanos e não significa, por si só, que todo direito seja insuscetível de qualquer limitação juridicamente admitida.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A universalidade traduz a vocação dos direitos humanos para proteger todas as pessoas. Isso não transforma automaticamente todos os direitos em absolutos, pois instrumentos internacionais admitem, para determinados direitos, restrições submetidas a requisitos jurídicos específicos.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5; Convenção Americana sobre Direitos Humanos, arts. 12, 13, 15, 16, 30 e 32.","tags":["universalidade","limitações","características"]},{"id":"DHU004","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Indivisibilidade","dificuldade":"intermediaria","enunciado":"O princípio da indivisibilidade autoriza estabelecer uma hierarquia geral segundo a qual direitos civis e políticos possuem, por natureza, maior valor jurídico que direitos econômicos, sociais e culturais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. A indivisibilidade afasta a ideia de uma hierarquia abstrata que torne determinada categoria de direitos humanos necessariamente superior a outra. A Declaração de Viena afirma que todos os direitos humanos são universais, indivisíveis, interdependentes e inter-relacionados.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5.","tags":["indivisibilidade","direitos sociais","direitos civis"]},{"id":"DHU005","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Interdependência","dificuldade":"intermediaria","enunciado":"A interdependência dos direitos humanos admite que a realização efetiva de determinado direito possa contribuir para o exercício de outros direitos, razão pela qual diferentes categorias de direitos não devem ser analisadas como compartimentos absolutamente isolados.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A interdependência demonstra que direitos distintos podem manter relações de reforço e condicionamento recíproco, razão pela qual sua proteção deve ser compreendida de maneira integrada.","referencia":"Declaração e Programa de Ação de Viena de 1993, itens 5 e 8.","tags":["interdependência","indivisibilidade","características"]},{"id":"DHU006","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Relatividade dos direitos","dificuldade":"intermediaria","enunciado":"Por serem inerentes à pessoa humana, todos os direitos humanos são absolutos, de modo que tratados internacionais não podem estabelecer nenhuma restrição ao seu exercício, ainda que prevista em lei e necessária à proteção dos direitos de terceiros.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. A proteção dos direitos humanos não implica caráter absoluto de todos os direitos. A Convenção Americana admite limitações em hipóteses específicas, desde que respeitados os requisitos previstos no próprio tratado.","referencia":"Convenção Americana sobre Direitos Humanos, arts. 12, 13, 15, 16, 30 e 32; Decreto nº 678/1992.","tags":["relatividade","restrições","direitos humanos"]},{"id":"DHU007","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Proteção internacional e constitucional","dificuldade":"dificil","enunciado":"Um mesmo bem jurídico pode ser objeto de proteção internacional como direito humano e, simultaneamente, integrar o sistema interno de direitos fundamentais, não havendo incompatibilidade necessária entre essas duas formas de tutela.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A distinção entre direitos humanos e direitos fundamentais está ligada principalmente ao plano normativo em que são reconhecidos. Vida, liberdade, igualdade e garantias processuais, por exemplo, podem receber proteção simultaneamente em tratados internacionais e na Constituição.","referencia":"Constituição Federal de 1988, art. 5º; Convenção Americana sobre Direitos Humanos, Parte I.","tags":["proteção multinível","direitos fundamentais","tratados"]},{"id":"DHU008","area":"Noções de Direitos Humanos","tema":"Conceito de direitos humanos","subtema":"Reconhecimento internacional","dificuldade":"dificil","enunciado":"No plano internacional, somente se considera direito humano aquele que já tenha sido previamente incorporado ao texto constitucional de todos os Estados integrantes da comunidade internacional.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. O reconhecimento internacional de direitos humanos não depende de prévia inserção uniforme nas constituições de todos os Estados. Instrumentos internacionais podem estabelecer padrões de proteção independentemente de identidade normativa absoluta entre os ordenamentos internos.","referencia":"Declaração Universal dos Direitos Humanos; Carta das Nações Unidas; Convenção Americana sobre Direitos Humanos.","tags":["internacionalização","constituição","direitos humanos"]},{"id":"DHU009","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Declaração Universal de 1948","dificuldade":"facil","enunciado":"A Declaração Universal dos Direitos Humanos foi adotada pela Assembleia Geral das Nações Unidas em 10 de dezembro de 1948, no contexto histórico posterior à Segunda Guerra Mundial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A Declaração Universal foi adotada pela Assembleia Geral da ONU em 10 de dezembro de 1948, por meio da Resolução 217 A (III), constituindo marco central da internacionalização contemporânea dos direitos humanos.","referencia":"Declaração Universal dos Direitos Humanos, Resolução 217 A (III) da Assembleia Geral da ONU, de 10 de dezembro de 1948.","tags":["DUDH","1948","evolução histórica"]},{"id":"DHU010","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Natureza da Declaração Universal","dificuldade":"facil","enunciado":"A Declaração Universal dos Direitos Humanos é um tratado internacional multilateral celebrado em 1948 e sua vigência para cada Estado depende de ratificação individual.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. A Declaração Universal foi adotada pela Assembleia Geral da ONU mediante resolução e não possui a natureza formal de tratado multilateral sujeito a ratificação individual, ao contrário de tratados posteriores, como os Pactos Internacionais de 1966.","referencia":"Declaração Universal dos Direitos Humanos, Resolução 217 A (III) da Assembleia Geral da ONU; Pactos Internacionais de 1966.","tags":["DUDH","tratados","natureza jurídica"]},{"id":"DHU011","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Pactos Internacionais de 1966","dificuldade":"intermediaria","enunciado":"Após a Declaração Universal de 1948, foram adotados em 1966 o Pacto Internacional sobre Direitos Civis e Políticos e o Pacto Internacional sobre Direitos Econômicos, Sociais e Culturais, aprofundando a proteção convencional no âmbito das Nações Unidas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. Ambos os Pactos foram adotados pela Assembleia Geral da ONU em 16 de dezembro de 1966 e transformaram em obrigações convencionais diversas matérias contempladas no processo internacional de proteção dos direitos humanos.","referencia":"Pacto Internacional sobre Direitos Civis e Políticos, Resolução 2200 A (XXI); Pacto Internacional sobre Direitos Econômicos, Sociais e Culturais, Resolução 2200 A (XXI), ambos de 1966.","tags":["Pactos de 1966","ONU","internacionalização"]},{"id":"DHU012","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Dimensões dos direitos humanos","dificuldade":"intermediaria","enunciado":"Na classificação doutrinária por dimensões, os direitos de primeira dimensão são identificados predominantemente com prestações sociais e econômicas exigidas do Estado, enquanto as liberdades civis e políticas integram a segunda dimensão.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada porque inverte a classificação tradicional. A primeira dimensão é associada principalmente aos direitos civis e políticos e às liberdades, enquanto a segunda dimensão é relacionada especialmente aos direitos econômicos, sociais e culturais.","referencia":"Classificação doutrinária tradicional das dimensões dos direitos humanos; Declaração Universal dos Direitos Humanos; Pactos Internacionais de 1966.","tags":["dimensões","primeira dimensão","segunda dimensão"]},{"id":"DHU013","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Cumulatividade das dimensões","dificuldade":"intermediaria","enunciado":"A classificação dos direitos humanos em dimensões possui caráter predominantemente didático e não significa que o surgimento histórico de novos grupos de direitos elimine ou substitua os direitos anteriormente reconhecidos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. As dimensões representam processo de expansão e acumulação da proteção e não etapas de substituição. Essa leitura é compatível com a indivisibilidade e a interdependência reconhecidas no direito internacional dos direitos humanos.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5; classificação doutrinária das dimensões dos direitos humanos.","tags":["dimensões","cumulatividade","indivisibilidade"]},{"id":"DHU014","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Direitos de terceira dimensão","dificuldade":"intermediaria","enunciado":"Os denominados direitos de terceira dimensão caracterizam-se exclusivamente pela tutela patrimonial individual e não se relacionam com bens de natureza coletiva ou difusa.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. Na classificação doutrinária tradicional, a terceira dimensão é associada à solidariedade ou fraternidade e a interesses de projeção coletiva ou difusa, frequentemente relacionados a temas como desenvolvimento, paz e meio ambiente.","referencia":"Classificação doutrinária tradicional das dimensões dos direitos humanos; Declaração sobre o Direito ao Desenvolvimento, Resolução 41/128 da Assembleia Geral da ONU.","tags":["terceira dimensão","solidariedade","direitos coletivos"]},{"id":"DHU015","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Internacionalização da proteção","dificuldade":"dificil","enunciado":"A consolidação de mecanismos internacionais de proteção dos direitos humanos após a Segunda Guerra Mundial ampliou a tutela para além do plano exclusivamente doméstico, sem eliminar a responsabilidade dos Estados de promover e proteger esses direitos internamente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A internacionalização acrescentou mecanismos supranacionais e internacionais de proteção, sem retirar dos Estados sua responsabilidade primária de respeitar, proteger e promover os direitos humanos em suas ordens internas.","referencia":"Carta das Nações Unidas, arts. 1º, item 3, e 55; Declaração e Programa de Ação de Viena de 1993.","tags":["internacionalização","Estado","pós-guerra"]},{"id":"DHU016","area":"Noções de Direitos Humanos","tema":"Evolução dos direitos humanos","subtema":"Cronologia dos instrumentos internacionais","dificuldade":"dificil","enunciado":"A Convenção Americana sobre Direitos Humanos, adotada em 1969, antecedeu historicamente a Declaração Universal dos Direitos Humanos e serviu de fundamento para a aprovação desta em 1948.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. A Declaração Universal foi adotada em 1948, ao passo que a Convenção Americana foi adotada em San José, Costa Rica, em 22 de novembro de 1969. A ordem cronológica apresentada está invertida.","referencia":"Declaração Universal dos Direitos Humanos, 1948; Convenção Americana sobre Direitos Humanos, 1969; Decreto nº 678/1992.","tags":["cronologia","DUDH","Convenção Americana"]},{"id":"DHU017","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Âmbito pessoal de proteção","dificuldade":"facil","enunciado":"Segundo a Convenção Americana sobre Direitos Humanos, os Estados-Partes devem respeitar e garantir os direitos nela reconhecidos a toda pessoa sujeita à sua jurisdição, sem limitar essa proteção exclusivamente aos seus nacionais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. O art. 1º da Convenção utiliza como critério a sujeição da pessoa à jurisdição do Estado-Parte e não sua nacionalidade, além de proibir discriminações pelos motivos nele indicados.","referencia":"Convenção Americana sobre Direitos Humanos, art. 1º, itens 1 e 2; Decreto nº 678/1992.","tags":["jurisdição","não discriminação","universalidade"]},{"id":"DHU018","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Categorias de direitos","dificuldade":"facil","enunciado":"O conceito contemporâneo de direitos humanos abrange exclusivamente direitos civis e políticos, ficando os direitos econômicos, sociais e culturais fora do campo de proteção dos direitos humanos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. Direitos civis, políticos, econômicos, sociais e culturais integram o campo dos direitos humanos. A Declaração de Viena reafirma sua universalidade, indivisibilidade, interdependência e inter-relação.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5; Pacto Internacional sobre Direitos Econômicos, Sociais e Culturais.","tags":["abrangência","direitos sociais","indivisibilidade"]},{"id":"DHU019","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Universalidade e indivisibilidade","dificuldade":"intermediaria","enunciado":"A Declaração e o Programa de Ação de Viena afirmam que todos os direitos humanos são universais, indivisíveis, interdependentes e inter-relacionados.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. Essa formulação consta expressamente do item 5 da Declaração e Programa de Ação de Viena de 1993.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5.","tags":["Viena","universalidade","interdependência"]},{"id":"DHU020","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Particularidades culturais e obrigações estatais","dificuldade":"intermediaria","enunciado":"De acordo com a Declaração de Viena, particularidades históricas, culturais ou religiosas autorizam o Estado a afastar unilateralmente obrigações internacionais de direitos humanos sempre que considerar que determinado direito é incompatível com suas tradições.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. A Declaração de Viena determina que particularidades nacionais e regionais e diferentes contextos históricos, culturais e religiosos sejam considerados, mas reafirma que todos os Estados têm o dever de promover e proteger os direitos humanos, independentemente de seus sistemas políticos, econômicos e culturais.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5.","tags":["universalidade","cultura","obrigações estatais"]},{"id":"DHU021","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Atuação policial e não discriminação","dificuldade":"intermediaria","enunciado":"O dever estatal de respeitar e garantir direitos humanos alcança a atuação de agentes públicos, inclusive policiais, os quais devem exercer suas atribuições sem discriminações incompatíveis com as obrigações internacionais assumidas pelo Estado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. As obrigações internacionais de direitos humanos vinculam a atuação do Estado e de seus agentes. A Convenção Americana determina o respeito e a garantia dos direitos nela reconhecidos a toda pessoa sujeita à jurisdição estatal, sem discriminação nos termos do art. 1º.","referencia":"Convenção Americana sobre Direitos Humanos, art. 1º, item 1; Decreto nº 678/1992.","tags":["atividade policial","não discriminação","Estado"]},{"id":"DHU022","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Universalidade e exercício dos direitos","dificuldade":"intermediaria","enunciado":"O caráter universal dos direitos humanos determina que todos eles sejam exercidos de forma absolutamente idêntica em qualquer circunstância, vedando que os próprios tratados estabeleçam condições ou restrições específicas para determinados direitos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. Universalidade não significa identidade absoluta de regime jurídico. Os próprios tratados podem estabelecer condições e restrições para certos direitos, desde que observados os requisitos convencionais aplicáveis.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5; Convenção Americana sobre Direitos Humanos, arts. 13, 30 e 32.","tags":["universalidade","restrições","tratados"]},{"id":"DHU023","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Indivisibilidade e formas de implementação","dificuldade":"dificil","enunciado":"A indivisibilidade dos direitos humanos impede que os direitos econômicos, sociais e culturais sejam considerados uma categoria de direitos humanos intrinsecamente inferior aos direitos civis e políticos, embora os instrumentos internacionais possam estabelecer formas distintas de implementação para determinados direitos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A indivisibilidade afasta hierarquia abstrata entre categorias de direitos. Isso não impede que instrumentos convencionais estabeleçam regimes específicos de implementação, como a referência ao desenvolvimento progressivo presente no art. 26 da Convenção Americana.","referencia":"Declaração e Programa de Ação de Viena de 1993, item 5; Convenção Americana sobre Direitos Humanos, art. 26.","tags":["indivisibilidade","direitos econômicos","progressividade"]},{"id":"DHU024","area":"Noções de Direitos Humanos","tema":"Abrangência dos direitos humanos","subtema":"Conceito de pessoa na Convenção Americana","dificuldade":"dificil","enunciado":"Para os efeitos da Convenção Americana sobre Direitos Humanos, a expressão pessoa designa apenas os nacionais dos Estados-Partes, de forma que estrangeiros submetidos à jurisdição desses Estados estão fora da proteção prevista no tratado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. O art. 1º, item 2, estabelece expressamente que, para os efeitos da Convenção, pessoa é todo ser humano. O item 1 exige ainda que os direitos sejam respeitados e garantidos a toda pessoa sujeita à jurisdição do Estado-Parte.","referencia":"Convenção Americana sobre Direitos Humanos, art. 1º, itens 1 e 2; Decreto nº 678/1992.","tags":["pessoa","estrangeiros","Convenção Americana"]},{"id":"DHU025","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Sistemas global e regional","dificuldade":"facil","enunciado":"O sistema global de proteção dos direitos humanos desenvolvido no âmbito das Nações Unidas pode coexistir com sistemas regionais, como o Sistema Interamericano de Direitos Humanos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. A proteção internacional dos direitos humanos opera por mecanismos globais e regionais que coexistem. Nas Américas, o sistema regional desenvolveu-se no âmbito da Organização dos Estados Americanos.","referencia":"Carta das Nações Unidas; Carta da Organização dos Estados Americanos; Convenção Americana sobre Direitos Humanos.","tags":["sistema global","sistema regional","OEA"]},{"id":"DHU026","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Comissão e Corte Interamericanas","dificuldade":"facil","enunciado":"A Comissão Interamericana de Direitos Humanos e a Corte Interamericana de Direitos Humanos constituem um único órgão, possuindo composição, competência e procedimento idênticos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. Comissão e Corte são órgãos distintos do Sistema Interamericano, com composição, competências e procedimentos próprios. A Convenção Americana disciplina separadamente ambos os órgãos.","referencia":"Convenção Americana sobre Direitos Humanos, arts. 33 a 73; Decreto nº 678/1992.","tags":["Comissão Interamericana","Corte Interamericana","órgãos"]},{"id":"DHU027","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Órgãos competentes da Convenção Americana","dificuldade":"intermediaria","enunciado":"A Convenção Americana identifica a Comissão Interamericana de Direitos Humanos e a Corte Interamericana de Direitos Humanos como órgãos competentes para conhecer dos assuntos relacionados ao cumprimento dos compromissos assumidos pelos Estados-Partes no tratado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. O art. 33 da Convenção Americana identifica expressamente a Comissão e a Corte como órgãos competentes para conhecer dos assuntos relacionados ao cumprimento dos compromissos assumidos pelos Estados-Partes.","referencia":"Convenção Americana sobre Direitos Humanos, art. 33; Decreto nº 678/1992.","tags":["artigo 33","Comissão","Corte"]},{"id":"DHU028","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Acesso à Corte Interamericana","dificuldade":"intermediaria","enunciado":"A vítima de alegada violação da Convenção Americana possui legitimidade, nos termos do próprio tratado, para apresentar diretamente à Corte Interamericana uma demanda contenciosa contra o Estado responsável, independentemente da Comissão Interamericana.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. Nos termos do art. 61, somente os Estados-Partes e a Comissão têm direito de submeter casos à decisão da Corte. Isso não se confunde com a legitimidade de pessoas e entidades para apresentar petições à Comissão, prevista no art. 44.","referencia":"Convenção Americana sobre Direitos Humanos, arts. 44 e 61; Decreto nº 678/1992.","tags":["Corte Interamericana","legitimidade","petição individual"]},{"id":"DHU029","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Petições individuais à Comissão","dificuldade":"intermediaria","enunciado":"Qualquer pessoa ou grupo de pessoas, bem como entidade não governamental legalmente reconhecida em um ou mais Estados-Membros da OEA, pode apresentar à Comissão Interamericana petições contendo denúncias ou queixas de violação da Convenção por um Estado-Parte.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. O art. 44 da Convenção prevê essa legitimidade para a apresentação de petições à Comissão e não exige que o peticionário seja necessariamente a própria vítima da alegada violação.","referencia":"Convenção Americana sobre Direitos Humanos, art. 44; Decreto nº 678/1992.","tags":["petição","Comissão Interamericana","artigo 44"]},{"id":"DHU030","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Comunicações interestatais","dificuldade":"intermediaria","enunciado":"A competência da Comissão Interamericana para receber comunicações nas quais um Estado-Parte alegue que outro Estado-Parte violou a Convenção é obrigatória e automática para todos os Estados-Partes desde a adesão ao tratado, independentemente de declaração específica de reconhecimento.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. O art. 45 prevê declaração de reconhecimento da competência da Comissão para comunicações interestatais. Essas comunicações somente podem ser admitidas e examinadas nos termos das declarações previstas no próprio dispositivo.","referencia":"Convenção Americana sobre Direitos Humanos, art. 45; Decreto nº 678/1992.","tags":["comunicação interestatal","Comissão","competência"]},{"id":"DHU031","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Esgotamento dos recursos internos","dificuldade":"dificil","enunciado":"Embora o esgotamento dos recursos da jurisdição interna constitua requisito de admissibilidade previsto na Convenção Americana, o tratado excepciona essa exigência, entre outras hipóteses, quando houver demora injustificada na decisão sobre os recursos internos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. O art. 46 estabelece, como regra, o prévio esgotamento dos recursos internos, mas prevê exceções quando não houver devido processo legal para a proteção do direito, quando o acesso aos recursos tiver sido impedido ou quando houver demora injustificada na decisão sobre eles.","referencia":"Convenção Americana sobre Direitos Humanos, art. 46, itens 1 e 2; Decreto nº 678/1992.","tags":["admissibilidade","recursos internos","exceções"]},{"id":"DHU032","area":"Noções de Direitos Humanos","tema":"Sistema de proteção dos direitos humanos","subtema":"Natureza das decisões da Corte","dificuldade":"dificil","enunciado":"As recomendações formuladas pela Comissão Interamericana em casos individuais possuem, por força do art. 67 da Convenção Americana, a natureza de sentenças definitivas e inapeláveis da Corte Interamericana.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. O art. 67 refere-se à sentença da Corte Interamericana, que é definitiva e inapelável. As recomendações da Comissão não se transformam, por esse dispositivo, em sentenças da Corte.","referencia":"Convenção Americana sobre Direitos Humanos, arts. 50, 51 e 67; Decreto nº 678/1992.","tags":["sentença","Corte Interamericana","Comissão Interamericana"]},{"id":"DHU033","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Promulgação e vigência para o Brasil","dificuldade":"facil","enunciado":"O Decreto nº 678/1992 promulgou a Convenção Americana sobre Direitos Humanos no Brasil e registra que o tratado entrou em vigor para o país em 25 de setembro de 1992.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. O Decreto nº 678/1992 promulgou a Convenção e registra, em seus considerandos, que o Brasil depositou a Carta de Adesão em 25 de setembro de 1992 e que a Convenção entrou em vigor para o país nessa mesma data, conforme o art. 74, item 2, do tratado.","referencia":"Decreto nº 678, de 6 de novembro de 1992, considerandos e art. 1º; Convenção Americana sobre Direitos Humanos, art. 74, item 2.","tags":["Decreto 678/1992","vigência","Brasil"]},{"id":"DHU034","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Declaração interpretativa brasileira","dificuldade":"facil","enunciado":"Ao aderir à Convenção Americana, o Brasil reconheceu à Comissão Interamericana direito automático de realizar visitas e inspeções in loco no território nacional, independentemente de anuência estatal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. Ao depositar a Carta de Adesão, o Brasil formulou declaração interpretativa segundo a qual os arts. 43 e 48, alínea d, não incluem direito automático de visitas e inspeções in loco da Comissão, as quais dependem de anuência expressa do Estado.","referencia":"Decreto nº 678/1992, art. 2º.","tags":["declaração interpretativa","visita in loco","Comissão"]},{"id":"DHU035","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Obrigação de respeitar e garantir","dificuldade":"intermediaria","enunciado":"A Convenção Americana obriga os Estados-Partes a respeitar os direitos e liberdades nela reconhecidos e a garantir seu livre e pleno exercício a toda pessoa sujeita à sua jurisdição, definindo, para seus efeitos, pessoa como todo ser humano.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. Os dois comandos constam diretamente do art. 1º da Convenção Americana: obrigação de respeitar e garantir os direitos e definição de pessoa, para os efeitos do tratado, como todo ser humano.","referencia":"Convenção Americana sobre Direitos Humanos, art. 1º, itens 1 e 2; Decreto nº 678/1992.","tags":["artigo 1","obrigações estatais","pessoa"]},{"id":"DHU036","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Prisão por dívida","dificuldade":"intermediaria","enunciado":"A Convenção Americana proíbe de forma absoluta a detenção por dívidas, inclusive quando determinada por autoridade judiciária competente em razão do inadimplemento de obrigação alimentar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. O art. 7º, item 7, dispõe que ninguém deve ser detido por dívida, mas ressalva expressamente os mandados de autoridade judiciária competente expedidos em virtude de inadimplemento de obrigação alimentar.","referencia":"Convenção Americana sobre Direitos Humanos, art. 7º, item 7; Decreto nº 678/1992.","tags":["prisão por dívida","obrigação alimentar","liberdade pessoal"]},{"id":"DHU037","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Liberdade de expressão e censura prévia","dificuldade":"intermediaria","enunciado":"A Convenção Americana estabelece como regra que o exercício da liberdade de pensamento e de expressão não pode ser submetido a censura prévia, mas admite que a lei submeta espetáculos públicos a censura prévia com o objetivo exclusivo de regular o acesso para proteção moral da infância e da adolescência.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. O art. 13 estabelece, como regra, a vedação à censura prévia e prevê expressamente a hipótese de espetáculos públicos sujeitos por lei a censura prévia para o fim exclusivo de regular o acesso a eles, com vistas à proteção moral da infância e da adolescência.","referencia":"Convenção Americana sobre Direitos Humanos, art. 13, itens 2 e 4; Decreto nº 678/1992.","tags":["liberdade de expressão","censura prévia","artigo 13"]},{"id":"DHU038","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Garantias judiciais","dificuldade":"intermediaria","enunciado":"As garantias previstas no art. 8º, item 1, da Convenção Americana restringem-se à apuração de acusações penais e não se aplicam à determinação de direitos ou obrigações de natureza civil, trabalhista ou fiscal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. O art. 8º, item 1, assegura o direito de ser ouvido com as devidas garantias e dentro de prazo razoável não apenas em matéria penal, mas também para a determinação de direitos ou obrigações de natureza civil, trabalhista, fiscal ou de qualquer outra natureza.","referencia":"Convenção Americana sobre Direitos Humanos, art. 8º, item 1; Decreto nº 678/1992.","tags":["garantias judiciais","artigo 8","devido processo"]},{"id":"DHU039","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Suspensão de garantias","dificuldade":"dificil","enunciado":"Mesmo nas situações excepcionais que autorizem a suspensão de determinadas obrigações convencionais, a Convenção Americana não permite a suspensão dos direitos expressamente enumerados no art. 27, item 2, nem das garantias indispensáveis à proteção desses direitos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva está correta. O art. 27 admite medidas excepcionais em hipóteses determinadas, mas exclui da suspensão os direitos enumerados em seu item 2 e também as garantias indispensáveis à proteção desses direitos.","referencia":"Convenção Americana sobre Direitos Humanos, art. 27, itens 1 e 2; Decreto nº 678/1992.","tags":["suspensão de garantias","artigo 27","direitos inderrogáveis"]},{"id":"DHU040","area":"Noções de Direitos Humanos","tema":"Convenção Americana sobre Direitos Humanos — Pacto de São José da Costa Rica e Decreto nº 678/1992","subtema":"Direito à vida","dificuldade":"dificil","enunciado":"Ao tratar do direito à vida, a Convenção Americana determina, sem qualquer expressão qualificadora, que a proteção legal desse direito deve iniciar obrigatoriamente e em todos os casos desde o momento da concepção.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A assertiva está errada. O art. 4º, item 1, afirma que o direito à vida deve ser protegido pela lei e, em geral, desde o momento da concepção. A retirada da expressão 'em geral' modifica o texto convencional e torna a proposição incorreta.","referencia":"Convenção Americana sobre Direitos Humanos, art. 4º, item 1; Decreto nº 678/1992.","tags":["direito à vida","concepção","artigo 4"]}]};

const REQUIRED = ['id','area','tema','subtema','dificuldade','enunciado','alternativas','gabarito','comentario','referencia','tags'];
const DIFFICULTIES = new Set(['facil', 'intermediaria', 'dificil']);

function normalizeText(value = '') {
  return String(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function validateQuestion(q, seenIds, descriptor, index) {
  const issues = [];
  if (!q || typeof q !== 'object' || Array.isArray(q)) return ['registro não é objeto'];
  for (const key of REQUIRED) if (!(key in q)) issues.push(`campo ausente: ${key}`);
  if (typeof q.id !== 'string' || !q.id.trim()) issues.push('id vazio/inválido');
  if (seenIds.has(q.id)) issues.push('id duplicado');
  if (descriptor && Number.isInteger(index)) {
    const expectedId = `${descriptor.prefix}${String(index + 1).padStart(3, '0')}`;
    if (q.id !== expectedId) issues.push(`id fora da sequência: esperado ${expectedId}`);
    if (q.area !== descriptor.label) issues.push(`área divergente: esperado ${descriptor.label}`);
  }
  const altKeys = q.alternativas && typeof q.alternativas === 'object' && !Array.isArray(q.alternativas) ? Object.keys(q.alternativas).sort().join('') : '';
  if (altKeys !== 'AB') issues.push('alternativas devem conter exatamente A e B');
  else {
    if (q.alternativas.A !== 'CERTO') issues.push('alternativa A deve ser CERTO');
    if (q.alternativas.B !== 'ERRADO') issues.push('alternativa B deve ser ERRADO');
  }
  if (!['A','B'].includes(q.gabarito)) issues.push('gabarito inválido');
  if (!DIFFICULTIES.has(q.dificuldade)) issues.push('dificuldade inválida');
  if (!Array.isArray(q.tags)) issues.push('tags deve ser array');
  else if (q.tags.some(tag => typeof tag !== 'string' || !tag.trim())) issues.push('tags contém valor vazio/inválido');
  for (const field of ['area','tema','subtema','enunciado','comentario','referencia']) if (typeof q[field] !== 'string' || !q[field].trim()) issues.push(`${field} vazio/inválido`);
  return issues;
}

async function loadQuestionBank() {
  const questions = [];
  const seen = new Set();
  const report = [];
  for (const descriptor of FILES) {
    try {
      const data = EMBEDDED_BANKS[descriptor.key];
      if (!Array.isArray(data)) throw new Error('banco incorporado não é um array');
      let valid = 0, invalid = 0;
      for (let i = 0; i < data.length; i++) {
        const q = data[i];
        const issues = validateQuestion(q, seen, descriptor, i);
        if (issues.length) {
          invalid++;
          console.error(`[Banco ${descriptor.key}] Questão inválida na posição ${i}:`, q?.id, issues);
          continue;
        }
        seen.add(q.id); questions.push(q); valid++;
      }
      const validRows = data.filter(q => q && typeof q === 'object');
      const difficultyCounts = validRows.reduce((acc, q) => { acc[q.dificuldade] = (acc[q.dificuldade] || 0) + 1; return acc; }, {});
      const answerCounts = validRows.reduce((acc, q) => { acc[q.gabarito] = (acc[q.gabarito] || 0) + 1; return acc; }, {});
      const distributionOk = difficultyCounts.facil === 10 && difficultyCounts.intermediaria === 20 && difficultyCounts.dificil === 10 && answerCounts.A === 20 && answerCounts.B === 20;
      const integrity = data.length === descriptor.expected && valid === descriptor.expected && invalid === 0 && distributionOk;
      if (!integrity) console.error(`[Banco ${descriptor.key}] Integridade falhou: fonte=${data.length}, válidas=${valid}, esperadas=${descriptor.expected}, distribuição=${distributionOk ? 'ok' : 'inválida'}.`);
      report.push({ ...descriptor, loaded: true, valid, invalid, sourceCount: data.length, embedded: true, integrity, distributionOk });
    } catch (error) {
      console.error(`Falha ao carregar banco incorporado ${descriptor.key}:`, error);
      report.push({ ...descriptor, loaded: false, valid: 0, invalid: 0, sourceCount: 0, error: String(error.message || error), integrity: false });
    }
  }
  if (questions.length !== 440 || seen.size !== 440) console.error(`Integridade global falhou: ${questions.length} questões carregadas e ${seen.size} IDs únicos; esperado 440.`);
  return { questions, report };
}

function getBankMetadata(questions) {
  const byArea = new Map();
  for (const q of questions) {
    if (!byArea.has(q.area)) byArea.set(q.area, { area: q.area, count: 0, themes: new Set(), subthemes: new Set() });
    const item = byArea.get(q.area);
    item.count++;
    item.themes.add(q.tema);
    item.subthemes.add(q.subtema);
  }
  return [...byArea.values()].map(item => ({ ...item, themes: [...item.themes].sort(), subthemes: [...item.subthemes].sort() }));
}

function getFilterOptions(questions, partial = {}) {
  const uniqueSorted = values => [...new Set(values.filter(Boolean))].sort((a,b) => a.localeCompare(b, 'pt-BR'));
  const areaBase = partial.area ? questions.filter(q => q.area === partial.area) : questions;
  const themeBase = partial.tema ? areaBase.filter(q => q.tema === partial.tema) : areaBase;
  return {
    areas: uniqueSorted(questions.map(q => q.area)),
    temas: uniqueSorted(areaBase.map(q => q.tema)),
    subtemas: uniqueSorted(themeBase.map(q => q.subtema))
  };
}

function searchQuestions(questions, query) {
  const qn = normalizeText(query).trim();
  if (!qn) return [];
  return questions.filter(q => {
    const haystack = [q.id, q.area, q.tema, q.subtema, q.enunciado, ...(Array.isArray(q.tags) ? q.tags : [])]
      .map(normalizeText).join(' ');
    return haystack.includes(qn);
  });
}

function displayArea(area) {
  return area;
}

function difficultyLabel(value) {
  return ({ facil: 'Fácil', intermediaria: 'Intermediária', dificil: 'Difícil' })[value] || value;
}

function areaCode(area) {

  };
