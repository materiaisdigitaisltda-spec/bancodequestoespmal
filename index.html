 uma pessoa se possuir ordem escrita e fundamentada de autoridade judiciária competente, ainda que presencie a prática de crime em situação de flagrante delito.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Constituição admite prisão em flagrante delito independentemente de prévia ordem judicial. Também ressalva os casos de transgressão militar ou crime propriamente militar definidos em lei.","referencia":"Constituição Federal de 1988, art. 5º, LXI.","tags":["prisão","flagrante delito","atividade policial"]},{"id":"CON011","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Habeas corpus","dificuldade":"intermediaria","enunciado":"O habeas corpus é cabível quando alguém sofre ou se acha ameaçado de sofrer violência ou coação em sua liberdade de locomoção por ilegalidade ou abuso de poder.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O habeas corpus tutela a liberdade de locomoção diante de violência ou coação ilegal ou abusiva, podendo atuar de forma repressiva ou preventiva.","referencia":"Constituição Federal de 1988, art. 5º, LXVIII.","tags":["habeas corpus","remédios constitucionais","liberdade de locomoção"]},{"id":"CON012","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Mandado de segurança","dificuldade":"dificil","enunciado":"O mandado de segurança constitui o remédio constitucional especificamente destinado a proteger a liberdade de locomoção contra prisão ilegal ou abuso de poder, substituindo o habeas corpus nessas situações.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A liberdade de locomoção é protegida pelo habeas corpus. O mandado de segurança protege direito líquido e certo não amparado por habeas corpus ou habeas data quando houver ilegalidade ou abuso de poder nas condições constitucionais.","referencia":"Constituição Federal de 1988, art. 5º, LXVIII e LXIX.","tags":["mandado de segurança","habeas corpus","remédios constitucionais"]},{"id":"CON013","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Provas ilícitas","dificuldade":"dificil","enunciado":"São inadmissíveis, no processo, as provas obtidas por meios ilícitos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A inadmissibilidade processual das provas obtidas por meios ilícitos constitui garantia fundamental expressamente prevista na Constituição.","referencia":"Constituição Federal de 1988, art. 5º, LVI.","tags":["prova ilícita","processo","direitos fundamentais"]},{"id":"CON014","area":"Noções de Direito Constitucional","tema":"MAPA 121 — Direitos e garantias fundamentais","subtema":"Comunicação da prisão","dificuldade":"dificil","enunciado":"A Constituição permite que a autoridade responsável aguarde até vinte e quatro horas para comunicar ao juiz competente a prisão de uma pessoa e o local onde ela se encontra.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O texto constitucional exige comunicação imediata da prisão e do local onde se encontra o preso ao juiz competente e à família do preso ou à pessoa por ele indicada.","referencia":"Constituição Federal de 1988, art. 5º, LXII.","tags":["prisão","comunicação da prisão","garantias do preso"]},{"id":"CON015","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Federação brasileira","dificuldade":"facil","enunciado":"A República Federativa do Brasil é formada pela união indissolúvel dos Estados e Municípios e do Distrito Federal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A união indissolúvel dos Estados, Municípios e Distrito Federal integra a definição constitucional da República Federativa do Brasil.","referencia":"Constituição Federal de 1988, art. 1º, caput.","tags":["federação","organização do Estado","República Federativa"]},{"id":"CON016","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Autonomia dos entes federativos","dificuldade":"facil","enunciado":"A União, os Estados, o Distrito Federal e os Municípios são todos soberanos, possuindo cada qual soberania própria e independente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Os entes que compõem a organização político-administrativa são autônomos, e não soberanos. A soberania é atributo da República Federativa do Brasil.","referencia":"Constituição Federal de 1988, art. 18, caput.","tags":["autonomia","soberania","entes federativos"]},{"id":"CON017","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Territórios Federais","dificuldade":"facil","enunciado":"Os Territórios Federais integram a União, e sua criação, transformação em Estado ou reintegração ao Estado de origem são reguladas em lei complementar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A Constituição estabelece expressamente que os Territórios Federais integram a União e atribui à lei complementar a disciplina de sua criação, transformação em Estado ou reintegração ao Estado de origem.","referencia":"Constituição Federal de 1988, art. 18, § 2º.","tags":["territórios federais","União","organização político-administrativa"]},{"id":"CON018","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Organização político-administrativa","dificuldade":"intermediaria","enunciado":"Os Territórios Federais são entes federativos autônomos e integram, ao lado da União, dos Estados, do Distrito Federal e dos Municípios, a organização político-administrativa prevista no caput do art. 18 da Constituição.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O art. 18 enumera União, Estados, Distrito Federal e Municípios como componentes autônomos da organização político-administrativa. Os Territórios Federais integram a União e não possuem a condição de ente federativo autônomo.","referencia":"Constituição Federal de 1988, art. 18, caput e § 2º.","tags":["territórios federais","entes federativos","autonomia"]},{"id":"CON019","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Competência residual dos Estados","dificuldade":"intermediaria","enunciado":"São reservadas aos Estados as competências que não lhes sejam vedadas pela Constituição Federal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A Constituição adota para os Estados competência residual ou remanescente, reservando-lhes as competências que não tenham sido constitucionalmente vedadas.","referencia":"Constituição Federal de 1988, art. 25, § 1º.","tags":["Estados","competência residual","repartição de competências"]},{"id":"CON020","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Organização do Distrito Federal","dificuldade":"intermediaria","enunciado":"O Distrito Federal poderá ser dividido em Municípios mediante lei distrital, desde que a medida seja previamente aprovada pela população interessada em plebiscito.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Constituição veda expressamente a divisão do Distrito Federal em Municípios.","referencia":"Constituição Federal de 1988, art. 32, caput.","tags":["Distrito Federal","Municípios","organização do Estado"]},{"id":"CON021","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Competência dos Municípios","dificuldade":"intermediaria","enunciado":"Compete aos Municípios legislar sobre assuntos de interesse local.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A competência municipal para legislar sobre assuntos de interesse local encontra previsão constitucional expressa.","referencia":"Constituição Federal de 1988, art. 30, I.","tags":["Municípios","interesse local","competência legislativa"]},{"id":"CON022","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Competência suplementar municipal","dificuldade":"intermediaria","enunciado":"A competência suplementar dos Municípios alcança somente a legislação federal, sendo-lhes constitucionalmente vedado suplementar a legislação estadual.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Constituição atribui aos Municípios competência para suplementar tanto a legislação federal quanto a estadual, no que couber.","referencia":"Constituição Federal de 1988, art. 30, II.","tags":["Municípios","competência suplementar","repartição de competências"]},{"id":"CON023","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Polícia Militar do Distrito Federal","dificuldade":"intermediaria","enunciado":"Compete à União organizar e manter a polícia militar e o corpo de bombeiros militar do Distrito Federal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Entre as competências da União está organizar e manter a polícia civil, a polícia penal, a polícia militar e o corpo de bombeiros militar do Distrito Federal, além de prestar assistência financeira ao Distrito Federal nos termos constitucionais.","referencia":"Constituição Federal de 1988, art. 21, XIV.","tags":["União","Distrito Federal","polícia militar"]},{"id":"CON024","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Competência legislativa sobre polícias militares","dificuldade":"dificil","enunciado":"Compete exclusivamente a cada Estado editar normas gerais sobre organização, efetivos, material bélico, garantias, convocação e mobilização das polícias militares, não cabendo à União legislar sobre essas matérias.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Compete privativamente à União legislar sobre normas gerais de organização, efetivos, material bélico, garantias, convocação, mobilização, inatividades e pensões das polícias militares e dos corpos de bombeiros militares.","referencia":"Constituição Federal de 1988, art. 22, XXI.","tags":["polícias militares","competência da União","normas gerais"]},{"id":"CON025","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Competência legislativa concorrente","dificuldade":"dificil","enunciado":"No âmbito da legislação concorrente, a superveniência de lei federal sobre normas gerais suspende a eficácia da lei estadual naquilo em que esta for contrária à norma federal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Na competência concorrente, a superveniência de lei federal sobre normas gerais não revoga integralmente a norma estadual; suspende sua eficácia no que lhe for contrário.","referencia":"Constituição Federal de 1988, art. 24, §§ 1º a 4º.","tags":["competência concorrente","Estados","lei federal"]},{"id":"CON026","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Incorporação, subdivisão e desmembramento de Estados","dificuldade":"dificil","enunciado":"A incorporação, subdivisão ou desmembramento de Estados pode ser realizada por lei ordinária do Congresso Nacional, independentemente de consulta à população diretamente interessada.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Essas alterações dependem da aprovação da população diretamente interessada, por meio de plebiscito, e do Congresso Nacional, por lei complementar.","referencia":"Constituição Federal de 1988, art. 18, § 3º.","tags":["Estados","plebiscito","organização territorial"]},{"id":"CON027","area":"Noções de Direito Constitucional","tema":"MAPA 122 — Estrutura e organização do Estado brasileiro","subtema":"Competências legislativas do Distrito Federal","dificuldade":"dificil","enunciado":"Ao Distrito Federal são atribuídas as competências legislativas reservadas aos Estados e aos Municípios.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Por não ser dividido em Municípios, o Distrito Federal acumula, nos termos constitucionais, as competências legislativas reservadas aos Estados e aos Municípios.","referencia":"Constituição Federal de 1988, art. 32, § 1º.","tags":["Distrito Federal","competência legislativa","autonomia"]},{"id":"CON028","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Conceito constitucional de segurança pública","dificuldade":"facil","enunciado":"A segurança pública é dever exclusivo do Estado, não sendo constitucionalmente considerada direito nem responsabilidade da coletividade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A segurança pública é definida pela Constituição como dever do Estado, direito e responsabilidade de todos.","referencia":"Constituição Federal de 1988, art. 144, caput.","tags":["segurança pública","dever do Estado","responsabilidade de todos"]},{"id":"CON029","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Órgãos de segurança pública","dificuldade":"facil","enunciado":"As polícias militares e os corpos de bombeiros militares integram expressamente o conjunto de órgãos por meio dos quais é exercida a segurança pública.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O art. 144 inclui expressamente as polícias militares e os corpos de bombeiros militares entre os órgãos responsáveis pelo exercício da segurança pública.","referencia":"Constituição Federal de 1988, art. 144, V.","tags":["segurança pública","polícia militar","bombeiros militares"]},{"id":"CON030","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Corpos de bombeiros militares e defesa civil","dificuldade":"facil","enunciado":"A Constituição exclui a execução de atividades de defesa civil das atribuições dos corpos de bombeiros militares, limitando-os exclusivamente a funções de natureza militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Além das atribuições definidas em lei, a Constituição atribui aos corpos de bombeiros militares a execução de atividades de defesa civil.","referencia":"Constituição Federal de 1988, art. 144, § 5º.","tags":["bombeiros militares","defesa civil","segurança pública"]},{"id":"CON031","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Atribuições das polícias militares","dificuldade":"intermediaria","enunciado":"Às polícias militares cabem a polícia ostensiva e a preservação da ordem pública.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A Constituição atribui expressamente às polícias militares a polícia ostensiva e a preservação da ordem pública.","referencia":"Constituição Federal de 1988, art. 144, § 5º.","tags":["polícia militar","polícia ostensiva","ordem pública"]},{"id":"CON032","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Subordinação das polícias militares estaduais","dificuldade":"intermediaria","enunciado":"Por serem forças auxiliares e reserva do Exército, as polícias militares estaduais subordinam-se diretamente ao Presidente da República, e não aos Governadores dos Estados.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"As polícias militares e os corpos de bombeiros militares são forças auxiliares e reserva do Exército, mas subordinam-se, juntamente com os demais órgãos estaduais e distritais indicados no dispositivo constitucional, aos Governadores dos Estados e do Distrito Federal.","referencia":"Constituição Federal de 1988, art. 144, § 6º.","tags":["polícia militar","Governador","forças auxiliares"]},{"id":"CON033","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Hipóteses de estado de defesa","dificuldade":"intermediaria","enunciado":"O Presidente da República pode, ouvidos o Conselho da República e o Conselho de Defesa Nacional, decretar estado de defesa para preservar ou prontamente restabelecer, em locais restritos e determinados, a ordem pública ou a paz social ameaçadas por grave e iminente instabilidade institucional ou atingidas por calamidades de grandes proporções na natureza.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O enunciado reproduz as hipóteses constitucionais e o requisito de prévia oitiva dos dois conselhos para decretação do estado de defesa.","referencia":"Constituição Federal de 1988, art. 136, caput.","tags":["estado de defesa","Presidente da República","instabilidade institucional"]},{"id":"CON034","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Controle político do estado de defesa","dificuldade":"intermediaria","enunciado":"A decretação do estado de defesa depende de autorização prévia do Congresso Nacional, sem a qual o Presidente da República não poderá editar o respectivo decreto.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O estado de defesa não depende de autorização prévia do Congresso Nacional. Uma vez decretado, o Presidente deve submeter o ato e sua justificação ao Congresso Nacional dentro de vinte e quatro horas, para decisão por maioria absoluta.","referencia":"Constituição Federal de 1988, art. 136, § 4º.","tags":["estado de defesa","Congresso Nacional","controle político"]},{"id":"CON035","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Duração do estado de defesa","dificuldade":"intermediaria","enunciado":"O estado de defesa não poderá durar mais de trinta dias, admitida uma única prorrogação por igual período caso persistam as razões que justificaram sua decretação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O texto constitucional fixa duração máxima inicial de trinta dias e permite uma única prorrogação, também por até trinta dias, se persistirem as razões justificadoras.","referencia":"Constituição Federal de 1988, art. 136, § 2º.","tags":["estado de defesa","prazo","prorrogação"]},{"id":"CON036","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Garantias do preso no estado de defesa","dificuldade":"intermediaria","enunciado":"Durante o estado de defesa, é constitucionalmente permitida a incomunicabilidade do preso por até dez dias, independentemente de autorização judicial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Constituição veda expressamente a incomunicabilidade do preso durante o estado de defesa. Além disso, a prisão ou detenção de qualquer pessoa não poderá ser superior a dez dias, salvo autorização do Poder Judiciário.","referencia":"Constituição Federal de 1988, art. 136, § 3º, III e IV.","tags":["estado de defesa","prisão","incomunicabilidade"]},{"id":"CON037","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Decretação do estado de sítio","dificuldade":"intermediaria","enunciado":"Para decretar o estado de sítio, o Presidente da República deve ouvir o Conselho da República e o Conselho de Defesa Nacional e solicitar autorização ao Congresso Nacional.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Diferentemente do estado de defesa, o estado de sítio depende de prévia autorização do Congresso Nacional, solicitada pelo Presidente depois de ouvidos o Conselho da República e o Conselho de Defesa Nacional.","referencia":"Constituição Federal de 1988, art. 137, caput e parágrafo único.","tags":["estado de sítio","Congresso Nacional","Presidente da República"]},{"id":"CON038","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Duração do estado de sítio","dificuldade":"dificil","enunciado":"No caso de comoção grave de repercussão nacional ou de ineficácia de medida tomada durante o estado de defesa, o estado de sítio poderá ser decretado inicialmente por até sessenta dias, admitidas prorrogações pelo mesmo período.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Na hipótese do art. 137, I, o estado de sítio não poderá ser decretado por mais de trinta dias nem prorrogado, de cada vez, por prazo superior a trinta dias.","referencia":"Constituição Federal de 1988, art. 137, I, e art. 138, § 1º.","tags":["estado de sítio","prazo","comoção grave"]},{"id":"CON039","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Fiscalização do estado de defesa e do estado de sítio","dificuldade":"dificil","enunciado":"A Mesa do Congresso Nacional, ouvidos os líderes partidários, deve designar comissão composta de cinco de seus membros para acompanhar e fiscalizar a execução das medidas referentes ao estado de defesa e ao estado de sítio.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A fiscalização parlamentar das medidas excepcionais é expressamente prevista, sendo atribuída a uma comissão de cinco membros designada pela Mesa do Congresso Nacional após a oitiva dos líderes partidários.","referencia":"Constituição Federal de 1988, art. 140.","tags":["Congresso Nacional","estado de defesa","estado de sítio"]},{"id":"CON040","area":"Noções de Direito Constitucional","tema":"MAPA 123 — Defesa do Estado e das instituições democráticas","subtema":"Cessação das medidas excepcionais","dificuldade":"dificil","enunciado":"Com o término do estado de defesa ou do estado de sítio, cessam os efeitos das medidas adotadas e também se extingue eventual responsabilidade dos executores ou agentes por ilícitos praticados durante sua vigência.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Cessados o estado de defesa ou o estado de sítio, cessam também seus efeitos, mas permanece a possibilidade de responsabilização pelos ilícitos cometidos por seus executores ou agentes.","referencia":"Constituição Federal de 1988, art. 141, caput.","tags":["estado de defesa","estado de sítio","responsabilidade"]}],"processual_penal":[{"id":"DPP001","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"natureza e finalidade","dificuldade":"facil","enunciado":"A respeito do inquérito policial, julgue o item a seguir. O inquérito policial é procedimento de natureza administrativa e preparatória, destinado à apuração da infração penal e de sua autoria, não se confundindo com o processo judicial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O inquérito policial é procedimento investigatório pré-processual, de natureza administrativa. O art. 4º do CPP atribui à polícia judiciária a apuração das infrações penais e de sua autoria, e o art. 2º, § 1º, da Lei nº 12.830/2013 explicita a apuração das circunstâncias, da materialidade e da autoria.","referencia":"CPP, art. 4º; Lei nº 12.830/2013, art. 2º, § 1º.","tags":["inquérito policial","natureza","finalidade"]},{"id":"DPP002","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"finalidade","dificuldade":"facil","enunciado":"Em uma investigação de furto, a autoridade policial afirmou que o inquérito tem por finalidade exclusiva formar prova definitiva para a condenação do suspeito. Essa afirmação está correta.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O inquérito busca reunir elementos informativos sobre o fato, suas circunstâncias, materialidade e autoria. Ele não tem por finalidade exclusiva produzir prova definitiva para condenação, e os elementos colhidos na investigação submetem-se às limitações do art. 155 do CPP.","referencia":"CPP, arts. 4º e 155; Lei nº 12.830/2013, art. 2º, § 1º.","tags":["inquérito policial","finalidade","elementos informativos"]},{"id":"DPP003","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"instauração na ação pública incondicionada","dificuldade":"facil","enunciado":"Ao tomar conhecimento de crime de ação penal pública incondicionada, a autoridade policial pode instaurar inquérito de ofício, independentemente de requerimento da vítima.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Nos crimes de ação pública, o inquérito pode ser iniciado de ofício pela autoridade policial. Tratando-se de ação pública incondicionada, não se exige representação da vítima como condição para a instauração.","referencia":"CPP, art. 5º, I.","tags":["inquérito policial","instauração","ação pública incondicionada"]},{"id":"DPP004","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"instauração na ação pública condicionada","dificuldade":"facil","enunciado":"Em crime cuja ação penal pública dependa de representação, a autoridade policial poderá instaurar inquérito de ofício e colher a representação da vítima apenas ao final das investigações.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Nos crimes em que a ação pública depender de representação, o inquérito não poderá ser iniciado sem ela. A representação é condição necessária para o início da investigação nessa hipótese.","referencia":"CPP, art. 5º, § 4º.","tags":["inquérito policial","representação","ação pública condicionada"]},{"id":"DPP005","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"instauração na ação privada","dificuldade":"facil","enunciado":"Se o fato investigado for crime de ação penal privada, a autoridade policial somente poderá proceder a inquérito mediante requerimento de quem tenha qualidade para intentar a ação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Nos crimes de ação privada, a instauração do inquérito depende de requerimento de quem tenha legitimidade para propor a queixa-crime.","referencia":"CPP, art. 5º, § 5º.","tags":["inquérito policial","ação privada","requerimento"]},{"id":"DPP006","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"notícia do crime","dificuldade":"intermediaria","enunciado":"Uma pessoa do povo comunicou verbalmente à autoridade policial a ocorrência de crime de ação pública. Nessa situação, a autoridade é obrigada a instaurar imediatamente o inquérito, sendo-lhe vedado verificar previamente a procedência das informações.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Qualquer pessoa pode comunicar, verbalmente ou por escrito, infração penal de ação pública à autoridade policial, mas o CPP prevê que a autoridade verificará a procedência das informações antes de mandar instaurar o inquérito.","referencia":"CPP, art. 5º, § 3º.","tags":["inquérito policial","notitia criminis","instauração"]},{"id":"DPP007","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"diligências no local do fato","dificuldade":"intermediaria","enunciado":"Após notícia de um homicídio, a autoridade policial deve, entre outras providências legais, dirigir-se ao local e preservar o estado das coisas até a chegada dos peritos criminais, bem como apreender os objetos relacionados ao fato após serem liberados pelos peritos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Essas providências constam expressamente do art. 6º, I e II, do CPP e integram as diligências iniciais da autoridade policial para preservação e coleta regular dos elementos relacionados ao fato.","referencia":"CPP, art. 6º, I e II.","tags":["inquérito policial","diligências","local do crime"]},{"id":"DPP008","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"diligências requeridas pelo investigado","dificuldade":"intermediaria","enunciado":"Durante o inquérito, o indiciado requereu a oitiva de determinada testemunha. Por força do CPP, a autoridade policial está vinculada ao pedido e deve obrigatoriamente realizar a diligência.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O ofendido, seu representante legal e o indiciado podem requerer diligências, mas sua realização fica a juízo da autoridade policial. Portanto, o simples requerimento não torna a diligência obrigatória.","referencia":"CPP, art. 14.","tags":["inquérito policial","diligências","indiciado"]},{"id":"DPP009","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"indiciamento","dificuldade":"intermediaria","enunciado":"O indiciamento é ato privativo do delegado de polícia e deve ser fundamentado mediante análise técnico-jurídica do fato, com indicação da autoria, da materialidade e de suas circunstâncias.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A Lei nº 12.830/2013 estabelece expressamente que o indiciamento é privativo do delegado de polícia e exige ato fundamentado, com análise técnico-jurídica do fato e indicação de autoria, materialidade e circunstâncias.","referencia":"Lei nº 12.830/2013, art. 2º, § 6º.","tags":["inquérito policial","indiciamento","delegado de polícia"]},{"id":"DPP010","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"valor probatório","dificuldade":"intermediaria","enunciado":"Em regra, o juiz pode fundamentar uma condenação exclusivamente nos elementos informativos colhidos no inquérito, ainda que nenhuma prova tenha sido produzida sob contraditório judicial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O art. 155 do CPP veda que o juiz fundamente sua decisão exclusivamente nos elementos informativos colhidos na investigação, ressalvadas as provas cautelares, não repetíveis e antecipadas.","referencia":"CPP, art. 155, caput.","tags":["inquérito policial","valor probatório","artigo 155"]},{"id":"DPP011","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"dispensabilidade","dificuldade":"intermediaria","enunciado":"Se o Ministério Público já dispuser de peças de informação suficientes para formar sua opinio delicti, o inquérito policial pode ser dispensado para o oferecimento da denúncia.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O inquérito policial não é condição indispensável para a ação penal. O CPP prevê hipóteses em que o Ministério Público pode dispensá-lo quando já possui elementos suficientes para promover a ação.","referencia":"CPP, arts. 39, § 5º, e 46, § 1º.","tags":["inquérito policial","dispensabilidade","denúncia"]},{"id":"DPP012","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"sigilo e acesso da defesa","dificuldade":"intermediaria","enunciado":"O caráter sigiloso do inquérito autoriza a autoridade policial a negar ao defensor, em qualquer hipótese, acesso aos elementos de prova já documentados que digam respeito ao exercício da defesa.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O sigilo do inquérito não é oponível de forma absoluta à defesa. A Súmula Vinculante 14 do STF assegura ao defensor acesso amplo aos elementos de prova já documentados que interessem ao exercício do direito de defesa, sem abranger diligências em andamento ainda não documentadas.","referencia":"CPP, art. 20; STF, Súmula Vinculante 14.","tags":["inquérito policial","sigilo","defesa"]},{"id":"DPP013","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"arquivamento pela autoridade policial","dificuldade":"intermediaria","enunciado":"Mesmo quando conclua pela inexistência de elementos mínimos de autoria, a autoridade policial não pode determinar o arquivamento do inquérito por decisão própria.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A autoridade policial não possui atribuição para arquivar o inquérito: o art. 17 do CPP proíbe expressamente que ela mande arquivar os autos. O arquivamento observa o art. 28 do CPP conforme a interpretação fixada pelo STF nas ADIs 6.298, 6.299, 6.300 e 6.305.","referencia":"CPP, arts. 17 e 28; STF, ADIs 6.298, 6.299, 6.300 e 6.305.","tags":["inquérito policial","arquivamento","autoridade policial"]},{"id":"DPP014","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"devolução para novas diligências","dificuldade":"intermediaria","enunciado":"O Ministério Público pode devolver o inquérito à autoridade policial para a realização de qualquer diligência que considere útil, ainda que ela não seja imprescindível ao oferecimento da denúncia.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O art. 16 do CPP restringe a devolução do inquérito à autoridade policial às novas diligências imprescindíveis ao oferecimento da denúncia.","referencia":"CPP, art. 16.","tags":["inquérito policial","diligências","Ministério Público"]},{"id":"DPP015","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"prazo de conclusão","dificuldade":"intermediaria","enunciado":"Pela regra geral do CPP, o inquérito deve terminar em 10 dias se o indiciado estiver preso em flagrante ou preventivamente e em 30 dias se estiver solto, com ou sem fiança.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Esses são os prazos gerais previstos no art. 10 do CPP, sem prejuízo de prazos especiais estabelecidos em legislação específica.","referencia":"CPP, art. 10, caput.","tags":["inquérito policial","prazo","conclusão"]},{"id":"DPP016","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"relatório final","dificuldade":"dificil","enunciado":"Ao concluir o inquérito, a autoridade policial deve apresentar relatório minucioso e, obrigatoriamente, formular juízo jurídico vinculante sobre o oferecimento ou não da denúncia pelo Ministério Público.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O art. 10, § 1º, exige relatório minucioso do que foi apurado, mas a decisão sobre oferecer denúncia pertence ao titular da ação penal pública. O relatório policial não vincula o Ministério Público quanto à propositura da ação.","referencia":"CPP, arts. 10, § 1º, e 24, caput.","tags":["inquérito policial","relatório","conclusão"]},{"id":"DPP017","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"arquivamento e revisão ministerial","dificuldade":"dificil","enunciado":"Conforme a interpretação vigente do art. 28 do CPP fixada pelo STF, ao se manifestar pelo arquivamento do inquérito policial, o Ministério Público deve submeter sua manifestação ao juiz competente e comunicar o fato à vítima, ao investigado e à autoridade policial, podendo encaminhar os autos ao procurador-geral ou à instância de revisão ministerial, quando houver, para fins de homologação, na forma da lei.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. No julgamento das ADIs 6.298, 6.299, 6.300 e 6.305, o STF atribuiu interpretação conforme à Constituição ao art. 28 do CPP para estabelecer esses parâmetros. O STF também assentou que a autoridade judicial poderá submeter a matéria à revisão ministerial se verificar patente ilegalidade ou teratologia no ato de arquivamento.","referencia":"CPP, art. 28, caput e § 1º; STF, ADIs 6.298, 6.299, 6.300 e 6.305, Tribunal Pleno, julgamento concluído em 24/8/2023, DJe de 19/12/2023.","tags":["inquérito policial","arquivamento","revisão ministerial"]},{"id":"DPP018","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"discordância da vítima com o arquivamento","dificuldade":"dificil","enunciado":"Se a vítima não concordar com o arquivamento do inquérito, o CPP lhe concede prazo de 15 dias, contado da comunicação, para submeter a matéria à revisão da instância competente do Ministério Público.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O prazo legal é de 30 dias a partir do recebimento da comunicação do arquivamento, e não de 15 dias.","referencia":"CPP, art. 28, § 1º.","tags":["inquérito policial","arquivamento","vítima"]},{"id":"DPP019","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"relação entre inquérito e peça acusatória","dificuldade":"dificil","enunciado":"O inquérito policial acompanhará a denúncia ou a queixa sempre que tiver servido de base a uma delas, o que não significa que sua existência seja requisito obrigatório para toda ação penal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 12 determina que o inquérito acompanhe a denúncia ou queixa quando lhes servir de base. Isso é compatível com sua dispensabilidade quando a acusação puder apoiar-se em outros elementos informativos suficientes.","referencia":"CPP, arts. 12, 39, § 5º, e 46, § 1º.","tags":["inquérito policial","dispensabilidade","denúncia e queixa"]},{"id":"DPP020","area":"Noções de Direito Processual Penal","tema":"Inquérito policial","subtema":"indiciamento e atribuição do delegado","dificuldade":"dificil","enunciado":"Por ser o Ministério Público o titular da ação penal pública, ele pode determinar diretamente ao delegado que indicie determinada pessoa, ficando a autoridade policial vinculada à ordem.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A titularidade da ação penal pública não transfere ao Ministério Público a competência para praticar o indiciamento. A Lei nº 12.830/2013 define o indiciamento como ato privativo do delegado de polícia e exige decisão fundamentada baseada em análise técnico-jurídica.","referencia":"CF, art. 129, I; Lei nº 12.830/2013, art. 2º, § 6º.","tags":["inquérito policial","indiciamento","atribuição"]},{"id":"DPP021","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"ação penal pública","dificuldade":"facil","enunciado":"Nos crimes de ação penal pública, a ação é promovida por denúncia do Ministério Público.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O Ministério Público é o titular da ação penal pública, promovida por meio de denúncia.","referencia":"CF, art. 129, I; CPP, art. 24, caput.","tags":["ação penal","ação pública","denúncia"]},{"id":"DPP022","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"ação pública condicionada","dificuldade":"facil","enunciado":"Quando a lei exige representação do ofendido para determinado crime de ação pública, o Ministério Público pode oferecer denúncia independentemente dessa manifestação, pois a representação é mera faculdade sem efeito sobre a persecução penal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Nos crimes de ação pública condicionada, a representação do ofendido ou de quem tenha qualidade para representá-lo constitui condição para o exercício da ação penal quando a lei assim exigir.","referencia":"CPP, art. 24, caput.","tags":["ação penal","representação","ação pública condicionada"]},{"id":"DPP023","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"ação penal privada","dificuldade":"facil","enunciado":"Na ação penal privada, cabe ao ofendido ou a quem tenha qualidade para representá-lo intentar a ação por meio de queixa.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 30 do CPP atribui ao ofendido ou a quem tenha qualidade para representá-lo a legitimidade para intentar a ação privada.","referencia":"CPP, art. 30.","tags":["ação penal","ação privada","queixa"]},{"id":"DPP024","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"requisitos da denúncia e da queixa","dificuldade":"facil","enunciado":"A denúncia e a queixa dispensam a exposição das circunstâncias do fato criminoso, bastando indicar o tipo penal supostamente violado e o nome do acusado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A denúncia ou queixa deve conter a exposição do fato criminoso com todas as suas circunstâncias, além da qualificação do acusado ou dados que permitam identificá-lo, a classificação do crime e, quando necessário, o rol de testemunhas.","referencia":"CPP, art. 41.","tags":["ação penal","denúncia","queixa"]},{"id":"DPP025","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"indisponibilidade da ação pública","dificuldade":"facil","enunciado":"Depois de ajuizada a ação penal pública, o Ministério Público não pode desistir dela.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 42 do CPP estabelece expressamente que o Ministério Público não poderá desistir da ação penal, regra associada ao princípio da indisponibilidade da ação penal pública.","referencia":"CPP, art. 42.","tags":["ação penal","indisponibilidade","Ministério Público"]},{"id":"DPP026","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"forma da representação","dificuldade":"intermediaria","enunciado":"A representação somente é válida se for apresentada por escrito diretamente ao Ministério Público, sendo inválida quando feita oralmente à autoridade policial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A representação pode ser exercida pessoalmente ou por procurador com poderes especiais, mediante declaração escrita ou oral, dirigida ao juiz, ao Ministério Público ou à autoridade policial.","referencia":"CPP, art. 39, caput.","tags":["ação penal","representação","forma"]},{"id":"DPP027","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"decadência da representação e da queixa","dificuldade":"intermediaria","enunciado":"Salvo disposição legal em contrário, o prazo para o ofendido exercer o direito de queixa ou de representação é de seis meses, contado do dia em que vier a saber quem é o autor do crime.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. Essa é a regra geral de decadência prevista no art. 38 do CPP. Há exceções legais, inclusive a prevista no § 2º do mesmo artigo para crimes praticados no âmbito de violência doméstica e familiar contra a mulher.","referencia":"CPP, art. 38, caput e § 2º.","tags":["ação penal","decadência","representação"]},{"id":"DPP028","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"decadência na violência doméstica e familiar contra a mulher","dificuldade":"intermediaria","enunciado":"Em crime praticado no âmbito de violência doméstica e familiar contra a mulher, quando a persecução depender de queixa ou de representação, aplica-se necessariamente o prazo geral de seis meses do CPP, inexistindo prazo especial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A Lei nº 15.438/2026 acrescentou o § 2º ao art. 38 do CPP e passou a prever, nos crimes praticados no âmbito de violência doméstica e familiar contra a mulher, prazo de 12 meses para o exercício do direito de queixa ou de representação, contado nos termos do dispositivo.","referencia":"CPP, art. 38, § 2º; Lei nº 15.438/2026, art. 4º.","tags":["ação penal","decadência","violência doméstica"]},{"id":"DPP029","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"ação privada subsidiária da pública","dificuldade":"intermediaria","enunciado":"Se o Ministério Público não intentar a ação penal pública no prazo legal, admite-se ação privada subsidiária, sem que isso elimine os poderes do Ministério Público de aditar a queixa, repudiá-la e oferecer denúncia substitutiva, entre outras atribuições previstas no CPP.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. A ação privada subsidiária da pública é admitida diante da inércia do Ministério Público no prazo legal, mantendo-se ao órgão ministerial as atribuições expressamente previstas no art. 29 do CPP.","referencia":"CF, art. 5º, LIX; CPP, art. 29.","tags":["ação penal","ação privada subsidiária","Ministério Público"]},{"id":"DPP030","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"sucessão no direito de representação","dificuldade":"intermediaria","enunciado":"Falecendo o ofendido em crime de ação pública condicionada, o direito de representação extingue-se automaticamente e não pode ser exercido por familiares.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. No caso de morte do ofendido ou quando declarado ausente por decisão judicial, o direito de representação passa ao cônjuge, ascendente, descendente ou irmão.","referencia":"CPP, art. 24, § 1º.","tags":["ação penal","representação","sucessão"]},{"id":"DPP031","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"indivisibilidade da ação privada","dificuldade":"intermediaria","enunciado":"Em ação penal privada por fato praticado em coautoria, a queixa contra qualquer dos autores obriga ao processo de todos, cabendo ao Ministério Público velar pela indivisibilidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 48 do CPP consagra a indivisibilidade da ação privada: a queixa contra qualquer dos autores do crime obriga ao processo de todos, e o Ministério Público fiscaliza essa indivisibilidade.","referencia":"CPP, art. 48.","tags":["ação penal","ação privada","indivisibilidade"]},{"id":"DPP032","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"renúncia ao direito de queixa","dificuldade":"intermediaria","enunciado":"Na ação penal privada, a renúncia ao exercício do direito de queixa em relação a um dos autores do crime produz efeitos apenas quanto a ele, permitindo que o ofendido processe os demais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A renúncia ao direito de queixa em relação a um dos autores estende-se a todos, em coerência com o princípio da indivisibilidade da ação privada.","referencia":"CPP, art. 49.","tags":["ação penal","renúncia","ação privada"]},{"id":"DPP033","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"perdão do ofendido","dificuldade":"intermediaria","enunciado":"Na ação penal privada, o perdão concedido a um dos querelados aproveita aos demais, mas não produz efeito em relação ao querelado que o recusar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 51 do CPP determina a extensão do perdão aos demais querelados, ressalvando expressamente que ele não produz efeito em relação àquele que o recusar.","referencia":"CPP, art. 51.","tags":["ação penal","perdão","ação privada"]},{"id":"DPP034","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"procuração para queixa","dificuldade":"intermediaria","enunciado":"A queixa pode ser oferecida por procurador com poderes gerais para o foro, sendo desnecessários poderes especiais e qualquer menção ao fato criminoso no instrumento de mandato.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. A queixa pode ser oferecida por procurador, mas o art. 44 do CPP exige poderes especiais e, em regra, que constem do mandato o nome do querelante e a menção do fato criminoso.","referencia":"CPP, art. 44.","tags":["ação penal","queixa","procuração"]},{"id":"DPP035","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"prazo para denúncia","dificuldade":"intermediaria","enunciado":"Recebidos pelo Ministério Público os autos do inquérito, o prazo geral para oferecimento da denúncia é de cinco dias se o investigado estiver preso e de quinze dias se estiver solto ou afiançado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 46 do CPP estabelece os prazos gerais de cinco dias para réu preso e quinze dias para réu solto ou afiançado, contados na forma prevista no dispositivo.","referencia":"CPP, art. 46, caput.","tags":["ação penal","denúncia","prazo"]},{"id":"DPP036","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"aditamento da queixa pelo Ministério Público","dificuldade":"dificil","enunciado":"Quando a ação penal for exclusivamente privada, o Ministério Público fica impedido de aditar a queixa e não intervém nos termos subsequentes do processo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Mesmo quando a ação penal é privativa do ofendido, o art. 45 do CPP prevê que a queixa poderá ser aditada pelo Ministério Público, ao qual cabe intervir nos termos subsequentes do processo.","referencia":"CPP, art. 45.","tags":["ação penal","queixa","Ministério Público"]},{"id":"DPP037","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"decadência na ação privada subsidiária","dificuldade":"dificil","enunciado":"Na ação privada subsidiária da pública, o prazo decadencial de seis meses para o oferecimento da queixa conta-se, em regra, do dia em que se esgotar o prazo legal para o Ministério Público oferecer denúncia.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 38 do CPP fixa, para a hipótese do art. 29, o termo inicial do prazo decadencial no dia em que se esgotar o prazo para o oferecimento da denúncia, ressalvadas disposições legais específicas.","referencia":"CPP, arts. 29 e 38, caput.","tags":["ação penal","ação privada subsidiária","decadência"]},{"id":"DPP038","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"representação e dispensabilidade do inquérito","dificuldade":"dificil","enunciado":"Se a vítima apresenta representação acompanhada de elementos suficientes para habilitar o Ministério Público a promover a ação penal, o órgão ministerial é obrigado a requisitar inquérito antes de oferecer denúncia.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Quando a representação já vier acompanhada de elementos suficientes para habilitar o Ministério Público a promover a ação penal, o art. 39, § 5º, prevê a dispensa do inquérito e o oferecimento da denúncia no prazo de quinze dias.","referencia":"CPP, art. 39, § 5º.","tags":["ação penal","representação","dispensabilidade do inquérito"]},{"id":"DPP039","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"identificação do acusado na denúncia ou queixa","dificuldade":"dificil","enunciado":"A falta do nome civil completo do acusado não impede, por si só, a denúncia ou a queixa, desde que sejam fornecidos esclarecimentos pelos quais seja possível identificá-lo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O item está certo. O art. 41 do CPP admite que a peça acusatória contenha a qualificação do acusado ou esclarecimentos pelos quais se possa identificá-lo. Assim, a ausência do nome civil completo não é, isoladamente, impeditiva quando a identificação é possível por outros dados.","referencia":"CPP, art. 41.","tags":["ação penal","denúncia","identificação do acusado"]},{"id":"DPP040","area":"Noções de Direito Processual Penal","tema":"Ação penal","subtema":"perempção","dificuldade":"dificil","enunciado":"Em ação penal exclusivamente privada, se o querelante deixar de promover o andamento do processo durante vinte dias seguidos, ocorrerá automaticamente a perempção prevista no CPP.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. Uma das hipóteses de perempção ocorre quando, iniciada a ação privada, o querelante deixa de promover o andamento do processo durante 30 dias seguidos, e não 20 dias.","referencia":"CPP, art. 60, I.","tags":["ação penal","perempção","ação privada"]}],"penal_militar":[{"id":"DPM001","area":"Noções de Direito Penal Militar","tema":"Aplicação da lei penal militar","subtema":"Tempo do crime","dificuldade":"facil","enunciado":"Segundo o Código Penal Militar, considera-se praticado o crime no momento da ação ou da omissão, ainda que o resultado ocorra em momento posterior.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O CPM adota, quanto ao tempo do crime, a teoria da atividade. Considera-se praticado o crime no momento da ação ou da omissão, ainda que outro seja o momento do resultado.","referencia":"CPM, art. 5º.","tags":["tempo do crime","teoria da atividade","aplicação da lei penal militar"]},{"id":"DPM002","area":"Noções de Direito Penal Militar","tema":"Aplicação da lei penal militar","subtema":"Lugar do crime","dificuldade":"intermediaria","enunciado":"Para o Código Penal Militar, o crime é considerado praticado exclusivamente no lugar em que ocorreu a ação ou omissão do agente, sendo juridicamente irrelevante o local em que se produziu ou deveria produzir-se o resultado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O CPM considera praticado o fato tanto no lugar em que se desenvolveu a atividade criminosa, no todo ou em parte, inclusive sob forma de participação, quanto onde se produziu ou deveria produzir-se o resultado. Nos crimes omissivos, considera-se o lugar em que deveria realizar-se a ação omitida.","referencia":"CPM, art. 6º.","tags":["lugar do crime","ubiquidade","aplicação espacial"]},{"id":"DPM003","area":"Noções de Direito Penal Militar","tema":"Aplicação da lei penal militar","subtema":"Extraterritorialidade","dificuldade":"dificil","enunciado":"A lei penal militar brasileira pode alcançar crime cometido fora do território nacional, ainda que o agente esteja sendo processado ou já tenha sido julgado pela justiça estrangeira, sem prejuízo das convenções, dos tratados e das regras de direito internacional.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O CPM determina a aplicação da lei penal militar ao crime cometido, no todo ou em parte, no território nacional ou fora dele, mesmo que, neste último caso, o agente esteja sendo processado ou tenha sido julgado pela justiça estrangeira, ressalvadas convenções, tratados e regras de direito internacional.","referencia":"CPM, art. 7º.","tags":["extraterritorialidade","lei penal militar","territorialidade"]},{"id":"DPM004","area":"Noções de Direito Penal Militar","tema":"Crime militar: conceito e elementos","subtema":"Crime consumado","dificuldade":"facil","enunciado":"De acordo com o CPM, o crime é consumado quando nele se reúnem todos os elementos de sua definição legal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva reproduz a definição de crime consumado prevista no Código Penal Militar.","referencia":"CPM, art. 30, I.","tags":["crime consumado","elementos do crime","consumação"]},{"id":"DPM005","area":"Noções de Direito Penal Militar","tema":"Crime militar: conceito e elementos","subtema":"Caracterização do crime militar","dificuldade":"intermediaria","enunciado":"Em tempo de paz, todo crime praticado por militar da ativa é automaticamente crime militar, independentemente da vítima, do local, da situação funcional ou das demais circunstâncias em que o fato tenha ocorrido.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A condição de militar do agente, isoladamente, não transforma qualquer infração em crime militar. O fato deve enquadrar-se nas hipóteses legais do art. 9º do CPM, conforme a natureza do delito e as circunstâncias concretas.","referencia":"CPM, art. 9º.","tags":["crime militar","artigo 9","militar da ativa"]},{"id":"DPM006","area":"Noções de Direito Penal Militar","tema":"Crime militar: conceito e elementos","subtema":"Relevância penal da omissão","dificuldade":"dificil","enunciado":"No Direito Penal Militar, a omissão pode ser juridicamente relevante como causa do resultado quando o omitente devia e podia agir para evitá-lo, incluindo-se entre as fontes do dever de agir a obrigação legal de cuidado, proteção ou vigilância, a assunção da responsabilidade de impedir o resultado e a criação anterior do risco de sua ocorrência.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O CPM reconhece a relevância causal da omissão quando o agente devia e podia agir para evitar o resultado. O dever de agir decorre das hipóteses expressamente indicadas no art. 29, § 2º.","referencia":"CPM, art. 29, § 2º.","tags":["omissão","relação de causalidade","dever de agir"]},{"id":"DPM007","area":"Noções de Direito Penal Militar","tema":"Imputabilidade penal militar","subtema":"Menoridade penal","dificuldade":"facil","enunciado":"O menor de dezoito anos é penalmente inimputável segundo o Código Penal Militar, ficando sujeito às normas estabelecidas na legislação especial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A redação vigente do art. 50 do CPM estabelece expressamente a inimputabilidade penal do menor de dezoito anos e sua sujeição às normas da legislação especial.","referencia":"CPM, art. 50, com redação dada pela Lei nº 14.688/2023.","tags":["inimputabilidade","menor de dezoito anos","menoridade penal"]},{"id":"DPM008","area":"Noções de Direito Penal Militar","tema":"Imputabilidade penal militar","subtema":"Semi-imputabilidade","dificuldade":"intermediaria","enunciado":"Se doença ou deficiência mental apenas diminuir consideravelmente, sem suprimir, a capacidade de entendimento da ilicitude do fato ou de autodeterminação do agente, a imputabilidade estará integralmente excluída e será obrigatória sua absolvição.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A diminuição considerável da capacidade, sem sua supressão, não exclui a imputabilidade. Nessa hipótese, a pena pode ser reduzida de um terço a dois terços, sem prejuízo do disposto no art. 113 do CPM.","referencia":"CPM, art. 48, parágrafo único.","tags":["semi-imputabilidade","doença mental","redução de pena"]},{"id":"DPM009","area":"Noções de Direito Penal Militar","tema":"Concurso de agentes","subtema":"Comunicação de condições pessoais","dificuldade":"intermediaria","enunciado":"No concurso de agentes, as condições ou circunstâncias de caráter pessoal não se comunicam entre os concorrentes, salvo quando constituírem elementares do crime.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O CPM estabelece a incomunicabilidade das condições ou circunstâncias de caráter pessoal, exceto quando constituírem elementares do crime.","referencia":"CPM, art. 53, § 1º.","tags":["concurso de agentes","circunstâncias pessoais","elementares"]},{"id":"DPM010","area":"Noções de Direito Penal Militar","tema":"Concurso de agentes","subtema":"Ajuste, determinação, instigação e auxílio","dificuldade":"intermediaria","enunciado":"No Direito Penal Militar, o ajuste, a determinação, a instigação e o auxílio são sempre puníveis de forma autônoma, ainda que o crime planejado não chegue sequer a ser tentado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Como regra, o ajuste, a determinação ou instigação e o auxílio não são puníveis se o crime não chega, pelo menos, a ser tentado, ressalvada disposição legal em contrário.","referencia":"CPM, art. 54.","tags":["concurso de agentes","instigação","tentativa"]},{"id":"DPM011","area":"Noções de Direito Penal Militar","tema":"Penas no Direito Penal Militar: visão geral","subtema":"Espécies de penas principais","dificuldade":"facil","enunciado":"O rol vigente de penas principais do CPM compreende morte, reclusão, detenção, prisão e impedimento.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Essas são as penas principais atualmente enumeradas no art. 55 do CPM. As antigas alíneas referentes à suspensão do exercício do posto, graduação, cargo ou função e à reforma foram revogadas pela Lei nº 14.688/2023.","referencia":"CPM, art. 55; Lei nº 14.688/2023.","tags":["penas principais","artigo 55","espécies de pena"]},{"id":"DPM012","area":"Noções de Direito Penal Militar","tema":"Penas no Direito Penal Militar: visão geral","subtema":"Alterações no rol de penas","dificuldade":"intermediaria","enunciado":"A reforma permanece expressamente prevista no art. 55 do CPM como uma das penas principais aplicáveis no Direito Penal Militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A reforma constava do antigo rol de penas principais, mas a respectiva alínea do art. 55 foi revogada pela Lei nº 14.688/2023. Portanto, não integra atualmente o rol de penas principais do dispositivo.","referencia":"CPM, art. 55; Lei nº 14.688/2023.","tags":["reforma","penas principais","Lei 14688"]},{"id":"DPM013","area":"Noções de Direito Penal Militar","tema":"Penas no Direito Penal Militar: visão geral","subtema":"Pena de morte e limites constitucionais","dificuldade":"dificil","enunciado":"Embora o CPM mantenha a pena de morte entre as penas principais e estabeleça sua execução por fuzilamento, a Constituição Federal não admite sua aplicação em tempo de paz, pois somente excepciona a vedação à pena de morte no caso de guerra declarada.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O art. 55 do CPM inclui a morte entre as penas principais e o art. 56 prevê sua execução por fuzilamento. A Constituição Federal, entretanto, veda a pena de morte, salvo em caso de guerra declarada, nos termos do art. 84, XIX.","referencia":"CPM, arts. 55, a, e 56; Constituição Federal, art. 5º, XLVII, a.","tags":["pena de morte","guerra declarada","limite constitucional"]},{"id":"DPM014","area":"Noções de Direito Penal Militar","tema":"Penas principais","subtema":"Limites genéricos de reclusão e detenção","dificuldade":"facil","enunciado":"Segundo o CPM, o mínimo genérico da pena de reclusão é de dois anos e o máximo é de trinta anos, enquanto a pena de detenção possui mínimo genérico de trinta dias e máximo de dez anos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item erra o mínimo genérico da reclusão. O CPM estabelece mínimo de um ano e máximo de trinta anos para a reclusão; para a detenção, mínimo de trinta dias e máximo de dez anos.","referencia":"CPM, art. 58.","tags":["reclusão","detenção","limites da pena"]},{"id":"DPM015","area":"Noções de Direito Penal Militar","tema":"Penas principais","subtema":"Conversão em pena de prisão","dificuldade":"intermediaria","enunciado":"A pena de reclusão ou de detenção de até dois anos aplicada a militar é convertida em pena de prisão quando não for cabível a suspensão condicional da pena, observadas as regras próprias de cumprimento estabelecidas no CPM.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O art. 59 determina a conversão da pena de reclusão ou detenção de até dois anos aplicada a militar em pena de prisão quando não for cabível a suspensão condicional, disciplinando também o modo de cumprimento por oficial e por praça.","referencia":"CPM, art. 59.","tags":["pena de prisão","militar","conversão da pena"]},{"id":"DPM016","area":"Noções de Direito Penal Militar","tema":"Penas principais","subtema":"Pena de impedimento","dificuldade":"dificil","enunciado":"A pena de impedimento obriga o condenado a permanecer em estabelecimento penal militar, afastado de sua unidade e de qualquer atividade de instrução militar durante todo o cumprimento da sanção.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item contraria o art. 63 do CPM. A pena de impedimento sujeita o condenado a permanecer no recinto da unidade e não prejudica a instrução militar.","referencia":"CPM, art. 63.","tags":["impedimento","recinto da unidade","pena principal"]},{"id":"DPM017","area":"Noções de Direito Penal Militar","tema":"Penas acessórias","subtema":"Espécies de penas acessórias","dificuldade":"facil","enunciado":"Entre as penas acessórias previstas pelo CPM estão a perda de posto e patente, a exclusão das Forças Armadas, a inabilitação para o exercício de função pública e a suspensão dos direitos políticos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Todas as sanções mencionadas integram o rol de penas acessórias previsto no art. 98 do CPM.","referencia":"CPM, art. 98, I, IV, VI e VIII.","tags":["penas acessórias","artigo 98","direitos políticos"]},{"id":"DPM018","area":"Noções de Direito Penal Militar","tema":"Penas acessórias","subtema":"Perda de posto e patente","dificuldade":"intermediaria","enunciado":"A condenação de oficial a pena privativa de liberdade superior a dois anos acarreta, por si só e de forma automática, a perda do posto e da patente, sendo dispensado o julgamento constitucionalmente previsto para essa consequência.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O item está errado. O art. 99 do CPM condiciona a perda de posto e patente à submissão do oficial ao julgamento constitucionalmente previsto. Para os militares dos Estados, a Constituição também atribui ao tribunal competente a decisão sobre a perda do posto e da patente dos oficiais.","referencia":"CPM, art. 99; Constituição Federal, arts. 42, § 1º, 125, § 4º, e 142, § 3º, VI e VII.","tags":["posto e patente","oficial","pena acessória"]},{"id":"DPM019","area":"Noções de Direito Penal Militar","tema":"Aplicação da pena","subtema":"Fixação da pena-base","dificuldade":"intermediaria","enunciado":"Na fixação da pena privativa de liberdade, o juiz deve considerar, entre outros elementos previstos no CPM, a intensidade do dolo ou o grau da culpa, a extensão do dano ou perigo de dano, os motivos, os antecedentes e as circunstâncias de tempo e lugar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O art. 69 do CPM determina que o juiz aprecie a gravidade do crime e a personalidade do réu e considere, entre outros fatores, os elementos indicados no enunciado.","referencia":"CPM, art. 69.","tags":["dosimetria","pena-base","artigo 69"]},{"id":"DPM020","area":"Noções de Direito Penal Militar","tema":"Aplicação da pena","subtema":"Quantum de agravantes e atenuantes","dificuldade":"intermediaria","enunciado":"Quando a lei militar determina agravamento ou atenuação da pena sem indicar o respectivo quantum, o juiz deve obrigatoriamente fixar a variação entre um sexto e metade da pena.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O CPM estabelece faixa diversa. Quando a lei determina agravação ou atenuação sem mencionar o quantum, o juiz deve fixá-lo entre um quinto e um terço, guardados os limites da pena cominada ao crime.","referencia":"CPM, art. 73.","tags":["agravantes","atenuantes","dosimetria"]},{"id":"DPM021","area":"Noções de Direito Penal Militar","tema":"Aplicação da pena","subtema":"Sistema de cálculo da pena","dificuldade":"dificil","enunciado":"Após a Lei nº 14.688/2023, o CPM passou a prever expressamente que a pena-base é fixada conforme o art. 69, seguindo-se a consideração das circunstâncias atenuantes e agravantes e, por último, das causas de diminuição e de aumento da pena.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A redação vigente do art. 77 explicita essa sequência para o cálculo da pena: pena-base; circunstâncias atenuantes e agravantes; e, por último, causas de diminuição e de aumento.","referencia":"CPM, art. 77, com redação dada pela Lei nº 14.688/2023.","tags":["cálculo da pena","dosimetria","Lei 14688"]},{"id":"DPM022","area":"Noções de Direito Penal Militar","tema":"Efeitos da condenação","subtema":"Perda de instrumentos do crime","dificuldade":"facil","enunciado":"Como efeito da condenação, todo instrumento utilizado na prática do crime é necessariamente perdido em favor da Fazenda Pública, ainda que seja objeto lícito e pertença a terceiro de boa-fé.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A perda não alcança indistintamente qualquer instrumento. O CPM prevê a perda dos instrumentos do crime quando consistirem em coisas cujo fabrico, alienação, uso, porte ou detenção constitua fato ilícito, ressalvado o direito do lesado ou de terceiro de boa-fé.","referencia":"CPM, art. 109, II, a.","tags":["efeitos da condenação","instrumentos do crime","Fazenda Pública"]},{"id":"DPM023","area":"Noções de Direito Penal Militar","tema":"Efeitos da condenação","subtema":"Reparação do dano e perda do produto do crime","dificuldade":"intermediaria","enunciado":"Constituem efeitos da condenação previstos no CPM tornar certa a obrigação de reparar o dano resultante do crime e, ressalvados os direitos do lesado ou de terceiro de boa-fé, determinar a perda em favor da Fazenda Pública do produto do crime ou de bem ou valor que constitua proveito obtido com sua prática.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O enunciado corresponde aos efeitos da condenação disciplinados no art. 109 do CPM, inclusive quanto à ressalva destinada à proteção do lesado e do terceiro de boa-fé.","referencia":"CPM, art. 109, I e II, b.","tags":["reparação do dano","produto do crime","efeitos da condenação"]},{"id":"DPM024","area":"Noções de Direito Penal Militar","tema":"Medidas de segurança","subtema":"Espécies de medidas de segurança","dificuldade":"intermediaria","enunciado":"O CPM admite exclusivamente medidas de segurança pessoais e detentivas, não contemplando medidas pessoais não detentivas nem medidas de natureza patrimonial.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"As medidas de segurança podem ser pessoais ou patrimoniais. As pessoais subdividem-se em detentivas e não detentivas, enquanto as patrimoniais compreendem a interdição de estabelecimento ou sede de sociedade ou associação e o confisco.","referencia":"CPM, art. 110, §§ 1º e 2º.","tags":["medidas de segurança","medidas patrimoniais","medidas pessoais"]},{"id":"DPM025","area":"Noções de Direito Penal Militar","tema":"Medidas de segurança","subtema":"Inimputabilidade e internação","dificuldade":"dificil","enunciado":"Quando o agente for inimputável nos termos do art. 48 do CPM, o juiz poderá determinar sua internação em estabelecimento de custódia e tratamento, sendo que a internação ou o tratamento ambulatorial terá prazo mínimo de um a três anos e poderá perdurar enquanto não for constatada, mediante perícia médica, a cessação da periculosidade.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A redação vigente do art. 112 permite a internação do inimputável. O § 1º prevê que a internação ou o tratamento ambulatorial será por tempo indeterminado enquanto não for averiguada a cessação da periculosidade, observado prazo mínimo de um a três anos.","referencia":"CPM, art. 112, caput e §§ 1º e 2º.","tags":["inimputabilidade","internação","periculosidade"]},{"id":"DPM026","area":"Noções de Direito Penal Militar","tema":"Ação penal no Direito Penal Militar","subtema":"Ação privada subsidiária","dificuldade":"facil","enunciado":"No sistema atual do CPM, a ação penal militar somente pode ser promovida pelo Ministério Público, sendo absolutamente vedado ao ofendido ajuizar ação privada quando a ação pública não for proposta no prazo legal.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A Lei nº 14.688/2023 alterou o art. 121 do CPM e passou a admitir expressamente ação privada quando a ação pública não for intentada no prazo legal.","referencia":"CPM, art. 121 e parágrafo único.","tags":["ação penal","ação privada subsidiária","Ministério Público"]},{"id":"DPM027","area":"Noções de Direito Penal Militar","tema":"Ação penal no Direito Penal Militar","subtema":"Dependência de requisição","dificuldade":"intermediaria","enunciado":"Nos crimes previstos nos arts. 136 a 141 do CPM, quando o agente for militar, a ação penal depende da requisição do Comando da Força a que ele estiver subordinado; no caso do art. 141, se o agente for civil e não houver coautor militar, a requisição será do Ministério da Justiça.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A assertiva corresponde à redação vigente do art. 122 do CPM.","referencia":"CPM, art. 122, com redação dada pela Lei nº 14.688/2023.","tags":["requisição","ação penal militar","artigo 122"]},{"id":"DPM028","area":"Noções de Direito Penal Militar","tema":"Extinção da punibilidade","subtema":"Ressarcimento do dano","dificuldade":"facil","enunciado":"No CPM, o ressarcimento do dano extingue a punibilidade de qualquer modalidade de peculato, inclusive do peculato doloso, desde que realizado antes do trânsito em julgado da condenação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A causa extintiva refere-se especificamente ao peculato culposo. Nessa modalidade, a reparação do dano, se precede a sentença irrecorrível, extingue a punibilidade; se posterior, reduz de metade a pena imposta.","referencia":"CPM, art. 123, VI, c/c art. 303, §§ 3º e 4º.","tags":["extinção da punibilidade","peculato culposo","ressarcimento"]},{"id":"DPM029","area":"Noções de Direito Penal Militar","tema":"Extinção da punibilidade","subtema":"Espécies de prescrição","dificuldade":"intermediaria","enunciado":"Segundo a redação vigente do Código Penal Militar, a prescrição refere-se apenas à pretensão punitiva, não alcançando a pretensão executória.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O art. 124 do CPM estabelece expressamente que a prescrição se refere à pretensão punitiva ou à pretensão executória.","referencia":"CPM, art. 124, com redação dada pela Lei nº 14.688/2023.","tags":["prescrição","pretensão punitiva","pretensão executória"]},{"id":"DPM030","area":"Noções de Direito Penal Militar","tema":"Extinção da punibilidade","subtema":"Prazo prescricional","dificuldade":"intermediaria","enunciado":"Se o máximo da pena privativa de liberdade cominada ao crime militar for inferior a um ano, a prescrição da pretensão punitiva ocorrerá em dois anos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Após a Lei nº 14.688/2023, o CPM prevê prazo de três anos para a prescrição da pretensão punitiva quando o máximo da pena privativa de liberdade cominada ao crime for inferior a um ano.","referencia":"CPM, art. 125, VII.","tags":["prescrição","prazo prescricional","Lei 14688"]},{"id":"DPM031","area":"Noções de Direito Penal Militar","tema":"Crimes militares em tempo de paz","subtema":"Hipóteses do art. 9º","dificuldade":"facil","enunciado":"O art. 9º do CPM contém as hipóteses legais utilizadas para identificar os crimes militares em tempo de paz.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O art. 9º do CPM é o dispositivo central de definição dos crimes militares em tempo de paz e deve ser interpretado conforme seus incisos, alíneas e parágrafos.","referencia":"CPM, art. 9º.","tags":["crime militar em tempo de paz","artigo 9","classificação"]},{"id":"DPM032","area":"Noções de Direito Penal Militar","tema":"Crimes militares em tempo de paz","subtema":"Militar da ativa e circunstâncias do fato","dificuldade":"intermediaria","enunciado":"Se um policial militar da ativa, durante sua folga, fora de lugar sujeito à administração militar e por motivo exclusivamente particular, pratica uma infração penal contra um civil, a conduta será necessariamente crime militar pelo simples fato de o autor possuir a condição de militar da ativa.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A condição de militar da ativa não militariza automaticamente toda infração penal. É indispensável verificar o enquadramento do fato em uma das hipóteses do art. 9º do CPM. Os dados narrados afastam a conclusão automática pretendida pelo item.","referencia":"CPM, art. 9º, especialmente inciso II.","tags":["militar da ativa","crime comum","artigo 9"]},{"id":"DPM033","area":"Noções de Direito Penal Militar","tema":"Crimes militares em tempo de paz","subtema":"Militar em serviço contra civil","dificuldade":"dificil","enunciado":"Um policial militar, enquanto efetivamente em serviço e atuando em razão de sua função, pratica contra civil conduta tipificada na legislação penal e abrangida pela hipótese do art. 9º, II, c, do CPM. Presentes os demais elementos do tipo, o fato pode ser classificado como crime militar em tempo de paz ainda que tenha ocorrido fora de lugar sujeito à administração militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O art. 9º, II, c, alcança crimes previstos no CPM ou na legislação penal quando praticados por militar em serviço ou atuando em razão da função contra militar da reserva ou reformado ou contra civil, ainda que fora de lugar sujeito à administração militar.","referencia":"CPM, art. 9º, II, c.","tags":["militar em serviço","civil","crime militar em tempo de paz"]},{"id":"DPM034","area":"Noções de Direito Penal Militar","tema":"Crimes propriamente militares","subtema":"Qualidade militar do agente","dificuldade":"intermediaria","enunciado":"Segundo a classificação doutrinária tradicional, crime propriamente militar é aquele que pode ser cometido indistintamente por militar ou civil, bastando que a conduta seja praticada dentro de quartel ou de outro local sujeito à administração militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Na classificação doutrinária tradicional, o crime propriamente militar é ligado de forma específica à condição militar do agente e aos deveres próprios da vida castrense. A mera prática de uma infração em local sujeito à administração militar não basta para transformá-la em crime propriamente militar.","referencia":"Constituição Federal, art. 5º, LXI; CPM, arts. 9º e 187.","tags":["crime propriamente militar","qualidade do agente","vida castrense"]},{"id":"DPM035","area":"Noções de Direito Penal Militar","tema":"Crimes propriamente militares","subtema":"Deserção","dificuldade":"dificil","enunciado":"A deserção constitui exemplo clássico de crime propriamente militar, pois sua configuração pressupõe a qualidade de militar do agente e decorre de violação diretamente relacionada ao dever militar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A deserção do art. 187 do CPM exige a condição de militar do sujeito ativo e é tradicionalmente classificada como crime propriamente militar.","referencia":"CPM, art. 187; Constituição Federal, art. 5º, LXI.","tags":["deserção","crime propriamente militar","dever militar"]},{"id":"DPM036","area":"Noções de Direito Penal Militar","tema":"Crimes impropriamente militares","subtema":"Conceito","dificuldade":"intermediaria","enunciado":"Na classificação doutrinária tradicional, os crimes impropriamente militares são necessariamente infrações exclusivas do Código Penal Militar, sem qualquer correspondência com infrações previstas na legislação penal comum.","alternativas":{"A":"CERTO","B":"ERRADO"},"gab
