postos","dificuldade":"dificil","enunciado":"Um capital de R$ 5.000 é aplicado por 3 anos à taxa de 10% ao ano. Comparando uma aplicação a juros compostos com outra, de mesmo capital, taxa e prazo, a juros simples, a diferença entre os montantes finais será de R$ 165. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Nos juros compostos: M = 5.000 × (1,10)^3 = 5.000 × 1,331 = 6.655. Nos juros simples: M = 5.000 × (1 + 0,10 × 3) = 5.000 × 1,30 = 6.500. A diferença é 6.655 - 6.500 = 155. Como o resultado não é R$ 165, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 032 — Juros compostos","tags":["juros compostos","juros simples","comparação de montantes"]},{"id":"MAT025","area":"Matemática","tema":"Capitalização","subtema":"Capitalização periódica","dificuldade":"intermediaria","enunciado":"Um capital de R$ 2.000 é remunerado à taxa de 8% por semestre, com incorporação dos juros ao capital ao fim de cada semestre. Após dois semestres, o montante será de R$ 2.332,80. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Como os juros são incorporados ao capital a cada semestre, aplica-se capitalização composta: M = 2.000 × (1,08)^2. Como (1,08)^2 = 1,1664, temos M = 2.332,80. O resultado coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 033 — Capitalização","tags":["capitalização","incorporação de juros","montante"]},{"id":"MAT026","area":"Matemática","tema":"Capitalização","subtema":"Efeito da capitalização sucessiva","dificuldade":"dificil","enunciado":"Uma aplicação rende 1% ao mês, com capitalização mensal, durante 12 meses. Nessa situação, a taxa acumulada no período é inferior a 12,5%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A taxa acumulada é (1,01)^12 - 1. Como (1,01)^12 ≈ 1,126825, a taxa acumulada é aproximadamente 12,6825%. Esse resultado é superior a 12,5%. Portanto, a afirmação está incorreta. Logo, o item está ERRADO.","referencia":"MAPA 033 — Capitalização","tags":["capitalização mensal","taxa acumulada","juros compostos"]},{"id":"MAT027","area":"Matemática","tema":"Descontos","subtema":"Desconto percentual simples sobre preço","dificuldade":"facil","enunciado":"Um equipamento com preço de R$ 800 recebe desconto de 15% para pagamento à vista. Nessa situação, o preço final será de R$ 690. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"O desconto é 15% de 800: 0,15 × 800 = 120. O preço final é 800 - 120 = 680. Como o valor final é R$ 680, e não R$ 690, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 034 — Descontos","tags":["desconto","porcentagem","preço final"]},{"id":"MAT028","area":"Matemática","tema":"Descontos","subtema":"Descontos sucessivos","dificuldade":"intermediaria","enunciado":"Um produto de R$ 500 recebe dois descontos sucessivos, de 10% e 20%. Nessa situação, o preço final será de R$ 360, o que corresponde a um desconto total equivalente de 28% sobre o preço original. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Após 10% de desconto: 500 × 0,90 = 450. Aplicando mais 20%: 450 × 0,80 = 360. A redução total foi 500 - 360 = 140, e 140 ÷ 500 = 0,28 = 28%. Portanto, preço final e desconto equivalente estão corretos. Logo, o item está CERTO.","referencia":"MAPA 034 — Descontos","tags":["descontos sucessivos","desconto equivalente","porcentagem"]},{"id":"MAT029","area":"Matemática","tema":"Taxa de juros nominal","subtema":"Conversão proporcional da taxa nominal","dificuldade":"intermediaria","enunciado":"Uma aplicação informa taxa nominal de 24% ao ano, com capitalização mensal. Nessa situação, a taxa mensal utilizada em cada capitalização é de 1,8% ao mês. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Na taxa nominal anual com capitalização mensal, divide-se a taxa nominal por 12 para obter a taxa por período de capitalização: 24% ÷ 12 = 2% ao mês. Como a taxa mensal é 2%, e não 1,8%, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 035 — Taxa de juros nominal","tags":["taxa nominal","capitalização mensal","conversão de taxas"]},{"id":"MAT030","area":"Matemática","tema":"Taxa de juros nominal","subtema":"Taxa nominal com capitalização trimestral","dificuldade":"dificil","enunciado":"Uma aplicação oferece taxa nominal de 18% ao ano, com capitalização trimestral. Considerando dois trimestres de aplicação, a taxa efetivamente acumulada no período será superior a 9,2%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A taxa trimestral proporcional é 18% ÷ 4 = 4,5%. Em dois trimestres, a taxa acumulada é (1,045)^2 - 1 = 1,092025 - 1 = 0,092025 = 9,2025%. Como 9,2025% é superior a 9,2%, a afirmação é verdadeira. Logo, o item está CERTO.","referencia":"MAPA 035 — Taxa de juros nominal","tags":["taxa nominal","capitalização trimestral","taxa acumulada"]},{"id":"MAT031","area":"Matemática","tema":"Taxa de juros efetiva","subtema":"Taxa efetiva acumulada","dificuldade":"intermediaria","enunciado":"Uma taxa efetiva de 2% ao mês produz, em dois meses, uma taxa efetiva acumulada de 4,04%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Taxas efetivas sucessivas são compostas: (1,02)^2 - 1 = 1,0404 - 1 = 0,0404 = 4,04%. O resultado é exatamente o informado. Logo, o item está CERTO.","referencia":"MAPA 036 — Taxa de juros efetiva","tags":["taxa efetiva","taxa acumulada","composição de taxas"]},{"id":"MAT032","area":"Matemática","tema":"Taxa de juros efetiva","subtema":"Conversão de taxa efetiva anual para semestral","dificuldade":"dificil","enunciado":"Uma taxa efetiva anual de 21% corresponde, em regime composto, a uma taxa efetiva semestral equivalente de 10,5%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Se i é a taxa semestral equivalente, então (1 + i)^2 = 1,21. Como 1,10^2 = 1,21, temos i = 0,10 = 10% ao semestre. Como a taxa equivalente é 10%, e não 10,5%, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 036 — Taxa de juros efetiva","tags":["taxa efetiva","equivalência de taxas","taxa semestral"]},{"id":"MAT033","area":"Matemática","tema":"Taxas de juros equivalentes","subtema":"Equivalência entre taxa semestral e anual","dificuldade":"intermediaria","enunciado":"Uma taxa efetiva de 10% ao semestre é equivalente, em regime composto, a uma taxa efetiva de 21% ao ano. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Dois semestres compõem um ano. A taxa anual equivalente é (1,10)^2 - 1 = 1,21 - 1 = 0,21 = 21%. O resultado coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 037 — Taxas de juros equivalentes","tags":["taxas equivalentes","taxa semestral","taxa anual"]},{"id":"MAT034","area":"Matemática","tema":"Taxas de juros equivalentes","subtema":"Equivalência entre taxa trimestral e semestral","dificuldade":"dificil","enunciado":"Uma taxa efetiva de 21% ao trimestre é equivalente, em regime composto, a uma taxa efetiva de 44,1% ao semestre. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Um semestre contém dois trimestres. Logo, a taxa semestral equivalente é (1,21)^2 - 1 = 1,4641 - 1 = 0,4641 = 46,41%. Como 46,41% é diferente de 44,1%, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 037 — Taxas de juros equivalentes","tags":["taxas equivalentes","taxa trimestral","taxa semestral"]},{"id":"MAT035","area":"Matemática","tema":"Taxas de juros proporcionais","subtema":"Conversão proporcional anual para mensal","dificuldade":"facil","enunciado":"Considerando taxas proporcionais, uma taxa de 24% ao ano corresponde a 1,5% ao mês. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Em taxas proporcionais, divide-se a taxa anual por 12: 24% ÷ 12 = 2% ao mês. Como o valor proporcional é 2%, e não 1,5%, a afirmação está incorreta. Logo, o item está ERRADO.","referencia":"MAPA 038 — Taxas de juros proporcionais","tags":["taxas proporcionais","taxa anual","taxa mensal"]},{"id":"MAT036","area":"Matemática","tema":"Taxas de juros proporcionais","subtema":"Conversão proporcional mensal para período de cinco meses","dificuldade":"intermediaria","enunciado":"Considerando apenas proporcionalidade linear de taxas, uma taxa de 3% ao mês é proporcional a 15% para um período de cinco meses. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Para taxas proporcionais, multiplica-se a taxa pelo número de períodos: 3% × 5 = 15%. O resultado coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 038 — Taxas de juros proporcionais","tags":["taxas proporcionais","taxa mensal","conversão de taxas"]},{"id":"MAT037","area":"Matemática","tema":"Taxa de juros real","subtema":"Cálculo da taxa real com inflação","dificuldade":"intermediaria","enunciado":"Em determinado período, uma aplicação teve rendimento aparente de 10%, enquanto a inflação foi de 4%. Nessa situação, a taxa real de rendimento foi superior a 5,7%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A taxa real satisfaz 1 + i_real = (1 + i_aparente)/(1 + inflação). Assim, 1 + i_real = 1,10/1,04 = 55/52. Logo, i_real = 3/52 ≈ 0,057692 = 5,7692%. Como esse valor é superior a 5,7%, a afirmação é verdadeira. Logo, o item está CERTO.","referencia":"MAPA 039 — Taxa de juros real","tags":["taxa real","inflação","taxa aparente"]},{"id":"MAT038","area":"Matemática","tema":"Taxa de juros real","subtema":"Relação entre taxa real, inflação e taxa aparente","dificuldade":"dificil","enunciado":"Se a taxa real de rendimento de uma aplicação for de 5% e a inflação do mesmo período for de 10%, então a taxa aparente de rendimento será de 15%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A relação correta é 1 + i_aparente = (1 + i_real)(1 + inflação). Assim, 1 + i_aparente = 1,05 × 1,10 = 1,155. Logo, i_aparente = 15,5%. Como a taxa aparente é 15,5%, e não 15%, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 039 — Taxa de juros real","tags":["taxa real","inflação","taxa aparente"]},{"id":"MAT039","area":"Matemática","tema":"Taxa de juros aparente","subtema":"Composição entre taxa real e inflação","dificuldade":"intermediaria","enunciado":"Em um período em que a taxa real de rendimento foi de 8% e a inflação foi de 5%, a taxa aparente de rendimento foi de 13%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A taxa aparente é obtida por 1 + i_aparente = 1,08 × 1,05 = 1,134. Portanto, i_aparente = 0,134 = 13,4%. Como o valor correto é 13,4%, e não 13%, a afirmação é falsa. Logo, o item está ERRADO.","referencia":"MAPA 040 — Taxa de juros aparente","tags":["taxa aparente","taxa real","inflação"]},{"id":"MAT040","area":"Matemática","tema":"Taxa de juros aparente","subtema":"Determinação da taxa real a partir da taxa aparente","dificuldade":"dificil","enunciado":"Uma aplicação apresentou taxa aparente de 26,5% em um período no qual a inflação foi de 10%. Nessa situação, a taxa real de rendimento foi de 15%. Julgue o item.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Usando 1 + i_real = (1 + i_aparente)/(1 + inflação), temos 1 + i_real = 1,265/1,10 = 1,15. Portanto, i_real = 0,15 = 15%. O valor coincide com a afirmação. Logo, o item está CERTO.","referencia":"MAPA 040 — Taxa de juros aparente","tags":["taxa aparente","taxa real","inflação"]}],"informatica":[{"id":"INF001","area":"Noções de Informática","tema":"MAPA 041 — Sistema operacional: ambiente Windows","subtema":"Lixeira e exclusão de arquivos","dificuldade":"facil","enunciado":"No Windows, quando um arquivo de uma unidade local é enviado normalmente para a Lixeira, ele pode, em regra, ser restaurado ao local original enquanto não tiver sido excluído definitivamente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A Lixeira mantém temporariamente itens excluídos em condições usuais, permitindo restaurá-los ao local de origem. Há exceções, como exclusões permanentes ou situações em que a Lixeira não é utilizada.","referencia":"Microsoft Support — Recycle Bin in Windows","tags":["Windows","Lixeira","arquivos"]},{"id":"INF002","area":"Noções de Informática","tema":"MAPA 041 — Sistema operacional: ambiente Windows","subtema":"Atalho versus arquivo","dificuldade":"intermediaria","enunciado":"Ao excluir um atalho existente na área de trabalho do Windows, o arquivo, a pasta ou o programa para o qual esse atalho aponta também é necessariamente excluído do computador.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Um atalho é uma referência para outro objeto. Excluir o atalho não implica excluir o arquivo, a pasta ou o programa de destino.","referencia":"Microsoft Support — Create desktop shortcuts in Windows","tags":["Windows","atalho","arquivos"]},{"id":"INF003","area":"Noções de Informática","tema":"MAPA 042 — Microsoft Word","subtema":"Localizar e substituir","dificuldade":"facil","enunciado":"No Microsoft Word, o recurso Localizar e Substituir pode ser usado para procurar uma expressão no documento e substituí-la por outra em múltiplas ocorrências.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Localizar e Substituir permite pesquisar texto e efetuar substituições, inclusive em várias ocorrências, sem exigir edição manual de cada trecho.","referencia":"Microsoft Support — Find and replace text in Word","tags":["Word","localizar","substituir"]},{"id":"INF004","area":"Noções de Informática","tema":"MAPA 042 — Microsoft Word","subtema":"Quebras de página e formatação","dificuldade":"intermediaria","enunciado":"Inserir várias linhas em branco com a tecla Enter é equivalente, para fins de estrutura do documento, a inserir uma quebra de página no Word, pois ambos os procedimentos mantêm o início da página seguinte estável diante de alterações no texto anterior.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Linhas em branco podem se deslocar quando o texto anterior muda. A quebra de página cria uma separação estrutural própria e é a forma adequada de iniciar conteúdo na página seguinte.","referencia":"Microsoft Support — Insert a page break in Word","tags":["Word","quebra de página","formatação"]},{"id":"INF005","area":"Noções de Informática","tema":"MAPA 043 — Microsoft Excel","subtema":"Fórmula de soma","dificuldade":"facil","enunciado":"Em uma planilha do Microsoft Excel, a fórmula =SOMA(A1:A5) calcula a soma dos valores contidos nas células de A1 até A5, inclusive.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O operador de intervalo ':' abrange todas as células entre os extremos informados. Assim, A1:A5 inclui A1, A2, A3, A4 e A5.","referencia":"Microsoft Support — SUM function","tags":["Excel","SOMA","fórmula"]},{"id":"INF006","area":"Noções de Informática","tema":"MAPA 043 — Microsoft Excel","subtema":"Referências relativas e absolutas","dificuldade":"intermediaria","enunciado":"Se a célula B1 contiver a fórmula =$A$1*2 e essa fórmula for copiada para B2, a referência será ajustada automaticamente para =$A$2*2, pois toda referência de célula no Excel é relativa por padrão, mesmo quando contém cifrões.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Os cifrões tornam a referência absoluta. Ao copiar a fórmula, $A$1 permanece fixo, de modo que a fórmula copiada continuará referenciando $A$1.","referencia":"Microsoft Support — Switch between relative, absolute, and mixed references","tags":["Excel","referência absoluta","fórmula"]},{"id":"INF007","area":"Noções de Informática","tema":"MAPA 044 — Microsoft PowerPoint","subtema":"Apresentação de slides","dificuldade":"facil","enunciado":"No Microsoft PowerPoint, uma apresentação pode conter elementos como texto, imagens, tabelas, gráficos e outros objetos distribuídos em slides.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O PowerPoint admite a composição de slides com diversos tipos de conteúdo, incluindo texto, imagens, tabelas e gráficos.","referencia":"Microsoft Support — Basic tasks for creating a PowerPoint presentation","tags":["PowerPoint","slides","objetos"]},{"id":"INF008","area":"Noções de Informática","tema":"MAPA 044 — Microsoft PowerPoint","subtema":"Transição versus animação","dificuldade":"intermediaria","enunciado":"No PowerPoint, transição e animação são sinônimos: ambas designam exclusivamente efeitos aplicados à passagem de um objeto do slide para outro.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Transições são efeitos associados à passagem entre slides; animações são efeitos aplicados a objetos dentro de um slide. São recursos distintos.","referencia":"Microsoft Support — Add, change, or remove transitions between slides; Animate text or objects","tags":["PowerPoint","transição","animação"]},{"id":"INF009","area":"Noções de Informática","tema":"MAPA 045 — Redes de computadores","subtema":"LAN e alcance","dificuldade":"facil","enunciado":"Uma rede local, ou LAN, é normalmente utilizada para interligar dispositivos em uma área geográfica limitada, como uma residência, um escritório ou um prédio.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"LAN caracteriza uma rede de alcance local, em oposição a redes de maior abrangência geográfica.","referencia":"Cisco — What Is a LAN?","tags":["redes","LAN","conectividade"]},{"id":"INF010","area":"Noções de Informática","tema":"MAPA 045 — Redes de computadores","subtema":"Endereçamento IP","dificuldade":"intermediaria","enunciado":"Em uma rede IP doméstica, todos os dispositivos precisam obrigatoriamente possuir o mesmo endereço IP para que consigam se comunicar por meio do roteador.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Dispositivos de uma mesma rede devem, em condições normais, possuir endereços IP distintos. Endereços duplicados podem causar conflitos e impedir a comunicação adequada.","referencia":"Cisco — IP Addressing Fundamentals; IETF RFC 1918","tags":["redes","IP","roteador"]},{"id":"INF011","area":"Noções de Informática","tema":"MAPA 046 — Internet e intranet","subtema":"Conceito de intranet","dificuldade":"facil","enunciado":"Uma intranet pode utilizar tecnologias típicas da Internet, como TCP/IP e navegadores web, mas restringir seu acesso a usuários autorizados de uma organização.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A intranet emprega tecnologias de rede e web semelhantes às da Internet, porém é destinada a um ambiente organizacional controlado.","referencia":"NIST Glossary — Intranet; IETF — TCP/IP standards","tags":["internet","intranet","TCP/IP"]},{"id":"INF012","area":"Noções de Informática","tema":"MAPA 046 — Internet e intranet","subtema":"Internet versus intranet","dificuldade":"intermediaria","enunciado":"Por definição, uma intranet deve estar totalmente desconectada da Internet e não pode permitir acesso remoto por VPN, pois qualquer conexão externa faria com que ela deixasse de ser uma intranet.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Uma intranet pode ter conexão com a Internet e admitir acesso remoto seguro, por exemplo via VPN. O que a caracteriza é o uso restrito ao ambiente organizacional autorizado.","referencia":"NIST Glossary — Intranet; NIST SP 800-46 Rev. 2","tags":["internet","intranet","VPN"]},{"id":"INF013","area":"Noções de Informática","tema":"MAPA 047 — Edge, Firefox, Chrome e similares","subtema":"Função do navegador","dificuldade":"facil","enunciado":"Microsoft Edge, Mozilla Firefox e Google Chrome são exemplos de navegadores web usados para acessar e interagir com conteúdos e aplicações disponíveis na Web.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Esses programas são navegadores web, isto é, clientes usados para solicitar, exibir e interagir com recursos da Web.","referencia":"MDN Web Docs — What is a web browser?","tags":["navegador","Chrome","Firefox"]},{"id":"INF014","area":"Noções de Informática","tema":"MAPA 047 — Edge, Firefox, Chrome e similares","subtema":"Navegador versus mecanismo de busca","dificuldade":"intermediaria","enunciado":"Google Chrome e Google Search são o mesmo tipo de software, pois ambos são navegadores instalados localmente para exibir páginas da Internet.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Chrome é um navegador. Google Search é um mecanismo de busca acessado por meio de um navegador ou de outros clientes. São categorias distintas.","referencia":"Google Chrome Help; Google Search Help; MDN Web Docs","tags":["navegador","mecanismo de busca","Chrome"]},{"id":"INF015","area":"Noções de Informática","tema":"MAPA 048 — Microsoft Outlook","subtema":"Campos de destinatário","dificuldade":"facil","enunciado":"Em uma mensagem de e-mail, o campo Cco, também chamado de cópia oculta, pode ser usado para enviar uma cópia a destinatários sem revelar esses endereços aos demais destinatários da mensagem.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O campo Cco/Bcc oculta dos demais destinatários os endereços inseridos nesse campo.","referencia":"Microsoft Support — Show, hide, and view the Bcc field","tags":["Outlook","Cco","e-mail"]},{"id":"INF016","area":"Noções de Informática","tema":"MAPA 048 — Microsoft Outlook","subtema":"Anexos e links","dificuldade":"intermediaria","enunciado":"Ao receber no Outlook um e-mail com um arquivo anexado, o fato de a mensagem ter sido entregue na caixa de entrada garante que o anexo é seguro para abertura, pois o servidor de e-mail elimina integralmente qualquer risco de malware.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A entrega do e-mail não garante que anexos sejam seguros. Anexos podem conter conteúdo malicioso, e o usuário deve adotar procedimentos de segurança antes de abri-los.","referencia":"Microsoft Support — Protect yourself from phishing; CISA — Phishing Guidance","tags":["Outlook","anexo","segurança"]},{"id":"INF017","area":"Noções de Informática","tema":"MAPA 049 — Sítios de busca e pesquisa","subtema":"Mecanismos de busca","dificuldade":"facil","enunciado":"Um mecanismo de busca na Web permite localizar páginas e outros conteúdos a partir de termos de pesquisa, sem que o usuário precise conhecer previamente o endereço exato de cada página.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Mecanismos de busca indexam e recuperam conteúdos com base em consultas, facilitando a localização de recursos na Web.","referencia":"Google Search Help — How Search works; Microsoft Bing Help","tags":["busca","pesquisa","web"]},{"id":"INF018","area":"Noções de Informática","tema":"MAPA 049 — Sítios de busca e pesquisa","subtema":"Operadores e precisão da busca","dificuldade":"intermediaria","enunciado":"Colocar uma expressão entre aspas em um mecanismo de busca sempre amplia os resultados, pois instrui o buscador a aceitar qualquer ordem e qualquer variação das palavras digitadas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Em mecanismos que oferecem esse operador, as aspas são usadas para restringir a busca a uma expressão exata ou muito próxima, em vez de ampliar indiscriminadamente os resultados.","referencia":"Google Search Help — Refine web searches","tags":["busca","aspas","pesquisa"]},{"id":"INF019","area":"Noções de Informática","tema":"MAPA 050 — Grupos de discussão","subtema":"Comunicação em grupo","dificuldade":"facil","enunciado":"Grupos de discussão podem ser utilizados para troca de mensagens entre várias pessoas interessadas em um mesmo tema, de forma que uma mensagem enviada ao grupo possa ser distribuída ou disponibilizada aos seus participantes.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"A característica central desses grupos é a comunicação coletiva entre membros em torno de assuntos de interesse comum.","referencia":"Google Groups Help — Learn about Google Groups","tags":["grupos de discussão","mensagens","colaboração"]},{"id":"INF020","area":"Noções de Informática","tema":"MAPA 050 — Grupos de discussão","subtema":"Privacidade e destinatários","dificuldade":"intermediaria","enunciado":"Em um grupo de discussão por e-mail, responder a uma mensagem usando a função 'Responder a todos' garante que a resposta será privada e enviada apenas ao autor original.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Responder a todos pode encaminhar a resposta a vários destinatários, inclusive ao endereço do grupo. Para uma resposta privada, é necessário verificar os destinatários antes do envio.","referencia":"Microsoft Support — Reply to or forward an email message","tags":["grupos de discussão","e-mail","responder a todos"]},{"id":"INF021","area":"Noções de Informática","tema":"MAPA 051 — Redes sociais","subtema":"Privacidade de publicação","dificuldade":"intermediaria","enunciado":"Em redes sociais, ajustar a visibilidade de uma publicação para um público restrito reduz sua exposição direta, mas não elimina completamente o risco de redistribuição do conteúdo por pessoas que tenham acesso a ele.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Controles de audiência limitam quem vê o conteúdo diretamente, mas destinatários autorizados ainda podem copiar, capturar ou redistribuir informações.","referencia":"CISA — Social Media Cybersecurity; NIST — Privacy Framework","tags":["redes sociais","privacidade","compartilhamento"]},{"id":"INF022","area":"Noções de Informática","tema":"MAPA 051 — Redes sociais","subtema":"Engenharia social","dificuldade":"dificil","enunciado":"Se uma mensagem recebida por rede social aparentar vir de um contato conhecido e mencionar informações pessoais corretas sobre o destinatário, isso constitui prova suficiente de autenticidade e elimina a necessidade de confirmar a identidade do remetente antes de clicar em links.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Criminosos podem usar contas comprometidas ou informações públicas para tornar mensagens convincentes. A presença de dados corretos não prova autenticidade; é recomendável verificar a identidade e evitar links suspeitos.","referencia":"CISA — Avoiding Social Engineering and Phishing Attacks","tags":["redes sociais","engenharia social","phishing"]},{"id":"INF023","area":"Noções de Informática","tema":"MAPA 052 — Computação na nuvem","subtema":"Serviços sob demanda","dificuldade":"intermediaria","enunciado":"Computação em nuvem envolve o fornecimento de recursos computacionais por rede, sob demanda, podendo incluir processamento, aplicações, plataformas e armazenamento.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O conceito de cloud computing abrange um conjunto de recursos computacionais compartilhados e configuráveis, disponibilizados sob demanda por rede; armazenamento é apenas uma das possíveis capacidades.","referencia":"NIST SP 800-145 — The NIST Definition of Cloud Computing","tags":["computação em nuvem","cloud","serviços"]},{"id":"INF024","area":"Noções de Informática","tema":"MAPA 052 — Computação na nuvem","subtema":"Cloud computing versus cloud storage","dificuldade":"dificil","enunciado":"Armazenamento em nuvem e computação em nuvem são expressões equivalentes: qualquer serviço de computação em nuvem se limita ao armazenamento remoto de arquivos do usuário.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Armazenamento em nuvem é apenas uma modalidade de serviço. Computação em nuvem é conceito mais amplo, que pode incluir processamento, aplicações, bancos de dados, redes, plataformas e outros recursos.","referencia":"NIST SP 800-145 — The NIST Definition of Cloud Computing","tags":["cloud computing","cloud storage","conceitos"]},{"id":"INF025","area":"Noções de Informática","tema":"MAPA 053 — Organização e gerenciamento de informações, arquivos, pastas e programas","subtema":"Pastas e hierarquia","dificuldade":"intermediaria","enunciado":"Em um sistema de arquivos hierárquico, uma pasta pode conter arquivos e subpastas, permitindo organizar informações em diferentes níveis.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Pastas ou diretórios são usados para agrupar arquivos e outros diretórios, formando uma estrutura hierárquica.","referencia":"Microsoft Learn — File systems and directory structure","tags":["arquivos","pastas","organização"]},{"id":"INF026","area":"Noções de Informática","tema":"MAPA 053 — Organização e gerenciamento de informações, arquivos, pastas e programas","subtema":"Extensão e conteúdo de arquivos","dificuldade":"dificil","enunciado":"Renomear manualmente a extensão de um arquivo de .txt para .jpg converte automaticamente seu conteúdo textual em uma imagem JPEG válida, porque o sistema operacional passa a reestruturar os dados conforme a nova extensão.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Alterar apenas o nome ou a extensão não converte o formato interno do arquivo. Uma conversão real exige software que interprete e grave os dados no novo formato.","referencia":"Microsoft Support — Common file name extensions in Windows","tags":["arquivos","extensão","formato"]},{"id":"INF027","area":"Noções de Informática","tema":"MAPA 054 — Segurança da informação","subtema":"Confidencialidade, integridade e disponibilidade","dificuldade":"intermediaria","enunciado":"Se um invasor altera sem autorização os valores de uma planilha armazenada em um sistema corporativo, o incidente afeta diretamente o princípio de integridade da informação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Integridade está relacionada à exatidão e à ausência de alteração não autorizada. A modificação indevida de dados é uma violação direta desse princípio.","referencia":"NIST SP 800-12 Rev. 1 — An Introduction to Information Security","tags":["segurança da informação","integridade","CIA"]},{"id":"INF028","area":"Noções de Informática","tema":"MAPA 054 — Segurança da informação","subtema":"Autenticação versus autorização","dificuldade":"dificil","enunciado":"Em um sistema corporativo, autenticação é o processo que define quais arquivos um usuário já identificado poderá ler ou alterar, enquanto autorização é o processo de confirmar a identidade desse usuário.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Os conceitos estão invertidos. Autenticação verifica a identidade; autorização determina quais recursos ou ações são permitidos à identidade autenticada.","referencia":"NIST Digital Identity Guidelines; NIST Glossary — Authentication and Authorization","tags":["segurança","autenticação","autorização"]},{"id":"INF029","area":"Noções de Informática","tema":"MAPA 054 — Segurança da informação","subtema":"Princípio do menor privilégio","dificuldade":"dificil","enunciado":"Conceder a um usuário apenas as permissões necessárias para executar suas atividades reduz o impacto potencial de erros ou de comprometimento da conta e é compatível com o princípio do menor privilégio.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O princípio do menor privilégio recomenda limitar permissões ao mínimo necessário, reduzindo a superfície de exposição e o impacto de uso indevido ou comprometimento.","referencia":"NIST SP 800-53 Rev. 5 — AC-6 Least Privilege","tags":["segurança da informação","menor privilégio","acesso"]},{"id":"INF030","area":"Noções de Informática","tema":"MAPA 055 — Procedimentos de segurança da informação","subtema":"Verificação de links","dificuldade":"intermediaria","enunciado":"Ao receber um e-mail inesperado pedindo atualização urgente de senha, a prática mais segura é clicar no link da própria mensagem e conferir se a página solicita as credenciais habituais, pois isso valida a legitimidade do remetente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Links de mensagens inesperadas podem direcionar a páginas de phishing. É mais seguro acessar o serviço por endereço conhecido, aplicativo oficial ou favorito previamente salvo e confirmar a solicitação por canal confiável.","referencia":"CISA — Phishing Guidance; NIST Digital Identity Guidelines","tags":["segurança","phishing","procedimentos"]},{"id":"INF031","area":"Noções de Informática","tema":"MAPA 055 — Procedimentos de segurança da informação","subtema":"MFA e senhas","dificuldade":"dificil","enunciado":"O uso de autenticação multifator pode reduzir o risco de acesso indevido quando uma senha é comprometida, porque exige ao menos um fator adicional de autenticação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"MFA combina dois ou mais fatores de autenticação. Assim, a posse da senha isoladamente pode não ser suficiente para o invasor concluir o acesso.","referencia":"NIST Digital Identity Guidelines; CISA — Multifactor Authentication","tags":["segurança","MFA","autenticação"]},{"id":"INF032","area":"Noções de Informática","tema":"MAPA 056 — Malware, vírus, worms e outras pragas virtuais","subtema":"Vírus versus worm","dificuldade":"intermediaria","enunciado":"Um vírus de computador é definido por se propagar autonomamente pela rede sem depender de arquivo hospedeiro ou de ação do usuário, característica que o distingue de um worm.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"A descrição corresponde ao comportamento típico de um worm. Vírus normalmente se associa a um arquivo ou conteúdo hospedeiro, enquanto worms têm capacidade de propagação autônoma entre sistemas ou redes.","referencia":"NIST SP 800-83 Rev. 1 — Guide to Malware Incident Prevention and Handling for Desktops and Laptops","tags":["malware","vírus","worm"]},{"id":"INF033","area":"Noções de Informática","tema":"MAPA 056 — Malware, vírus, worms e outras pragas virtuais","subtema":"Trojan e engenharia social","dificuldade":"dificil","enunciado":"Um cavalo de Troia pode se apresentar como software aparentemente legítimo para induzir o usuário a executá-lo, sem possuir como característica obrigatória a autorreplicação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Trojan é um programa malicioso disfarçado de conteúdo legítimo. Diferentemente de vírus e worms, sua definição não exige mecanismo de autorreplicação.","referencia":"NIST SP 800-83 Rev. 1 — Guide to Malware Incident Prevention and Handling for Desktops and Laptops","tags":["malware","trojan","engenharia social"]},{"id":"INF034","area":"Noções de Informática","tema":"MAPA 056 — Malware, vírus, worms e outras pragas virtuais","subtema":"Ransomware","dificuldade":"dificil","enunciado":"Ransomware é uma categoria de malware cuja função exclusiva é exibir publicidade indesejada; ele não costuma criptografar arquivos nem restringir o acesso a sistemas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Ransomware busca negar ou restringir o acesso a dados ou sistemas, frequentemente por criptografia, e exige pagamento ou outra condição para restauração. Exibição de anúncios é característica mais associada a adware.","referencia":"CISA — StopRansomware Guide; NIST SP 800-83 Rev. 1","tags":["malware","ransomware","criptografia"]},{"id":"INF035","area":"Noções de Informática","tema":"MAPA 057 — Antivírus, firewall, anti-spyware e aplicativos de segurança","subtema":"Firewall versus antivírus","dificuldade":"intermediaria","enunciado":"Um firewall pode filtrar tráfego de rede conforme regras de segurança, enquanto um antivírus busca detectar, bloquear ou remover software malicioso; por isso, os dois mecanismos desempenham funções distintas e complementares.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Firewall atua principalmente no controle de comunicações de rede; antivírus concentra-se na detecção e resposta a malware. Um não substitui integralmente o outro.","referencia":"NIST SP 800-41 Rev. 1 — Guidelines on Firewalls and Firewall Policy; NIST SP 800-83 Rev. 1","tags":["firewall","antivírus","segurança"]},{"id":"INF036","area":"Noções de Informática","tema":"MAPA 057 — Antivírus, firewall, anti-spyware e aplicativos de segurança","subtema":"Limitações dos mecanismos de proteção","dificuldade":"dificil","enunciado":"Manter um antivírus atualizado torna desnecessárias outras medidas de proteção, como atualização do sistema, cautela com anexos e uso de autenticação multifator, pois um antivírus atualizado impede qualquer comprometimento.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Nenhum mecanismo isolado elimina todos os riscos. Segurança eficaz combina camadas de proteção, como atualização, controles de acesso, MFA, filtragem e comportamento seguro do usuário.","referencia":"CISA — Cybersecurity Best Practices; NIST Cybersecurity Framework 2.0","tags":["antivírus","defesa em profundidade","segurança"]},{"id":"INF037","area":"Noções de Informática","tema":"MAPA 058 — Procedimentos de backup","subtema":"Finalidade do backup","dificuldade":"intermediaria","enunciado":"Manter cópias de backup separadas dos dados de produção pode ajudar na recuperação após exclusão acidental, falha de hardware ou ataque de ransomware.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"Backups independentes dos dados ativos oferecem uma fonte de recuperação quando a cópia principal é perdida, corrompida ou indisponível.","referencia":"CISA — Data Backup Options; NIST SP 800-34 Rev. 1","tags":["backup","recuperação","ransomware"]},{"id":"INF038","area":"Noções de Informática","tema":"MAPA 058 — Procedimentos de backup","subtema":"Backup versus sincronização","dificuldade":"dificil","enunciado":"Uma pasta sincronizada automaticamente com a nuvem equivale sempre a um backup independente, pois a exclusão acidental de um arquivo no computador jamais é propagada para a cópia remota.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Sincronização busca manter estados equivalentes entre locais e pode propagar exclusões ou alterações. Backup pressupõe cópias destinadas à recuperação e pode usar versionamento, retenção e isolamento.","referencia":"CISA — Data Backup Options; Microsoft Support — Sync files with OneDrive","tags":["backup","sincronização","nuvem"]},{"id":"INF039","area":"Noções de Informática","tema":"MAPA 059 — Armazenamento de dados na nuvem","subtema":"Acesso e sincronização","dificuldade":"intermediaria","enunciado":"Serviços de armazenamento em nuvem podem permitir que um mesmo arquivo seja acessado por diferentes dispositivos autenticados, desde que o serviço, a conta e as permissões estejam configurados para isso.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"O armazenamento em nuvem pode disponibilizar arquivos pela rede a diferentes dispositivos, condicionado à autenticação, conectividade e permissões definidas no serviço.","referencia":"Microsoft Support — OneDrive basics; Google Drive Help","tags":["armazenamento em nuvem","sincronização","acesso"]},{"id":"INF040","area":"Noções de Informática","tema":"MAPA 059 — Armazenamento de dados na nuvem","subtema":"Compartilhamento e permissões","dificuldade":"intermediaria","enunciado":"Compartilhar um arquivo de armazenamento em nuvem por meio de um link público garante que somente o destinatário originalmente pretendido conseguirá abri-lo, mesmo que o link seja encaminhado a terceiros.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"Um link público ou configurado como 'qualquer pessoa com o link' pode permitir acesso a terceiros que recebam esse endereço. Para restringir o acesso, devem ser usados controles de identidade e permissões adequados.","referencia":"Microsoft Support — Share OneDrive files and folders; Google Drive Help — Share files","tags":["armazenamento em nuvem","compartilhamento","permissões"]}],"alagoas":[{"id":"ALA001","area":"Conhecimentos do Estado de Alagoas","tema":"060 Formação histórica de Alagoas","subtema":"vínculo com Pernambuco e formação de núcleos coloniais","dificuldade":"facil","enunciado":"A formação histórica do território alagoano esteve vinculada, durante o período colonial, à Capitania de Pernambuco, e núcleos como Porto Calvo, Penedo e a antiga Vila das Alagoas ganharam importância em meio à ocupação portuguesa, à produção açucareira e às rotas de circulação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O território correspondente ao atual estado de Alagoas integrou a Capitania de Pernambuco por longo período. A ocupação portuguesa consolidou núcleos litorâneos e ribeirinhos ligados à defesa, à circulação e, em diversas áreas, à economia açucareira.","referencia":"IPHAN — Marechal Deodoro (AL) e Penedo (AL); IBGE — históricos municipais de Porto Calvo e Penedo.","tags":["formação histórica","Pernambuco","ocupação colonial"]},{"id":"ALA002","area":"Conhecimentos do Estado de Alagoas","tema":"060 Formação histórica de Alagoas","subtema":"diferenciação regional da ocupação territorial","dificuldade":"intermediaria","enunciado":"A formação territorial de Alagoas ocorreu de modo homogêneo, pois a economia açucareira anulou as diferenças entre o litoral, a Zona da Mata e o interior, produzindo padrões semelhantes de povoamento e de uso da terra em todo o território.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A ocupação do território foi regionalmente diferenciada. A cana-de-açúcar teve forte presença histórica no leste e na Zona da Mata, enquanto áreas do Agreste e, sobretudo, do Sertão apresentaram condições ambientais, formas de ocupação e atividades econômicas distintas.","referencia":"IBGE — Atlas Nacional do Brasil e estudos de regionalização do Nordeste; IPHAN — patrimônio histórico de Alagoas.","tags":["formação territorial","regionalização","ocupação"]},{"id":"ALA003","area":"Conhecimentos do Estado de Alagoas","tema":"061 Colonização portuguesa","subtema":"sesmarias, vilas e expansão colonial","dificuldade":"facil","enunciado":"Na colonização portuguesa da área que viria a constituir Alagoas, a concessão de sesmarias e a formação de povoados e vilas estiveram associadas à ocupação do território, à defesa e à expansão de atividades agrícolas, entre elas a produção de cana-de-açúcar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. As sesmarias foram um dos instrumentos empregados na ocupação territorial portuguesa. A defesa, a agricultura e a constituição de núcleos de povoamento integraram esse processo, com importante presença da produção canavieira.","referencia":"Presidência da República — Decreto de 16 de setembro de 1817; IPHAN — Marechal Deodoro (AL); IBGE — históricos municipais de Alagoas.","tags":["colonização portuguesa","sesmarias","cana-de-açúcar"]},{"id":"ALA004","area":"Conhecimentos do Estado de Alagoas","tema":"062 Economia açucareira","subtema":"localização histórica da produção canavieira","dificuldade":"facil","enunciado":"Historicamente, a principal área de expansão da economia açucareira alagoana foi o Sertão semiárido, enquanto a Zona da Mata permaneceu relativamente secundária na instalação de engenhos e no cultivo de cana-de-açúcar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O item inverte a distribuição histórica. A Zona da Mata e áreas do leste alagoano reuniram condições mais favoráveis à expansão canavieira e concentraram engenhos, ao passo que o Sertão possui condições naturais e trajetória produtiva distintas.","referencia":"IPHAN — Marechal Deodoro (AL); SEPLAG/AL — estudos econômicos e territoriais do Estado de Alagoas.","tags":["economia açucareira","Zona da Mata","Sertão"]},{"id":"ALA005","area":"Conhecimentos do Estado de Alagoas","tema":"062 Economia açucareira","subtema":"efeitos territoriais e urbanos do açúcar","dificuldade":"intermediaria","enunciado":"A produção açucareira contribuiu para articular engenhos, áreas rurais, núcleos urbanos e pontos de escoamento, razão pela qual sua importância histórica em Alagoas ultrapassa a produção agrícola e alcança a própria organização do território.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A economia do açúcar influenciou o povoamento, a circulação, o comércio e a urbanização. Em áreas alagoanas, a prosperidade de núcleos coloniais e a utilização de portos estiveram relacionadas ao funcionamento dessa economia.","referencia":"IPHAN — Marechal Deodoro (AL); SECULT/AL — histórico do município de Maceió; bibliografia histórica consolidada sobre a economia açucareira alagoana.","tags":["açúcar","território","urbanização"]},{"id":"ALA006","area":"Conhecimentos do Estado de Alagoas","tema":"063 Emancipação política da Capitania de Pernambuco em 1817","subtema":"decreto de 16 de setembro de 1817","dificuldade":"facil","enunciado":"Em 1817, Alagoas foi desmembrada da Capitania de Pernambuco e passou a ter governo próprio, o que representou mudança relevante em sua autonomia político-administrativa.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O Decreto de 16 de setembro de 1817 criou a Capitania das Alagoas, desmembrando-a de Pernambuco e determinando que tivesse governo independente da antiga capitania.","referencia":"Presidência da República — Decreto de 16 de setembro de 1817.","tags":["emancipação","1817","Pernambuco"]},{"id":"ALA007","area":"Conhecimentos do Estado de Alagoas","tema":"063 Emancipação política da Capitania de Pernambuco em 1817","subtema":"efeitos político-administrativos da emancipação","dificuldade":"intermediaria","enunciado":"O decreto de 1817 preservou a subordinação administrativa de Alagoas ao governo de Pernambuco e limitou-se a alterar a denominação da comarca, sem instituir governo próprio para a nova capitania.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O decreto estabeleceu justamente o contrário: Alagoas foi isentada da sujeição ao governo da Capitania de Pernambuco e erigida em capitania com governo próprio.","referencia":"Presidência da República — Decreto de 16 de setembro de 1817.","tags":["emancipação","autonomia","administração colonial"]},{"id":"ALA008","area":"Conhecimentos do Estado de Alagoas","tema":"064 Elevação à Província em 1821","subtema":"organização provincial e governo provisório","dificuldade":"intermediaria","enunciado":"A adoção da organização provincial em Alagoas em 1821 significou o retorno do território à dependência político-administrativa de Pernambuco, anulando a separação estabelecida em 1817.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Documentos de 1821 registram a Província de Alagoas com Governo Provisório próprio e representação política. A reorganização provincial não restabeleceu a antiga subordinação administrativa a Pernambuco.","referencia":"Fundação Biblioteca Nacional — Projeto Resgate, Catálogo de documentos manuscritos avulsos da Capitania de Alagoas (1680–1826), documentos de 1821.","tags":["1821","província","autonomia"]},{"id":"ALA009","area":"Conhecimentos do Estado de Alagoas","tema":"065 Quilombo dos Palmares","subtema":"Serra da Barriga e resistência quilombola","dificuldade":"facil","enunciado":"O Quilombo dos Palmares, associado à Serra da Barriga, constitui referência central da resistência à escravidão no Brasil colonial e integra de modo decisivo a memória histórica de Alagoas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Palmares tornou-se uma das principais referências históricas da resistência negra à escravidão. A Serra da Barriga, em União dos Palmares, é reconhecida e protegida por sua relevância histórica e cultural.","referencia":"Fundação Cultural Palmares — Parque Memorial Quilombo dos Palmares; IPHAN — Serra da Barriga.","tags":["Palmares","Serra da Barriga","resistência"]},{"id":"ALA010","area":"Conhecimentos do Estado de Alagoas","tema":"065 Quilombo dos Palmares","subtema":"organização social e autonomia","dificuldade":"intermediaria","enunciado":"Palmares funcionou essencialmente como uma unidade produtiva subordinada às autoridades coloniais, sem organização política própria e sem oposição sistemática ao regime escravista.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A afirmação inverte características centrais de Palmares. O conjunto de mocambos constituiu espaço de resistência à escravidão e desenvolveu formas próprias de organização social, econômica, política e defensiva.","referencia":"Fundação Cultural Palmares — Parque Memorial Quilombo dos Palmares; IPHAN — Dossiê da Serra da Barriga.","tags":["Palmares","organização quilombola","escravidão"]},{"id":"ALA011","area":"Conhecimentos do Estado de Alagoas","tema":"066 Formação do Quilombo dos Palmares","subtema":"constituição e crescimento das comunidades quilombolas","dificuldade":"intermediaria","enunciado":"A formação e o crescimento de Palmares estiveram ligados à resistência de pessoas submetidas à escravidão, incluindo fugitivos e seus descendentes, que estruturaram comunidades capazes de produzir alimentos, organizar a defesa e manter formas próprias de vida coletiva.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Palmares reuniu diferentes mocambos e populações que construíram estratégias de sobrevivência, produção e defesa. A resistência à escravidão foi elemento fundamental de sua formação e permanência histórica.","referencia":"Fundação Cultural Palmares — Parque Memorial Quilombo dos Palmares; IPHAN — Dossiê de Candidatura da Serra da Barriga a Patrimônio Cultural do Mercosul.","tags":["formação de Palmares","quilombo","resistência"]},{"id":"ALA012","area":"Conhecimentos do Estado de Alagoas","tema":"067 Resistência à escravidão","subtema":"dimensões sociais e econômicas da resistência","dificuldade":"intermediaria","enunciado":"A resistência quilombola em Palmares restringiu-se aos confrontos armados, pois não envolveu construção de comunidades, produção de alimentos, redes de sociabilidade ou estratégias de sobrevivência coletiva.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A resistência não se limitou ao combate. A organização dos mocambos envolveu moradia, produção, relações sociais e mecanismos de defesa, dimensões essenciais para a manutenção das comunidades palmarinas.","referencia":"Fundação Cultural Palmares — Parque Memorial Quilombo dos Palmares; IPHAN — Dossiê da Serra da Barriga.","tags":["resistência à escravidão","organização social","quilombos"]},{"id":"ALA013","area":"Conhecimentos do Estado de Alagoas","tema":"068 Zumbi dos Palmares","subtema":"posição diante do acordo de Ganga Zumba","dificuldade":"facil","enunciado":"Zumbi aderiu ao acordo firmado entre Ganga Zumba e o governo de Pernambuco no fim da década de 1670, aceitando a transferência dos partidários do acordo para Cucaú e abandonando a continuidade da resistência em Palmares.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Zumbi recusou-se a aderir ao acordo associado a Ganga Zumba e manteve a resistência. A falsidade do item decorre da atribuição a Zumbi da posição oposta à registrada pelas fontes históricas.","referencia":"Fundação Cultural Palmares — Dandara e Zumbi dos Palmares; IPHAN — Dossiê da Serra da Barriga.","tags":["Zumbi","Ganga Zumba","resistência"]},{"id":"ALA014","area":"Conhecimentos do Estado de Alagoas","tema":"068 Zumbi dos Palmares","subtema":"continuidade da resistência após a queda de Macaco","dificuldade":"intermediaria","enunciado":"A tomada de Macaco, principal núcleo de Palmares, em 1694 não significou a morte imediata de Zumbi; ele escapou ao cerco e continuou resistindo até ser localizado e morto em 1695.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A principal posição palmarina foi tomada em 1694, mas Zumbi conseguiu escapar e permaneceu em resistência por aproximadamente mais um ano, sendo morto em 20 de novembro de 1695.","referencia":"Fundação Cultural Palmares — Dandara e Zumbi dos Palmares.","tags":["Zumbi","1694","1695"]},{"id":"ALA015","area":"Conhecimentos do Estado de Alagoas","tema":"069 Aspectos geográficos de Alagoas","subtema":"posição e diferenciação regional","dificuldade":"facil","enunciado":"Alagoas é um estado nordestino com faixa litorânea atlântica e apresenta contrastes ambientais entre o leste mais úmido e áreas interiores progressivamente mais secas, o que ajuda a diferenciar Zona da Mata, Agreste e Sertão.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A posição geográfica de Alagoas e a transição das condições de umidade do litoral para o interior contribuem para diferenças de clima, vegetação e uso do território entre Zona da Mata, Agreste e Sertão.","referencia":"IBGE — Atlas Nacional do Brasil e estudos de regionalização do Nordeste.","tags":["geografia","regionalização","Alagoas"]},{"id":"ALA016","area":"Conhecimentos do Estado de Alagoas","tema":"069 Aspectos geográficos de Alagoas","subtema":"diversidade ambiental","dificuldade":"intermediaria","enunciado":"Por possuir pequena extensão territorial, Alagoas apresenta condições naturais praticamente uniformes, sem contraste relevante entre áreas úmidas do leste e ambientes semiáridos do interior.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A pequena extensão territorial não elimina a diversidade ambiental. Há diferenças relevantes entre o litoral e a Zona da Mata, mais úmidos, o Agreste de transição e o Sertão submetido a condições de maior semiaridez.","referencia":"IBGE — Atlas Nacional do Brasil e estudos de regionalização do Nordeste.","tags":["diversidade ambiental","litoral","semiárido"]},{"id":"ALA017","area":"Conhecimentos do Estado de Alagoas","tema":"070 Litoral alagoano","subtema":"características ambientais do litoral","dificuldade":"facil","enunciado":"O litoral alagoano caracteriza-se predominantemente por condições semiáridas semelhantes às do Sertão, com pouca influência marítima e sem papel expressivo de praias, recifes, estuários e sistemas lagunares na paisagem estadual.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O item transfere características do Sertão para o litoral. A faixa costeira é fortemente influenciada pelo Atlântico e apresenta praias, recifes, estuários e sistemas lagunares relevantes para a paisagem, a ocupação e a atividade turística.","referencia":"IBGE — informações geográficas de Alagoas; Governo de Alagoas — informações territoriais e turísticas do litoral alagoano.","tags":["litoral","paisagem costeira","turismo"]},{"id":"ALA018","area":"Conhecimentos do Estado de Alagoas","tema":"070 Litoral alagoano","subtema":"ocupação, turismo e atividades econômicas","dificuldade":"intermediaria","enunciado":"Além de sua importância ambiental, o litoral alagoano concentra áreas urbanizadas e atividades ligadas ao turismo e aos serviços, de modo que sua relevância econômica contemporânea não se limita às atividades agrícolas tradicionais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A faixa litorânea reúne importantes áreas urbanas e destinos turísticos, movimentando atividades de hospedagem, alimentação, transporte, comércio e outros serviços.","referencia":"SEPLAG/AL — Produto Interno Bruto de Alagoas (PIB) 2023, Nota Técnica n.º 03; Governo de Alagoas — informações sobre o turismo estadual.","tags":["litoral","serviços","turismo"]},{"id":"ALA019","area":"Conhecimentos do Estado de Alagoas","tema":"071 Zona da Mata","subtema":"umidade e tradição canavieira","dificuldade":"facil","enunciado":"A Zona da Mata alagoana situa-se na porção oriental mais úmida do estado e mantém forte associação histórica com a cultura da cana-de-açúcar e com a instalação de engenhos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A Zona da Mata apresenta condições mais úmidas que o interior sertanejo e foi uma das áreas centrais da economia canavieira, deixando marcas importantes na ocupação e na organização econômica do território.","referencia":"IBGE — regionalização do Nordeste; IPHAN — patrimônio histórico de Alagoas; SEPLAG/AL — estudos territoriais e econômicos.","tags":["Zona da Mata","cana-de-açúcar","umidade"]},{"id":"ALA020","area":"Conhecimentos do Estado de Alagoas","tema":"071 Zona da Mata","subtema":"distinção em relação ao Agreste","dificuldade":"intermediaria","enunciado":"A Zona da Mata corresponde à principal faixa de transição entre o litoral úmido e o Sertão semiárido, apresentando, em regra, condições menos úmidas que o Agreste e menor tradição histórica de cultivo de cana-de-açúcar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O item atribui à Zona da Mata características próprias da faixa de transição agrestina. A Zona da Mata é mais úmida e historicamente associada à cana-de-açúcar, enquanto o Agreste marca a transição para o Sertão.","referencia":"IBGE — regionalização do Nordeste; IPHAN — patrimônio histórico de Alagoas.","tags":["Zona da Mata","Agreste","regionalização"]},{"id":"ALA021","area":"Conhecimentos do Estado de Alagoas","tema":"072 Agreste","subtema":"posição regional e características ambientais","dificuldade":"intermediaria","enunciado":"O Agreste alagoano corresponde à faixa mais úmida e florestada do litoral estadual, onde historicamente se concentrou de forma quase exclusiva a grande lavoura canavieira.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O item confunde Agreste e Zona da Mata. O Agreste constitui faixa de transição entre o leste mais úmido e o Sertão mais seco e apresenta maior diversidade de usos econômicos e paisagens.","referencia":"IBGE — regionalização do Nordeste e informações geográficas de Alagoas.","tags":["Agreste","transição","Zona da Mata"]},{"id":"ALA022","area":"Conhecimentos do Estado de Alagoas","tema":"072 Agreste","subtema":"transição ambiental e dinâmica econômica","dificuldade":"intermediaria","enunciado":"O Agreste alagoano possui caráter de transição entre áreas mais úmidas do leste e o Sertão semiárido, e sua dinâmica econômica não se resume à monocultura canavieira, incluindo atividades agropecuárias, comércio e centros urbanos importantes.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O Agreste apresenta posição intermediária em termos ambientais e econômicos. Essa condição se associa à diversidade de atividades e à presença de centros urbanos de relevância regional, como Arapiraca.","referencia":"IBGE — regionalização do Nordeste e informações municipais de Arapiraca; Governo de Alagoas — estudos de planejamento regional.","tags":["Agreste","transição","Arapiraca"]},{"id":"ALA023","area":"Conhecimentos do Estado de Alagoas","tema":"073 Sertão","subtema":"semiaridez e vegetação","dificuldade":"facil","enunciado":"No Sertão alagoano predominam condições de maior semiaridez que no litoral e na Zona da Mata, com vegetação adaptada à irregularidade das chuvas e às limitações hídricas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O Sertão integra a porção interior mais seca do estado e apresenta características do domínio semiárido, o que influencia a disponibilidade de água, a cobertura vegetal e as formas de uso do solo.","referencia":"IBGE — regionalização do Nordeste e informações ambientais de Alagoas.","tags":["Sertão","semiárido","vegetação"]},{"id":"ALA024","area":"Conhecimentos do Estado de Alagoas","tema":"073 Sertão","subtema":"contraste com a Zona da Mata","dificuldade":"dificil","enunciado":"Em comparação com a Zona da Mata, o Sertão alagoano apresenta maior regularidade de chuvas e condições mais favoráveis à Mata Atlântica densa, razão pela qual a cana-de-açúcar se tornou historicamente mais dominante ali que no leste do estado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O item inverte as características regionais. O Sertão é mais seco e sujeito à irregularidade das chuvas, enquanto a Zona da Mata é mais úmida e historicamente mais vinculada à expansão da cana-de-açúcar.","referencia":"IBGE — regionalização do Nordeste; IPHAN — patrimônio histórico de Alagoas.","tags":["Sertão","Zona da Mata","cana-de-açúcar"]},{"id":"ALA025","area":"Conhecimentos do Estado de Alagoas","tema":"074 Rio São Francisco","subtema":"posição territorial e cidades ribeirinhas","dificuldade":"intermediaria","enunciado":"Em Alagoas, o rio São Francisco está relacionado principalmente à fronteira norte com Pernambuco e não possui relação direta com cidades históricas situadas no sul e no sudoeste do estado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. No território alagoano, o São Francisco está ligado sobretudo à porção sul e sudoeste e à divisa com Sergipe. Cidades como Penedo e Piranhas possuem relações históricas e territoriais diretas com o rio.","referencia":"IPHAN — Penedo (AL) e Piranhas (AL); UFAL — estudos sobre o Baixo São Francisco.","tags":["Rio São Francisco","Penedo","Piranhas"]},{"id":"ALA026","area":"Conhecimentos do Estado de Alagoas","tema":"074 Rio São Francisco","subtema":"circulação, povoamento e economia","dificuldade":"dificil","enunciado":"O rio São Francisco exerceu papel relevante na ocupação e na circulação de áreas do sul e do sertão alagoanos, contribuindo para a importância histórica de núcleos como Penedo e Piranhas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O São Francisco foi eixo de circulação, povoamento e atividades econômicas. Penedo desenvolveu-se às suas margens, e Piranhas ganhou destaque em razão da navegação e das conexões de transporte associadas ao rio.","referencia":"IPHAN — Penedo (AL), Piranhas (AL) e Patrimônio Material em Alagoas; UFAL — estudos sobre o Baixo São Francisco.","tags":["Rio São Francisco","formação territorial","circulação"]},{"id":"ALA027","area":"Conhecimentos do Estado de Alagoas","tema":"075 Organização político-administrativa","subtema":"estado, capital e municípios","dificuldade":"intermediaria","enunciado":"Na organização político-administrativa atual, Alagoas é uma unidade da Federação composta por municípios e tem Maceió como capital, sendo a divisão municipal uma referência básica da administração e da produção de estatísticas territoriais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Alagoas integra a Federação brasileira, possui Maceió como capital e tem seu território subdividido em municípios, unidades fundamentais da organização político-administrativa brasileira.","referencia":"Constituição Federal, arts. 18 e 25; IBGE — Alagoas, Cidades e Estados e Divisão Territorial Brasileira.","tags":["organização político-administrativa","municípios","Maceió"]},{"id":"ALA028","area":"Conhecimentos do Estado de Alagoas","tema":"076 Maceió como capital","subtema":"transferência da capital em 1839","dificuldade":"intermediaria","enunciado":"Maceió tornou-se capital de Alagoas imediatamente com a emancipação de 1817, quando a sede administrativa foi transferida de forma definitiva da antiga Vila das Alagoas para Maceió no próprio ano da separação de Pernambuco.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A emancipação ocorreu em 1817, mas a transferência definitiva da capital foi posterior. Em 1839, Maceió passou a sediar o governo provincial; anteriormente, a cidade de Alagoas, atual Marechal Deodoro, exercera a função de capital.","referencia":"SECULT/AL — histórico do município de Maceió; IPHAN — Marechal Deodoro (AL).","tags":["Maceió","capital","1839"]},{"id":"ALA029","area":"Conhecimentos do Estado de Alagoas","tema":"077 Municípios de Alagoas","subtema":"diversidade regional dos municípios","dificuldade":"dificil","enunciado":"Arapiraca e Penedo, apesar de exercerem funções urbanas relevantes em suas respectivas regiões, inserem-se no mesmo contexto geográfico litorâneo, pois ambas se localizam diretamente na costa atlântica e têm formação territorial desvinculada do Agreste e do rio São Francisco.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. Arapiraca é importante centro do Agreste alagoano, enquanto Penedo está situada às margens do rio São Francisco, no sul do estado. O item apaga justamente a diversidade regional entre os municípios.","referencia":"IBGE — informações municipais de Arapiraca e Penedo; IPHAN — Penedo (AL).","tags":["municípios","Arapiraca","Penedo"]},{"id":"ALA030","area":"Conhecimentos do Estado de Alagoas","tema":"078 Poder Executivo estadual","subtema":"atribuições constitucionais do governador","dificuldade":"dificil","enunciado":"No Estado de Alagoas, compete privativamente ao governador exercer, com auxílio dos secretários de Estado, a direção superior da administração estadual, além de sancionar, promulgar e fazer publicar leis e de vetar projetos de lei, total ou parcialmente.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Essas competências constam do art. 107 da Constituição do Estado de Alagoas, que disciplina atribuições privativas do governador.","referencia":"Constituição do Estado de Alagoas, art. 107, incisos II, IV e V.","tags":["Poder Executivo","governador","competências"]},{"id":"ALA031","area":"Conhecimentos do Estado de Alagoas","tema":"079 Poder Legislativo estadual","subtema":"Assembleia Legislativa e separação de poderes","dificuldade":"dificil","enunciado":"A Assembleia Legislativa de Alagoas integra o Poder Executivo estadual e tem como função típica executar diretamente políticas públicas e julgar, em primeira instância, os processos civis e criminais ocorridos no território alagoano.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A Assembleia Legislativa exerce o Poder Legislativo estadual. Suas funções típicas são legislar e fiscalizar, enquanto a execução administrativa cabe ao Executivo e a função jurisdicional pertence ao Judiciário.","referencia":"Constituição do Estado de Alagoas, art. 68 e arts. 79 a 82.","tags":["Poder Legislativo","Assembleia Legislativa","separação de poderes"]},{"id":"ALA032","area":"Conhecimentos do Estado de Alagoas","tema":"080 Poder Judiciário estadual","subtema":"estrutura do Judiciário alagoano","dificuldade":"dificil","enunciado":"O Tribunal de Justiça integra o Poder Judiciário de Alagoas, ao lado de outros órgãos previstos constitucionalmente, e a estrutura judiciária estadual exerce função jurisdicional distinta das atribuições administrativas típicas do Poder Executivo.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A Constituição estadual inclui o Tribunal de Justiça entre os órgãos do Poder Judiciário e prevê também outros órgãos judiciais. A função jurisdicional do Judiciário não se confunde com a direção administrativa típica do Executivo.","referencia":"Constituição do Estado de Alagoas, arts. 121 a 135; Tribunal de Justiça de Alagoas — organização judiciária.","tags":["Poder Judiciário","TJAL","organização judiciária"]},{"id":"ALA033","area":"Conhecimentos do Estado de Alagoas","tema":"081 Economia estadual","subtema":"diversificação setorial","dificuldade":"intermediaria","enunciado":"A economia alagoana contemporânea não se reduz à produção de cana-de-açúcar: embora a cadeia sucroenergética permaneça relevante, o setor de serviços possui peso expressivo e convive com atividades industriais, agropecuárias e turísticas.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A cana-de-açúcar e sua cadeia industrial permanecem importantes, mas a estrutura econômica estadual é diversificada. Nas Contas Regionais referentes a 2023, os serviços constituíram a maior parcela do valor adicionado estadual.","referencia":"SEPLAG/AL — Produto Interno Bruto de Alagoas (PIB) 2023, Nota Técnica n.º 03, em parceria com o IBGE.","tags":["economia","serviços","cana-de-açúcar"]},{"id":"ALA034","area":"Conhecimentos do Estado de Alagoas","tema":"082 Agroindústria canavieira","subtema":"cadeia produtiva e transformação industrial","dificuldade":"dificil","enunciado":"Na economia alagoana, a cana-de-açúcar participa apenas da etapa agrícola, sem ligação relevante com a indústria de transformação, com a produção de açúcar ou com as exportações estaduais.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A cadeia canavieira articula produção agrícola e transformação industrial. Dados estaduais referentes a 2023 destacam a fabricação e o refino de açúcar e registram o açúcar de cana como produto de grande relevância nas exportações alagoanas.","referencia":"SEPLAG/AL — Produto Interno Bruto de Alagoas (PIB) 2023, Nota Técnica n.º 03, seção Indústria.","tags":["agroindústria","cana-de-açúcar","indústria"]},{"id":"ALA035","area":"Conhecimentos do Estado de Alagoas","tema":"083 Turismo","subtema":"diversidade de atrativos turísticos","dificuldade":"intermediaria","enunciado":"O turismo em Alagoas combina atrativos naturais e culturais: além das praias, incluem-se cidades históricas, paisagens ligadas ao rio São Francisco e lugares de memória como a Serra da Barriga, ampliando a atividade para além do turismo de sol e mar.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A atividade turística alagoana possui forte componente costeiro, mas também se apoia no patrimônio histórico, em roteiros do São Francisco e em espaços de memória afro-brasileira, como a Serra da Barriga.","referencia":"IPHAN — Patrimônio Material em Alagoas; Fundação Cultural Palmares — Parque Memorial Quilombo dos Palmares; Governo de Alagoas — informações turísticas estaduais.","tags":["turismo","patrimônio","litoral"]},{"id":"ALA036","area":"Conhecimentos do Estado de Alagoas","tema":"084 Setor de serviços","subtema":"peso dos serviços na economia","dificuldade":"dificil","enunciado":"O setor de serviços possui participação apenas residual na economia alagoana e, por isso, atividades como comércio, transporte, administração pública, hospedagem e alimentação têm importância estruturalmente marginal no estado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O setor de serviços tem peso elevado na economia de Alagoas. Nas Contas Regionais de 2023, respondeu pela maior parcela do valor adicionado e abrangeu, entre outras atividades, comércio, administração pública, transporte, alojamento e alimentação.","referencia":"SEPLAG/AL — Produto Interno Bruto de Alagoas (PIB) 2023, Nota Técnica n.º 03, seção Serviços.","tags":["serviços","economia","comércio"]},{"id":"ALA037","area":"Conhecimentos do Estado de Alagoas","tema":"085 Cultura e patrimônio","subtema":"patrimônio material e imaterial","dificuldade":"intermediaria","enunciado":"Em Alagoas, a noção de patrimônio cultural limita-se a edifícios antigos e conjuntos arquitetônicos, não alcançando danças, folguedos, saberes, ofícios e outras práticas tradicionais transmitidas entre gerações.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O patrimônio cultural pode ser material ou imaterial. Além de edificações e conjuntos urbanos, práticas, celebrações, saberes, ofícios e manifestações populares também podem constituir referências culturais a serem preservadas.","referencia":"Constituição Federal, art. 216; IPHAN — Patrimônio Cultural Material e Imaterial; SECULT/AL — políticas de patrimônio cultural.","tags":["cultura","patrimônio imaterial","folguedos"]},{"id":"ALA038","area":"Conhecimentos do Estado de Alagoas","tema":"085 Cultura e patrimônio","subtema":"memória histórica e diversidade cultural","dificuldade":"dificil","enunciado":"A preservação do patrimônio alagoano envolve diferentes camadas da história estadual: conjuntos urbanos, edificações religiosas, sítios arqueológicos e lugares de memória afro-brasileira, como a Serra da Barriga, podem coexistir como referências de identidade e memória coletiva.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O patrimônio cultural de Alagoas é plural. A proteção alcança conjuntos urbanos e edificações históricas, além de sítios e lugares de forte significado histórico e cultural, como a Serra da Barriga.","referencia":"IPHAN — Patrimônio Material e Patrimônio Arqueológico em Alagoas; Fundação Cultural Palmares — Serra da Barriga.","tags":["patrimônio cultural","Serra da Barriga","memória"]},{"id":"ALA039","area":"Conhecimentos do Estado de Alagoas","tema":"086 Manifestações culturais populares","subtema":"folguedos, dança e identidade cultural","dificuldade":"intermediaria","enunciado":"Manifestações como Guerreiro, Coco de Roda, Reisado e Pastoril integram o repertório da cultura popular alagoana e expressam processos de transmissão de práticas, músicas, danças e tradições entre gerações.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Guerreiro, Coco de Roda, Reisado e Pastoril figuram entre as manifestações e folguedos associados à cultura popular de Alagoas, contribuindo para a identidade cultural do estado.","referencia":"SECULT/AL — Alagoas: Seus Folguedos e Danças; documentos oficiais estaduais sobre cultura popular.","tags":["folguedos","Guerreiro","Coco de Roda"]},{"id":"ALA040","area":"Conhecimentos do Estado de Alagoas","tema":"087 Patrimônio histórico-cultural","subtema":"conjuntos urbanos protegidos pelo IPHAN","dificuldade":"dificil","enunciado":"A proteção federal do patrimônio urbano de Alagoas concentra-se exclusivamente em Maceió, pois Penedo, Marechal Deodoro e Piranhas não possuem conjuntos urbanos tombados pelo IPHAN.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O IPHAN informa que Alagoas possui conjuntos urbanos tombados em Marechal Deodoro, Penedo e Piranhas, que preservam diferentes aspectos da história e da arquitetura do estado.","referencia":"IPHAN — Patrimônio Material em Alagoas; conjuntos urbanos de Marechal Deodoro, Penedo e Piranhas.","tags":["patrimônio histórico","IPHAN","cidades históricas"]}],"legislacao":[{"id":"LEG001","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei Estadual nº 5.346/1992 — Estatuto dos Policiais Militares de Alagoas","subtema":"Ausência e deserção","dificuldade":"facil","enunciado":"À luz do Estatuto dos Policiais Militares de Alagoas, considera-se ausente o policial militar que, por mais de vinte e quatro horas consecutivas, deixe de comparecer à sua Organização Policial Militar sem comunicar o motivo do impedimento ou dela se afaste, sem licença, quando deva permanecer; se a situação perdurar por mais de oito dias consecutivos, nas hipóteses legais correspondentes, o policial militar é considerado desertor.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. Os arts. 40 e 41 estabelecem marcos temporais distintos para as situações de ausente e desertor. A ausência é caracterizada após mais de vinte e quatro horas consecutivas nas hipóteses previstas no art. 40; a deserção, após mais de oito dias consecutivos nas hipóteses do art. 41. A armadilha é confundir os prazos ou tratar ausência e deserção como situações equivalentes.","referencia":"Lei Estadual nº 5.346/1992 (Alagoas), arts. 40 e 41.","tags":["estatuto PMAL","ausência","deserção"]},{"id":"LEG002","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Lei Estadual nº 5.346/1992 — Estatuto dos Policiais Militares de Alagoas","subtema":"Responsabilidade no cumprimento de ordens","dificuldade":"intermediaria","enunciado":"Um soldado da PM AL, ao cumprir ordem regularmente recebida, pratica excesso durante a execução. Nessa hipótese, o simples fato de estar cumprindo ordem superior afasta, pelo Estatuto, sua responsabilidade pelo excesso cometido.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O Estatuto estabelece que, no cumprimento de ordens recebidas, o executante responde pelas omissões, pelos erros e pelos excessos que cometer. A armadilha está em transformar o cumprimento de ordem superior em causa automática de exclusão de responsabilidade.","referencia":"Lei Estadual nº 5.346/1992 (Alagoas), art. 29, parágrafo único.","tags":["estatuto PMAL","ordem superior","responsabilidade"]},{"id":"LEG003","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Decreto Estadual nº 37.042/1996 — Regulamento Disciplinar da PM AL","subtema":"Âmbito de sujeição ao regulamento disciplinar","dificuldade":"facil","enunciado":"O Regulamento Disciplinar da Polícia Militar de Alagoas alcança policiais militares da ativa e da inatividade, nos termos nele previstos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. O art. 9º estabelece que estão sujeitos ao Regulamento os policiais militares na ativa e na inatividade. A armadilha seria restringir seu âmbito subjetivo exclusivamente ao efetivo em serviço ativo.","referencia":"Decreto Estadual nº 37.042/1996 (Alagoas), art. 9º.","tags":["RDPMAL","disciplina","inatividade"]},{"id":"LEG004","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Decreto Estadual nº 37.042/1996 — Regulamento Disciplinar da PM AL","subtema":"Finalidade do regulamento e comportamento das praças","dificuldade":"intermediaria","enunciado":"Entre as finalidades expressas do Regulamento Disciplinar da PM AL está estabelecer a classificação do comportamento policial militar de oficiais e praças, sem distinção entre os círculos hierárquicos.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. O art. 1º inclui entre as finalidades do Regulamento a classificação do comportamento policial militar das praças, e não de oficiais e praças indistintamente. A armadilha consiste em ampliar o alcance expresso do dispositivo.","referencia":"Decreto Estadual nº 37.042/1996 (Alagoas), art. 1º.","tags":["RDPMAL","comportamento","praças"]},{"id":"LEG005","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Código Penal — Aplicação da lei penal","subtema":"Retroatividade da lei penal mais benéfica","dificuldade":"facil","enunciado":"Lei penal posterior que, de qualquer modo, favoreça o agente aplica-se aos fatos anteriores, ainda que já tenham sido decididos por sentença condenatória transitada em julgado.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"A","comentario":"CERTO. A lei posterior mais favorável retroage e alcança inclusive fatos já decididos por sentença condenatória transitada em julgado. A armadilha é supor que o trânsito em julgado impeça a incidência da lex mitior.","referencia":"Decreto-Lei nº 2.848/1940 (Código Penal), art. 2º, parágrafo único.","tags":["Código Penal","retroatividade","lei mais benéfica"]},{"id":"LEG006","area":"Legislação Pertinente ao Policial Militar de Alagoas","tema":"Código Penal — Aplicação da lei penal","subtema":"Lei temporária e lei excepcional","dificuldade":"intermediaria","enunciado":"Encerrado o prazo de vigência de uma lei penal temporária, ela deixa de ser aplicável inclusive aos fatos praticados durante o período em que esteve em vigor, salvo se lei posterior reproduzir expressamente a incriminação.","alternativas":{"A":"CERTO","B":"ERRADO"},"gabarito":"B","comentario":"ERRADO. A lei excepcional ou temporária aplica-se ao fato prat
