}


/* ===== training.js ===== */
function trainingUid(prefix = 'session') {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
}

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function applyQuestionFilters(questions, filters, statsMap = {}, favorites = new Set()) {
  const search = normalizeText(filters.search || '').trim();
  return questions.filter(q => {
    if (filters.area && q.area !== filters.area) return false;
    if (filters.tema && q.tema !== filters.tema) return false;
    if (filters.subtema && q.subtema !== filters.subtema) return false;
    if (filters.dificuldade && q.dificuldade !== filters.dificuldade) return false;
    if (filters.onlyFavorites && !favorites.has(q.id)) return false;

    const stat = statsMap[q.id];
    const attempted = Number(stat?.attempts || 0) > 0;
    switch (filters.status) {
      case 'respondidas': if (!attempted) return false; break;
      case 'nao-respondidas': if (attempted) return false; break;
      case 'corretas': if (!attempted || stat.lastCorrect !== true) return false; break;
      case 'erradas': if (!attempted || Number(stat.wrong || 0) < 1) return false; break;
      default: break;
    }

    if (search) {
      const haystack = normalizeText([q.id, q.area, q.tema, q.subtema, q.enunciado, ...(q.tags || [])].join(' '));
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

function createTrainingSession(eligibleQuestions, amount, filters = {}, mode = 'personalizado') {
  const n = Number(amount);
  if (!Number.isInteger(n) || n < 1) throw new Error('Informe uma quantidade válida de questões.');
  if (n > eligibleQuestions.length) throw new Error(`Existem apenas ${eligibleQuestions.length} questões disponíveis com estes filtros.`);
  return {
    type: 'training',
    id: trainingUid('training'),
    mode,
    filters,
    questionIds: shuffle(eligibleQuestions).slice(0, n).map(q => q.id),
    index: 0,
    selected: {},
    confirmed: {},
    cut: {},
    startedAt: new Date().toISOString(),
    endedAt: null
  };
}

async function persistTrainingSession(session) {
  await saveActiveSession('training', session);
}

function getTrainingSummary(session) {
  const entries = Object.values(session.confirmed || {});
  const correct = entries.filter(x => x.correct).length;
  const wrong = entries.length - correct;
  const percent = entries.length ? Math.round((correct / entries.length) * 1000) / 10 : 0;
  return { answered: entries.length, correct, wrong, percent };
}

async function confirmTrainingAnswer(session, question, selected) {
  if (!selected || !['A','B'].includes(selected)) throw new Error('Selecione uma alternativa antes de confirmar.');
  if (session.confirmed[question.id]) {
    await persistTrainingSession(session);
    return session.confirmed[question.id];
  }
  const attempt = await recordAttempt({
    attemptId: `training:${session.id}:${question.id}`,
    questionId: question.id,
    selected,
    correctAnswer: question.gabarito,
    mode: 'training',
    sessionId: session.id
  });
  session.selected[question.id] = attempt.selected;
  session.confirmed[question.id] = { selected: attempt.selected, correct: attempt.correct, confirmedAt: attempt.timestamp };
  await persistTrainingSession(session);
  return session.confirmed[question.id];
}

async function finishTraining(session) {
  if (session.endedAt || session._finishing) throw new Error('Este treino já está sendo finalizado.');
  session._finishing = true;
  try {
    const summary = getTrainingSummary(session);
    if (summary.answered !== session.questionIds.length) throw new Error('Existem questões do treino ainda não respondidas.');
    const endedAt = new Date().toISOString();
    const durationSec = Math.max(0, Math.round((new Date(endedAt) - new Date(session.startedAt)) / 1000));
    const record = await saveTrainingHistory({
      id: session.id,
      startedAt: session.startedAt,
      endedAt,
      mode: session.mode,
      filters: session.filters,
      quantity: session.questionIds.length,
      answered: summary.answered,
      correct: summary.correct,
      wrong: summary.wrong,
      percent: summary.percent,
      durationSec,
      questionIds: session.questionIds
    });
    await clearActiveSession('training');
    session.endedAt = endedAt;
    return record;
  } finally {
    delete session._finishing;
  }
}

function secondsSince(iso) {
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
}


/* ===== exam.js ===== */
const EXAM_MINUTES = 120;
const EXAM_TOTAL = 33;
const DISTRIBUTION = [
  { match: area => area === 'Língua Portuguesa', count: 3, label: 'Língua Portuguesa' },
  { match: area => area === 'Matemática', count: 3, label: 'Matemática' },
  { match: area => area === 'Noções de Informática', count: 3, label: 'Noções de Informática' },
  { match: area => area === 'Conhecimentos do Estado de Alagoas', count: 3, label: 'Conhecimentos do Estado de Alagoas' },
  { match: area => area === 'Legislação Pertinente ao Policial Militar de Alagoas', count: 3, label: 'Legislação Pertinente ao Policial Militar de Alagoas' },
  { match: area => area === 'Noções de Direito Administrativo', count: 3, label: 'Noções de Direito Administrativo' },
  { match: area => area === 'Noções de Direito Constitucional', count: 3, label: 'Noções de Direito Constitucional' },
  { match: area => area === 'Noções de Direito Processual Penal', count: 3, label: 'Noções de Direito Processual Penal' },
  { match: area => area === 'Noções de Direito Penal Militar', count: 3, label: 'Noções de Direito Penal Militar' },
  { match: area => area === 'Noções de Direito Processual Penal Militar', count: 3, label: 'Noções de Direito Processual Penal Militar' },
  { match: area => area === 'Noções de Direitos Humanos', count: 3, label: 'Noções de Direitos Humanos' }
];

function examUid() { return `exam-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`; }

function createExamSession(questions) {
  const selected = [];
  for (const rule of DISTRIBUTION) {
    const pool = questions.filter(q => rule.match(q.area));
    if (pool.length < rule.count) throw new Error(`Banco insuficiente para ${rule.label}: ${pool.length}/${rule.count}.`);
    selected.push(...shuffle(pool).slice(0, rule.count));
  }
  const now = Date.now();
  return {
    type: 'exam',
    id: examUid(),
    questionIds: shuffle(selected).map(q => q.id),
    index: 0,
    answers: {},
    cut: {},
    startedAt: new Date(now).toISOString(),
    endsAt: new Date(now + EXAM_MINUTES * 60 * 1000).toISOString(),
    finishedAt: null,
    autoFinished: false
  };
}

async function persistExamSession(session) {
  await saveActiveSession('exam', session);
}

function examRemainingSeconds(session) {
  return Math.max(0, Math.ceil((new Date(session.endsAt).getTime() - Date.now()) / 1000));
}

function examBlankCount(session) {
  return session.questionIds.filter(id => !session.answers[id]).length;
}

function setExamAnswer(session, questionId, letter) {
  if (!['A','B'].includes(letter)) return;
  session.answers[questionId] = letter;
}

async function finishExam(session, questionMap, { auto = false } = {}) {
  if (session.finishedAt || session._finishing) throw new Error('Este simulado já está sendo finalizado ou foi finalizado.');
  session._finishing = true;
  const endedAt = new Date().toISOString();

  try {
    let correct = 0;
    let wrong = 0;
    let blanks = 0;
    const byArea = {};
    const review = [];

    for (const qid of session.questionIds) {
      const q = questionMap.get(qid);
      if (!q) throw new Error(`Questão ${qid} do simulado não foi encontrada no banco.`);
      const selected = session.answers[qid] || null;
      const area = displayArea(q.area);
      byArea[area] ||= { total: 0, correct: 0, wrong: 0, blanks: 0 };
      byArea[area].total++;

      if (!selected) {
        blanks++;
        byArea[area].blanks++;
      } else {
        const isCorrect = selected === q.gabarito;
        if (isCorrect) { correct++; byArea[area].correct++; }
        else { wrong++; byArea[area].wrong++; }
        await recordAttempt({
          attemptId: `exam:${session.id}:${q.id}`,
          questionId: q.id,
          selected,
          correctAnswer: q.gabarito,
          mode: 'exam',
          sessionId: session.id,
          timestamp: endedAt
        });
      }

      review.push({ questionId: q.id, selected, correctAnswer: q.gabarito });
    }

    const percent = session.questionIds.length ? Math.round((correct / session.questionIds.length) * 1000) / 10 : 0;
    const elapsedSec = Math.max(0, Math.round((new Date(endedAt) - new Date(session.startedAt)) / 1000));
    const durationSec = Math.min(EXAM_MINUTES * 60, elapsedSec);
    const record = await saveExamHistory({
      id: session.id,
      startedAt: session.startedAt,
      endedAt,
      questionIds: session.questionIds,
      answers: { ...session.answers },
      review,
      correct,
      wrong,
      blanks,
      percent,
      byArea,
      durationSec,
      autoFinished: auto
    });
    await clearActiveSession('exam');
    session.finishedAt = endedAt;
    session.autoFinished = auto;
    return record;
  } finally {
    delete session._finishing;
  }
}



/* ===== performance.js ===== */
function computePerformance(questions, attempts, statsMap, favoritesSet = new Set(), examHistory = []) {
  const qMap = new Map(questions.map(q => [q.id, q]));
  const validAttempts = attempts.filter(a => qMap.has(a.questionId));
  const totalAttempts = validAttempts.length;
  const correctAttempts = validAttempts.filter(a => a.correct).length;
  const wrongAttempts = totalAttempts - correctAttempts;
  const answeredIds = new Set(questions.filter(q => statsMap[q.id] && Number(statsMap[q.id].attempts || 0) > 0).map(q => q.id));
  const overallPercent = totalAttempts ? Math.round((correctAttempts / totalAttempts) * 1000) / 10 : 0;

  const byArea = new Map();
  const byTheme = new Map();

  for (const attempt of validAttempts) {
    const q = qMap.get(attempt.questionId);
    const area = displayArea(q.area);
    const areaKey = q.area;
    if (!byArea.has(areaKey)) byArea.set(areaKey, { key: areaKey, label: area, attempts: 0, correct: 0, wrong: 0 });
    const a = byArea.get(areaKey);
    a.attempts++;
    a.correct += attempt.correct ? 1 : 0;
    a.wrong += attempt.correct ? 0 : 1;

    const themeKey = `${q.area}|||${q.tema}`;
    if (!byTheme.has(themeKey)) byTheme.set(themeKey, { area: q.area, areaLabel: area, theme: q.tema, attempts: 0, correct: 0, wrong: 0 });
    const t = byTheme.get(themeKey);
    t.attempts++;
    t.correct += attempt.correct ? 1 : 0;
    t.wrong += attempt.correct ? 0 : 1;
  }

  const finalize = row => ({ ...row, percent: row.attempts ? Math.round((row.correct / row.attempts) * 1000) / 10 : 0 });
  const areaRows = [...byArea.values()].map(finalize).sort((a,b) => b.percent - a.percent || b.attempts - a.attempts);
  const themeRows = [...byTheme.values()].map(finalize).sort((a,b) => a.percent - b.percent || b.attempts - a.attempts);
  const reviewThemes = themeRows.filter(row => row.attempts > 0 && row.percent < 70);

  const todayKey = new Date().toLocaleDateString('pt-BR');
  const todayAnswered = validAttempts.filter(a => new Date(a.timestamp).toLocaleDateString('pt-BR') === todayKey).length;
  const validFavorites = questions.filter(q => favoritesSet.has(q.id)).length;

  return {
    totalQuestions: questions.length,
    completedUnique: answeredIds.size,
    progressPercent: questions.length ? Math.round((answeredIds.size / questions.length) * 1000) / 10 : 0,
    totalAttempts,
    correctAttempts,
    wrongAttempts,
    overallPercent,
    favorites: validFavorites,
    exams: examHistory.length,
    byArea: areaRows,
    byTheme: themeRows,
    reviewThemes,
    bestArea: areaRows[0] || null,
    worstArea: areaRows.length ? [...areaRows].sort((a,b) => a.percent - b.percent || b.attempts - a.attempts)[0] : null,
    todayAnswered
  };
}


/* ===== backup.js ===== */
const UI_SETTINGS_KEY = 'treina-pm-al-ui-settings';
let volatileUiSettings = {};


function sanitizeUiSettings(raw = {}) {
  const clean = {};
  const goal = Number(raw?.dailyGoal);
  if (Number.isInteger(goal) && goal >= 1 && goal <= 500) clean.dailyGoal = goal;
  return clean;
}

function validateBackupPayload(payload) {
  if (!payload || payload.app !== 'TREINA PM AL' || payload.backupVersion !== 1 || !payload.database) {
    throw new Error('Backup incompatível com esta versão da plataforma.');
  }
  const db = payload.database;
  if (db.version !== 1 || !db.stores || typeof db.stores !== 'object') throw new Error('Estrutura do backup inválida.');
  const keyPaths = Object.fromEntries(Object.entries(STORES).map(([name, cfg]) => [name, cfg.keyPath]));
  for (const [storeName, keyPath] of Object.entries(keyPaths)) {
    const rows = db.stores[storeName];
    if (!Array.isArray(rows)) throw new Error(`Backup inválido: coleção ${storeName} ausente ou corrompida.`);
    const seen = new Set();
    for (const row of rows) {
      if (!row || typeof row !== 'object' || Array.isArray(row)) throw new Error(`Backup inválido: registro corrompido em ${storeName}.`);
      const key = row[keyPath];
      if (typeof key !== 'string' || !key.trim()) throw new Error(`Backup inválido: chave ausente em ${storeName}.`);
      if (seen.has(key)) throw new Error(`Backup inválido: chave duplicada em ${storeName}.`);
      seen.add(key);
    }
  }
  const isDate = value => typeof value === 'string' && !Number.isNaN(Date.parse(value));
  const isCount = value => Number.isInteger(Number(value)) && Number(value) >= 0;
  const isPct = value => Number.isFinite(Number(value)) && Number(value) >= 0 && Number(value) <= 100;
  const isQuestionIds = value => Array.isArray(value) && value.every(id => typeof id === 'string' && id.trim()) && new Set(value).size === value.length;
  const knownQuestion = id => typeof id === 'string' && (!state?.qMap?.size || state.qMap.has(id));
  const pctMatches = (actual, numerator, denominator) => {
    const expected = denominator ? Math.round((numerator / denominator) * 1000) / 10 : 0;
    return Math.abs(Number(actual) - expected) < 0.051;
  };
  const validExamDistribution = ids => DISTRIBUTION.every(rule => ids.filter(id => state.qMap.has(id) && rule.match(state.qMap.get(id).area)).length === rule.count);

  for (const a of db.stores.attempts) {
    if (!knownQuestion(a.questionId) || !['A','B'].includes(a.selected) || !['A','B'].includes(a.correctAnswer) || typeof a.correct !== 'boolean' || a.correct !== (a.selected === a.correctAnswer) || !['training','exam'].includes(a.mode) || !isDate(a.timestamp)) {
      throw new Error('Backup inválido: histórico de tentativas corrompido.');
    }
  }
  for (const st of db.stores.questionStats) {
    if (!knownQuestion(st.questionId) || !isCount(st.attempts) || !isCount(st.correct) || !isCount(st.wrong) || Number(st.correct) + Number(st.wrong) !== Number(st.attempts)) {
      throw new Error('Backup inválido: estatísticas de questões corrompidas.');
    }
    if (st.lastAttempt != null && !isDate(st.lastAttempt)) throw new Error('Backup inválido: data de estatística corrompida.');
    if (st.lastSelected != null && !['A','B'].includes(st.lastSelected)) throw new Error('Backup inválido: última alternativa corrompida.');
    if (st.lastCorrect != null && typeof st.lastCorrect !== 'boolean') throw new Error('Backup inválido: status da última resposta corrompido.');
    if (st.correctedAfterError != null && typeof st.correctedAfterError !== 'boolean') throw new Error('Backup inválido: indicador de correção corrompido.');
    if (st.correctAfterError != null && (!isCount(st.correctAfterError) || Number(st.correctAfterError) > Number(st.correct))) throw new Error('Backup inválido: contagem pós-erro corrompida.');
  }
  for (const f of db.stores.favorites) {
    if (!knownQuestion(f.questionId) || (f.savedAt != null && !isDate(f.savedAt))) throw new Error('Backup inválido: favoritas corrompidas.');
  }
  for (const r of db.stores.trainingHistory) {
    if (!isDate(r.startedAt) || !isDate(r.endedAt) || Date.parse(r.endedAt) < Date.parse(r.startedAt) || !isQuestionIds(r.questionIds) || r.questionIds.some(id => !knownQuestion(id)) || !isCount(r.quantity) || !isCount(r.answered) || !isCount(r.correct) || !isCount(r.wrong) || !isPct(r.percent) || !Number.isFinite(Number(r.durationSec)) || Number(r.durationSec) < 0) {
      throw new Error('Backup inválido: histórico de treinos corrompido.');
    }
    if (Number(r.quantity) !== r.questionIds.length || Number(r.correct) + Number(r.wrong) !== Number(r.answered) || Number(r.answered) > Number(r.quantity) || !pctMatches(r.percent, Number(r.correct), Number(r.answered))) throw new Error('Backup inválido: totais do histórico de treinos inconsistentes.');
  }
  for (const r of db.stores.examHistory) {
    if (!isDate(r.startedAt) || !isDate(r.endedAt) || Date.parse(r.endedAt) < Date.parse(r.startedAt) || !isQuestionIds(r.questionIds) || r.questionIds.length !== EXAM_TOTAL || r.questionIds.some(id => !knownQuestion(id)) || !isCount(r.correct) || !isCount(r.wrong) || !isCount(r.blanks) || !isPct(r.percent) || !Number.isFinite(Number(r.durationSec)) || Number(r.durationSec) < 0 || !r.answers || typeof r.answers !== 'object' || Array.isArray(r.answers)) {
      throw new Error('Backup inválido: histórico de simulados corrompido.');
    }
    if (Number(r.correct) + Number(r.wrong) + Number(r.blanks) !== EXAM_TOTAL || !pctMatches(r.percent, Number(r.correct), EXAM_TOTAL)) throw new Error('Backup inválido: totais do simulado inconsistentes.');
    if (state?.qMap?.size && !validExamDistribution(r.questionIds)) throw new Error('Backup inválido: distribuição do simulado inconsistente.');
    let calcCorrect = 0, calcWrong = 0;
    for (const [id, letter] of Object.entries(r.answers)) {
      if (!r.questionIds.includes(id) || !['A','B'].includes(letter)) throw new Error('Backup inválido: respostas do simulado corrompidas.');
      if (state?.qMap?.size) letter === state.qMap.get(id).gabarito ? calcCorrect++ : calcWrong++;
    }
    if (Object.keys(r.answers).length !== Number(r.correct) + Number(r.wrong) || EXAM_TOTAL - Object.keys(r.answers).length !== Number(r.blanks)) throw new Error('Backup inválido: respostas e totais do simulado inconsistentes.');
    if (state?.qMap?.size && (calcCorrect !== Number(r.correct) || calcWrong !== Number(r.wrong))) throw new Error('Backup inválido: correção do simulado inconsistente.');
  }
  for (const row of db.stores.activeSessions) {
    if (!['training','exam'].includes(row.type) || !row.data || typeof row.data !== 'object' || Array.isArray(row.data) || (row.savedAt != null && !isDate(row.savedAt))) throw new Error('Backup inválido: sessão ativa corrompida.');
    if (state?.qMap?.size) {
      const valid = row.type === 'training' ? isValidTrainingSession(row.data) : isValidExamSession(row.data);
      if (!valid) throw new Error('Backup inválido: conteúdo da sessão ativa corrompido.');
    }
  }
  return payload;
}

function getUiSettings() {
  try {
    const clean = sanitizeUiSettings(JSON.parse(localStorage.getItem(UI_SETTINGS_KEY) || '{}'));
    volatileUiSettings = { ...clean };
    return clean;
  } catch {
    return sanitizeUiSettings(volatileUiSettings);
  }
}

function setUiSetting(key, value) {
  const current = { ...getUiSettings(), [key]: value };
  const clean = sanitizeUiSettings(current);
  volatileUiSettings = { ...clean };
  try { localStorage.setItem(UI_SETTINGS_KEY, JSON.stringify(clean)); }
  catch (error) { console.warn('Preferência mantida apenas nesta sessão porque o localStorage não está disponível.', error); }
  return clean;
}

async function createBackupPayload() {
  const db = await exportDatabase();
  return {
    app: 'TREINA PM AL',
    backupVersion: 1,
    exportedAt: new Date().toISOString(),
    database: db,
    uiSettings: getUiSettings()
  };
}

async function downloadBackup() {
  const payload = await createBackupPayload();
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `treina-pm-al-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function parseBackupFile(file) {
  const text = await file.text();
  let payload;
  try { payload = JSON.parse(text); }
  catch { throw new Error('O arquivo selecionado não contém JSON válido.'); }
  return validateBackupPayload(payload);
}

async function restoreBackup(payload) {
  validateBackupPayload(payload);
  await importDatabase(payload.database);
  const ui = sanitizeUiSettings(payload.uiSettings || {});
  volatileUiSettings = { ...ui };
  try { localStorage.setItem(UI_SETTINGS_KEY, JSON.stringify(ui)); }
  catch (error) { console.warn('Backup restaurado, mas a preferência visual ficou apenas nesta sessão.', error); }
}

async function resetAllProgress() {
  // "Zerar progresso" limpa apenas dados de estudo. Preferências de interface,
  // como a meta diária, são mantidas conforme a descrição desta ação.
  await resetDatabase();
}

function escapeStatic(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function el(tag, { className = '', text = '', attrs = {} } = {}, children = []) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key === 'checked') node.checked = Boolean(value);
    else if (key === 'disabled') node.disabled = Boolean(value);
    else node.setAttribute(key, String(value));
  }
  for (const child of children) if (child) node.append(child);
  return node;
}

function formatDate(iso) {
  if (!iso) return '—';
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return '—';
  try { return new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(date); }
  catch { return '—'; }
}

function formatDuration(seconds = 0) {
  const raw = Number(seconds);
  const s = Number.isFinite(raw) ? Math.max(0, Math.floor(raw)) : 0;
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return h ? `${h}h ${String(m).padStart(2,'0')}min` : `${m}min ${String(sec).padStart(2,'0')}s`;
}

function formatClock(seconds = 0) {
  const raw = Number(seconds);
  const s = Number.isFinite(raw) ? Math.max(0, Math.floor(raw)) : 0;
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function toast(message, type = '') {

}

function confirmModal({ title, message, confirmText = 'Confirmar', danger = false, cancelText = 'Cancelar' }) {
  return new Promise(resolve => {
    if (activeModalCloser) activeModalCloser(false);
    modalRoot.innerHTML = '';
    const previousFocus = document.activeElement;
    const modal = el('div', { className: 'modal', attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-label': title } });
    modal.append(el('h3', { text: title }), el('p', { text: message }));
    const actions = el('div', { className: 'modal-actions' });
    const cancel = el('button', { className: 'btn btn-secondary', text: cancelText, attrs: { type: 'button' } });
    const ok = el('button', { className: `btn ${danger ? 'btn-danger' : 'btn-primary'}`, text: confirmText, attrs: { type: 'button' } });
    let settled = false;
    const close = result => {
      if (settled) return;
      settled = true;
      modalRoot.innerHTML = '';
      modalRoot.onclick = null;
      activeModalCloser = null;
      resolve(result);
      if (previousFocus && typeof previousFocus.focus === 'function' && previousFocus.isConnected) previousFocus.focus();
    };
    activeModalCloser = close;
    cancel.addEventListener('click', () => close(false));
    ok.addEventListener('click', () => close(true));
    modalRoot.onclick = e => { if (e.target === modalRoot) close(false); };
    modal.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const focusable = [...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => !x.disabled);
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    actions.append(cancel, ok); modal.append(actions); modalRoot.append(modal); ok.focus();
  });
}

function stopTimer() {
  if (state.timerHandle) clearInterval(state.timerHandle);
  state.timerHandle = null;
}


function isValidTrainingSession(session) {
  if (!session || session.type !== 'training' || session.endedAt || typeof session.id !== 'string' || !session.id.trim() || !Array.isArray(session.questionIds) || !session.questionIds.length) return false;
  const ids = new Set(session.questionIds);
  if (ids.size !== session.questionIds.length || session.questionIds.some(id => !state.qMap.has(id))) return false;
  if (!Number.isInteger(session.index) || session.index < 0 || session.index >= session.questionIds.length) return false;
  if (Number.isNaN(Date.parse(session.startedAt))) return false;
  if (!['selected','confirmed','cut'].every(k => session[k] && typeof session[k] === 'object' && !Array.isArray(session[k]))) return false;
  for (const [id, letter] of Object.entries(session.selected)) if (!ids.has(id) || !['A','B'].includes(letter)) return false;
  for (const [id, value] of Object.entries(session.confirmed)) {
    const q = state.qMap.get(id);
    if (!ids.has(id) || !q || !value || typeof value !== 'object' || !['A','B'].includes(value.selected) || typeof value.correct !== 'boolean' || value.correct !== (value.selected === q.gabarito) || (value.confirmedAt != null && Number.isNaN(Date.parse(value.confirmedAt)))) return false;
    if (session.selected[id] !== value.selected) return false;
  }
  for (const [id, letters] of Object.entries(session.cut)) if (!ids.has(id) || !Array.isArray(letters) || letters.some(x => !['A','B'].includes(x)) || new Set(letters).size !== letters.length) return false;
  return true;
}

function isValidExamSession(session) {
  if (!session || session.type !== 'exam' || session.finishedAt || typeof session.id !== 'string' || !session.id.trim() || !Array.isArray(session.questionIds) || session.questionIds.length !== EXAM_TOTAL) return false;
  const ids = new Set(session.questionIds);
  if (ids.size !== session.questionIds.length || session.questionIds.some(id => !state.qMap.has(id))) return false;
  if (!Number.isInteger(session.index) || session.index < 0 || session.index >= session.questionIds.length) return false;
  if (Number.isNaN(Date.parse(session.startedAt)) || Number.isNaN(Date.parse(session.endsAt)) || Date.parse(session.endsAt) <= Date.parse(session.startedAt)) return false;
  if (!session.answers || typeof session.answers !== 'object' || Array.isArray(session.answers) || !session.cut || typeof session.cut !== 'object' || Array.isArray(session.cut)) return false;
  for (const [id, letter] of Object.entries(session.answers)) if (!ids.has(id) || !['A','B'].includes(letter)) return false;
  for (const [id, letters] of Object.entries(session.cut)) if (!ids.has(id) || !Array.isArray(letters) || letters.some(x => !['A','B'].includes(x)) || new Set(letters).size !== letters.length) return false;
  for (const rule of DISTRIBUTION) {
    const count = session.questionIds.filter(id => rule.match(state.qMap.get(id).area)).length;
    if (count !== rule.count) return false;
  }
  return true;
}

function stopExamDeadline() {
  if (state.examDeadlineHandle) clearTimeout(state.examDeadlineHandle);
  state.examDeadlineHandle = null;
}

function scheduleExamDeadline(session) {
  stopExamDeadline();
  if (!session || session.finishedAt) return;
  const ms = Math.max(0, new Date(session.endsAt).getTime() - Date.now());
  state.examDeadlineHandle = setTimeout(async () => {
    if (!state.activeExam || state.activeExam.id !== session.id || session.finishedAt || session._finishing) return;
    await autoFinishExam(session);
  }, Math.min(ms + 50, 2147483000));
}

  document.title = `${title} — TREINA PM AL`;

    btn.classList.toggle('is-active', active);
    if (active) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  });

async function navigate(route) {
  if (activeModalCloser) activeModalCloser(false);
  stopTimer();
  state.route = route;
  setPageMeta(route);
  document.body.classList.remove('menu-open');
  mobileMenuBtn.setAttribute('aria-expanded', 'false');
  mobileMenuBtn.setAttribute('aria-label', 'Abrir menu');
  app.innerHTML = '';
  app.setAttribute('aria-busy', 'true');
  try {
    switch (route) {
      case 'home': await renderHome(); break;
      case 'train': await renderTrainSetup(); break;
      case 'training-session': await renderTrainingSession(); break;
      case 'training-result': renderTrainingResult(); break;
      case 'exam': await renderExamSetup(); break;
      case 'exam-session': await renderExamSession(); break;
      case 'exam-result': renderExamResult(state.examResult); break;
      case 'exam-review': renderExamReview(state.selectedExamHistory); break;
      case 'errors': await renderSpecialTraining('errors'); break;
      case 'favorites': await renderSpecialTraining('favorites'); break;
      case 'performance': renderPerformance(); break;
      case 'history': renderHistory(); break;
      case 'settings': renderSettings(); break;
      default: await renderHome();
    }
  } catch (error) {
    console.error(error);
    renderFatal('Não foi possível abrir esta tela.', error.message || String(error));
  } finally {
    app.removeAttribute('aria-busy');
    app.focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
}

      if (result && typeof result.then === 'function') result.catch(error => {

      });
    } catch (error) {

    }
  });
  return b;
}

function makeSelect(label, name, options, value = '', allLabel = 'Todos') {
  const field = el('div', { className: 'form-field' });
  const lab = el('label', { text: label, attrs: { for: name } });
  const select = el('select', { className: 'select', attrs: { id: name, name } });
  const all = el('option', { text: allLabel, attrs: { value: '' } }); select.append(all);
  for (const [val, text] of options) {
    const op = el('option', { text, attrs: { value: val } });
    if (val === value) op.selected = true;
    select.append(op);
  }
  field.append(lab, select); return { field, select };
}

async function renderTrainSetup() {
  await refreshProgress();
  const preset = state.trainPreset || { mode: 'personalizado', filters: {}, amount: 10 };
  state.trainPreset = null;
  await renderTrainingBuilder({
    title: preset.mode === 'rapido' ? 'Treino rápido' : 'Treino personalizado',
    description: preset.mode === 'rapido' ? 'Escolha a quantidade e, se quiser, refine os filtros antes de começar.' : 'Combine matéria, tema, subtema, dificuldade e seu histórico.',
    initialFilters: preset.filters || {},
    initialAmount: preset.amount || 10,
    mode: preset.mode || 'personalizado'
  });
}

async function renderSpecialTraining(kind) {
  await refreshProgress();
  const isErrors = kind === 'errors';

  if (isErrors) {
    const errorRows = state.questions
      .map(q => ({ q, stat: state.statsMap[q.id] }))
      .filter(x => Number(x.stat?.wrong || 0) > 0)
      .sort((a,b) => String(b.stat.lastAttempt || '').localeCompare(String(a.stat.lastAttempt || '')));
    const overview = el('section', { className: 'card section' });
    overview.append(el('h2', { text: 'Histórico dos meus erros' }), el('p', { className: 'section-subtitle', text: 'O histórico não desaparece quando você acerta depois. Questões corrigidas continuam disponíveis para revisão.' }));
    if (!errorRows.length) {
      overview.append(emptyState('✓', 'Você ainda não possui questões erradas', 'Continue treinando. Quando houver um erro, a questão aparecerá aqui automaticamente.'));
    } else {
      const list = el('div', { className: 'list', attrs: { style: 'margin-top:14px' } });
      for (const { q, stat } of errorRows.slice(0, 10)) {
        const corrected = Boolean(stat.correctedAfterError);
        const after = Number(stat.correctAfterError || (corrected ? 1 : 0));
        list.append(el('div', { className: 'list-item' }, [
          el('div', { className: 'list-item-main' }, [
            el('div', { className: 'list-item-title', text: `${q.id} • ${q.tema}` }),
            el('div', { className: 'list-item-sub', text: `${stat.attempts} tentativa(s) • ${stat.wrong} erro(s) • ${after} acerto(s) após erro • última: ${formatDate(stat.lastAttempt)}` })
          ]),
          el('span', { className: `chip ${corrected ? 'easy' : 'hard'}`, text: corrected ? 'Erro corrigido' : 'Revisar' })
        ]));
      }
      if (errorRows.length > 10) list.append(el('div', { className: 'field-hint', text: `Mostrando as 10 mais recentes de ${errorRows.length} questões com erro.` }));
      overview.append(list);
    }
    app.append(overview);
  }

  const specialFilters = isErrors ? { status: 'erradas' } : { onlyFavorites: true };
  const specialAvailable = applyQuestionFilters(state.questions, specialFilters, state.statsMap, state.favorites).length;
  await renderTrainingBuilder({
    title: isErrors ? 'Treinar meus erros' : 'Treinar favoritas',
    description: isErrors ? 'Questões que você já errou permanecem aqui mesmo depois de um acerto posterior.' : 'Monte uma sessão apenas com questões que você favoritou.',
    initialFilters: specialFilters,
    initialAmount: specialAvailable > 0 ? Math.min(10, specialAvailable) : 1,
    mode: isErrors ? 'meus-erros' : 'favoritas',
    lockStatus: isErrors ? 'erradas' : null,
    lockFavorites: !isErrors
  });
}

async function renderTrainingBuilder({ title, description, initialFilters = {}, initialAmount = 10, mode = 'personalizado', lockStatus = null, lockFavorites = false }) {
  const section = el('section', { className: 'card section' });
  section.append(el('div', { className: 'section-head' }, [el('div', {}, [el('h2', { text: title }), el('p', { text: description })])]));
  if (state.activeTraining) {
    section.append(el('div', { className: 'alert alert-info' }, [
      el('span', { text: `Há um treino em andamento (${state.activeTraining.questionIds.length} questões). Você pode continuá-lo ou iniciar outro, descartando a sessão atual.` }),
      button('Continuar treino', 'btn-secondary btn-sm', () => navigate('training-session'))
    ]));
  }
  const form = el('div', { className: 'form-grid' });

  let filters = { area: '', tema: '', subtema: '', dificuldade: '', status: '', onlyFavorites: false, search: '', ...initialFilters };
  if (lockStatus) filters.status = lockStatus;
  if (lockFavorites) filters.onlyFavorites = true;

  const options = getFilterOptions(state.questions, filters);
  const area = makeSelect('Matéria', 'filterArea', options.areas.map(v => [v, displayArea(v)]), filters.area);
  const tema = makeSelect('Tema', 'filterTema', options.temas.map(v => [v, v]), filters.tema);
  const subtema = makeSelect('Subtema', 'filterSubtema', options.subtemas.map(v => [v, v]), filters.subtema);
  const dificuldade = makeSelect('Dificuldade', 'filterDifficulty', [['facil','Fácil'],['intermediaria','Intermediária'],['dificil','Difícil']], filters.dificuldade);
  const status = makeSelect('Histórico', 'filterStatus', [['respondidas','Respondidas'],['nao-respondidas','Não respondidas'],['corretas','Corretas na última tentativa'],['erradas','Já erradas']], filters.status);
  if (lockStatus) status.select.disabled = true;

  const favField = el('div', { className: 'form-field' });
  favField.append(el('label', { text: 'Favoritas' }));
  const checkWrap = el('label', { className: 'inline-check' });
  const favCheck = el('input', { attrs: { type: 'checkbox', checked: filters.onlyFavorites, disabled: lockFavorites } });
  checkWrap.append(favCheck, el('span', { text: 'Somente questões favoritas' })); favField.append(checkWrap);

  const searchField = el('div', { className: 'form-field full' });
  searchField.append(el('label', { text: 'Pesquisar no banco', attrs: { for: 'filterSearch' } }));
  const searchInput = el('input', { className: 'input', attrs: { id: 'filterSearch', type: 'search', placeholder: 'ID, tema, subtema, palavra do enunciado ou tag' } });
  searchInput.value = filters.search || ''; searchField.append(searchInput, el('div', { className: 'field-hint', text: 'A busca ignora maiúsculas/minúsculas e acentuação simples.' }));

  const amountField = el('div', { className: 'form-field' });

async function requestFinishExam(session) {
  const blanks=examBlankCount(session);
  const message=blanks ? `Você ainda possui ${blanks} questões sem resposta. Deseja finalizar mesmo assim?` : 'Deseja finalizar o simulado agora? Depois da entrega, as respostas não poderão ser alteradas.';
  if (!(await confirmModal({title:'Finalizar simulado?',message,confirmText:'Finalizar simulado'}))) return;
  await doFinishExam(session,false);
}

async function autoFinishExam(session) {
  // O timeout e o intervalo visual podem disparar quase ao mesmo tempo.
  // Evita aviso duplicado e uma segunda tentativa concorrente de finalização.
  if (!session || session.finishedAt || session._finishing || !state.activeExam || state.activeExam.id !== session.id) return;
  toast('Tempo esgotado. O simulado foi finalizado automaticamente.','error');
  await doFinishExam(session,true);
}

async function doFinishExam(session, auto) {
  if (!session || session.finishedAt || session._finishing) return;
  stopTimer();
  stopExamDeadline();
  try {
    state.examResult = await finishExam(session, state.qMap, { auto });
    state.activeExam = null;
    await refreshProgress();
    navigate('exam-result');
  } catch(error) {
    // Se ainda houver tempo, restaura o agendamento normal. Depois do prazo,
    // não cria um loop de tentativas a cada ~50 ms em caso de falha de gravação.
    if (!session.finishedAt && examRemainingSeconds(session) > 0) scheduleExamDeadline(session);
    toast(error.message, 'error');
  }
}

async function bootstrap() {
